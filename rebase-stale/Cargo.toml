[package]
name = "rebase-stale"
version = "0.1.0"
edition = "2021"
description = "rebase-stale — rebases a submitted branch that went stale against its land ref mechanically; only a real content conflict or a red gate returns it to a dwarf (sp-x1c6k, replaces spira/rebase-stale.sh)."

[[bin]]
name = "rebase-stale"
path = "src/main.rs"
test = false

[features]
integration = ["hel/integration", "spira-config/integration", "spira-store/integration", "spira-otel/integration", "system-paths/integration", "testkit/integration", "spira-test-id/integration"]
[dependencies]
system-paths = { path = "../system-paths" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
libc = "0.2"
spira-config = { path = "../spira-config" }
spira-store = { path = "../spira-store" }
spira-otel = { path = "../spira-otel" }
hel = { path = "../hel" }

[dev-dependencies]
spira-test-id = { path = "../spira-test-id" }
testkit = { path = "../testkit" }
