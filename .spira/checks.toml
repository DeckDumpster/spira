[[check]]
name = "clippy"
run = "cargo clippy --config profile.dev.incremental=false {affected} --features integration --all-targets -- -D warnings"
budget_ms = 900000

[[check]]
name = "spira-lint"
run = "bash spira/lint-staged.sh --tree --diff refs/heads/local/main"
budget_ms = 300000

