[[habit]]
name = "rustfmt"
glob = "**/*.rs"
run = "rustfmt --check --edition 2021 {file}"
budget_ms = 1500

[[habit]]
name = "complexity"
glob = "**/*.rs"
run = "rust-code-analysis-cli -m -O json -p {file}"
threshold = "cognitive > 20 per function"
budget_ms = 2000

[[habit]]
name = "shellcheck"
glob = "**/*.sh"
run = "shellcheck -f gcc {file}"
budget_ms = 1500

[[stop]]
name = "clippy"
run = "cargo clippy -p {crate} --message-format short"
budget_ms = 150000

[[habit]]
name = "traceability"
glob = "{spira/test-*.sh,**/*.rs,docs/test-plan/*.toml}"
budget_ms = 1500

[[stop]]
name = "unit-tests"
format = "unit-tests"
run = "testenv --suites unit-tests {branch}"
budget_ms = 420000

[[done]]
name = "clippy"
run = "cargo clippy --workspace --all-targets -- -D warnings"
budget_ms = 900000

[[done]]
name = "spira-lint"
run = "spira-lint"
budget_ms = 300000
