[package]
name = "dwarf"
version = "1.0.0"
edition = "2021"
description = "dwarf — the runner called to claim one bead, build its worktree, render its brief, run the model session and account for the outcome (replaces spira/dwarf.sh)."

[lib]
path = "src/lib.rs"

[[bin]]
name = "dwarf"
path = "src/main.rs"

[dependencies]
bead = { path = "../bead" }
spira-config = { path = "../spira-config" }
spira-otel = { path = "../spira-otel" }
strand = { path = "../strand" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
libc = "0.2"
regex = "1"
signal-hook = "0.3"
sha2 = "0.10"

[dev-dependencies]
testkit = { path = "../testkit" }
