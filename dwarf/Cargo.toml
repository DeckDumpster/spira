[package]
name = "dwarf"
version = "1.0.0"
edition = "2021"
autotests = false
description = "dwarf — the runner called to claim one bead, build its worktree, render its brief, run the model session and account for the outcome (replaces spira/dwarf.sh)."

[lib]
path = "src/lib.rs"

[[bin]]
name = "dwarf"
path = "src/main.rs"

[features]
integration = ["bead/integration", "runtime/integration", "spira-config/integration", "spira-store/integration", "spira-otel/integration", "strand/integration", "testkit/integration", "system-paths/integration", "spira-claim/integration", "spira-test-id/integration"]
[dependencies]
bead = { path = "../bead" }
spira-config = { path = "../spira-config" }
spira-store = { path = "../spira-store" }
spira-otel = { path = "../spira-otel" }
strand = { path = "../strand" }
runtime = { path = "../runtime" }
system-paths = { path = "../system-paths" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
libc = "0.2"
regex = "1"
signal-hook = "0.3"
sha2 = "0.10"

[dev-dependencies]
spira-test-id = { path = "../spira-test-id" }
testkit = { path = "../testkit" }
spira-claim = { path = "../spira-claim" }

[[test]]
name = "session_tmp_ignored"
path = "tests/session_tmp_ignored.rs"
required-features = ["integration"]

[[test]]
name = "fences"
path = "tests/fences.rs"
required-features = ["integration"]
