[package]
name = "state-store-sqlite"
version = "0.1.0"
edition = "2021"
autotests = false
description = "state-store-sqlite — the state-store contract's Backend on SQLite (WAL, synchronous=NORMAL with a durable revision jump on open, one exclusive opener), with bulk load, a stepped online backup, an in-memory history ring with an on-disk outbox for the shipper, and state-store-bench: CAS-write latency under load and the conformance suite against a live file."

[lib]
name = "state_store_sqlite"

[[bin]]
name = "state-store-bench"
path = "src/bin/state-store-bench.rs"
test = false

[[test]]
name = "conformance_sqlite"
path = "tests/conformance_sqlite.rs"
required-features = ["integration"]

[[test]]
name = "durability"
path = "tests/durability.rs"
required-features = ["integration"]

[features]
integration = ["runtime/integration", "spira-config/integration", "spira-otel/integration", "state-store/integration", "system-paths/integration", "testkit/integration", "spira-test-id/integration"]
[dependencies]
system-paths = { path = "../system-paths" }
state-store = { path = "../state-store" }
runtime = { path = "../runtime" }
rusqlite = { version = "0.37", features = ["bundled", "backup", "hooks"] }
serde_json = "1"
sha2 = "0.10"
hmac = "0.12"
ureq = { version = "2", default-features = false, features = ["tls"] }
spira-config = { path = "../spira-config" }
spira-otel = { path = "../spira-otel" }

[dev-dependencies]
spira-test-id = { path = "../spira-test-id" }
testkit = { path = "../testkit" }
