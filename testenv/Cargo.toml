[package]
name = "testenv"
version = "1.0.0"
edition = "2021"
description = "testenv — the harness's test runner (replaces spira/testenv-batch.sh, sp-5odic): select suites for a tree, build that tree in place with cargo, run the suites in the fixture container, report a verdict, per-suite results and timings, and cache the verdict by tree."

[lib]
name = "testenv"
path = "src/lib.rs"

[[bin]]
name = "testenv"
path = "src/main.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
regex = "1"
sha2 = "0.10"
libc = "0.2"
spira-config = { path = "../spira-config" }
tsd = { path = "../tsd" }

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
