[package]
name = "testenv"
version = "1.0.0"
edition = "2021"
autotests = false
default-run = "testenv"
description = "testenv — the harness's test runner (replaces spira/testenv-batch.sh, sp-5odic): select suites for a tree, build that tree in place with cargo, run the suites in the fixture container, report a verdict, per-suite results and timings, and cache the verdict by tree."

[lib]
name = "testenv"
path = "src/lib.rs"

[[bin]]
name = "testenv"
path = "src/main.rs"
test = false

[[bin]]
name = "bd-meter"
path = "src/bd_meter_main.rs"
test = false

[[bin]]
name = "testenv-cap"
path = "src/cap_main.rs"
test = false

[[bin]]
name = "target-reap"
path = "src/target_reap_main.rs"
test = false

[[test]]
name = "lint_registry"
path = "tests/lint_registry.rs"
required-features = ["integration"]

[[test]]
name = "target_reap_cli"
path = "tests/target_reap_cli.rs"
required-features = ["integration"]

[[test]]
name = "test_sandbox"
path = "tests/test_sandbox.rs"
required-features = ["integration"]

[[test]]
name = "unit_tests_script"
path = "tests/unit_tests_script.rs"
required-features = ["integration"]

[[test]]
name = "inbox_page"
path = "tests/inbox_page.rs"
required-features = ["integration"]

[features]
integration = ["inbox-rules/integration", "gate/integration", "spira-config/integration", "spira-store/integration", "spira-otel/integration", "suite-select/integration", "system-paths/integration", "testkit/integration", "tsd/integration", "spira-test-id/integration"]
[dependencies]
inbox-rules = { path = "../inbox-rules" }
spira-otel = { path = "../spira-otel" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
regex = "1"
sha2 = "0.10"
libc = "0.2"
spira-config = { path = "../spira-config" }
spira-store = { path = "../spira-store" }
gate = { path = "../gate" }
tsd = { path = "../tsd" }
suite-select = { path = "../suite-select" }
system-paths = { path = "../system-paths" }


[dev-dependencies]
spira-test-id = { path = "../spira-test-id" }
testkit = { path = "../testkit" }
toml = "0.8"
