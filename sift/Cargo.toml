[package]
name = "sift"
version = "0.1.0"
edition = "2021"
description = "sift — the deterministic pre-round screen: conflict, duplicate, and stacked-on-a-reworked-bead, with a per-tip verdict cache, a send-back cap and a fail-open seam. The spira-runtime sift task runs it on the proto-round, never inside a cut."

[lib]
name = "sift"
path = "src/lib.rs"

[[bin]]
name = "sift"
path = "src/main.rs"
test = false

[features]
integration = ["forge/integration", "spira-config/integration", "spira-otel/integration", "system-paths/integration", "testkit/integration", "spira-test-id/integration"]
[dependencies]
system-paths = { path = "../system-paths" }
spira-config = { path = "../spira-config" }
serde_json = "1"
spira-otel = { path = "../spira-otel" }

[dev-dependencies]
spira-test-id = { path = "../spira-test-id" }
testkit = { path = "../testkit" }
forge = { path = "../forge" }
