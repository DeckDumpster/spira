[package]
name = "sift"
version = "0.1.0"
edition = "2021"
description = "sift — the deterministic pre-round screen: conflict, duplicate, and stacked-on-a-reworked-bead, with a per-tip verdict cache, a send-back cap and a fail-open seam. The batcher's `sifts` timer runs it on the proto-round, never inside a cut."

[lib]
name = "sift"
path = "src/lib.rs"

[[bin]]
name = "sift"
path = "src/main.rs"

[dependencies]
spira-config = { path = "../spira-config" }
serde_json = "1"

[dev-dependencies]
testkit = { path = "../testkit" }

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
