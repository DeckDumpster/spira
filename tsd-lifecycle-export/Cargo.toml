[package]
name = "tsd-lifecycle-export"
version = "1.0.0"
edition = "2021"
description = "tsd-lifecycle-export — the one writer of run/tsd/'s bead-stage family: projects the lifecycle event log (legacy bd events before cutover, spira_lifecycle.event after, and a one-time backfill) through the lifecycle crate's own state names."

[dependencies]
lifecycle = { path = "../lifecycle" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
spira-config = { path = "../spira-config" }

[[bin]]
name = "tsd-lifecycle-export"
path = "src/main.rs"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
