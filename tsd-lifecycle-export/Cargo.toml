[package]
name = "tsd-lifecycle-export"
version = "1.0.0"
edition = "2021"
description = "tsd-lifecycle-export — the one writer of the bead-stage family (held in the metrics store): projects the lifecycle event log (legacy bd events before cutover, the control store's events after, and a one-time backfill) through the lifecycle crate's own state names."

[features]
integration = ["lifecycle/integration", "spira-config/integration", "spira-otel/integration", "spira-store/integration", "spira-test-id/integration", "tsd/integration"]
[dependencies]
spira-otel = { path = "../spira-otel" }
tsd = { path = "../tsd" }
lifecycle = { path = "../lifecycle" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
spira-config = { path = "../spira-config" }
spira-store = { path = "../spira-store" }

[[bin]]
name = "tsd-lifecycle-export"
path = "src/main.rs"

[dev-dependencies]
spira-test-id = { path = "../spira-test-id" }
