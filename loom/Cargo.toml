[package]
name = "loom"
version = "1.0.0"
edition = "2021"
description = "Loom — a read endpoint over the live beads graph, with the budget that keeps it cheap."

[dependencies]
spira-config = { path = "../spira-config" }
# axum for the routing, tokio for the process deadline. The deadline is not decoration: a
# query that overruns is KILLED rather than awaited, and `kill_on_drop` on a tokio child is
# what makes dropping the timed-out future actually end the `bd` process.
axum = { version = "0.8", default-features = false, features = ["http1", "tokio"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "process", "time", "net", "sync"] }
serde_json = "1"

[dev-dependencies]
testkit = { path = "../testkit" }
# The suite drives the endpoint over a real socket rather than calling the handler, so it
# needs the stream helpers the server itself does not.
tokio = { version = "1", features = ["io-util"] }

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
