[package]
name = "loom"
version = "1.0.0"
edition = "2021"
autotests = false
description = "Loom — a read endpoint over the live beads graph, with the budget that keeps it cheap."

[[bin]]
name = "loom"
path = "src/main.rs"
test = false

[[test]]
name = "no_fork_edges"
path = "tests/no_fork_edges.rs"
required-features = ["integration"]

[features]
integration = ["cockpit-ops/integration", "lifecycle/integration", "release/integration", "runtime/integration", "spira-claim/integration", "spira-config/integration", "spira-desired-state/integration", "spira-otel/integration", "spira-runtime/integration", "store-view/integration", "testkit/integration", "tsd/integration"]

[dependencies]
spira-config = { path = "../spira-config" }
spira-store = { path = "../spira-store" }
store-view = { path = "../store-view" }
runtime = { path = "../runtime" }
spira-otel = { path = "../spira-otel" }
spira-desired-state = { path = "../desired-state" }
cockpit-ops = { path = "../cockpit/ops" }
release = { path = "../release" }
spira-runtime = { path = "../spira-runtime" }
# axum for the routing, tokio for the process deadline. The deadline is not decoration: a
# query that overruns is KILLED rather than awaited, and `kill_on_drop` on a tokio child is
# what makes dropping the timed-out future actually end the `bd` process.
axum = { version = "0.8", default-features = false, features = ["http1", "tokio"] }
tsd = { path = "../tsd" }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "process", "time", "net", "sync"] }
serde_json = "1"

[dev-dependencies]
testkit = { path = "../testkit" }
spira-claim = { path = "../spira-claim" }
lifecycle = { path = "../lifecycle" }

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
