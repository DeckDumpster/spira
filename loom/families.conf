# kind  glob  family-label
# '*' matches anything, '#' one digit. First matching rule wins.
# session: one transient unit per execution; its family is never judged stale.
# named:   a Concierge transient with a fixed name; in scope though no unit file declares it.
# system:  owned by the OS, not by us; the page folds these away.
session spira-aeon-builder-*.service spira-aeon-builder
session spira-aeon-ops-*.service spira-aeon-ops
session spira-aeon-*.service spira-aeon
session spira-round#*.service spira-round-fixture
session spira-r#*.service spira-round-fixture
session spira-main#-*.service spira-round-fixture
session spira-attr#*.service spira-round-fixture
session spira-acc-*.service spira-round-fixture
session spira-skewevred-*.service spira-round-fixture
session spira-gate-own-*.service spira-round-fixture
session concierge-#*.service concierge-run
named concierge-rounds-loop.service concierge-rounds-loop
session libpod-*.scope libpod
session tmux-spawn-*.scope tmux-spawn
session run-p*-i*.service run-transient
session run-p*-i*.scope run-transient
session run-u*.service run-transient
session run-u*.scope run-transient
system gpg-agent*.service gpg-agent
system gpg-agent*.socket gpg-agent
system dirmngr*.service dirmngr
system ssh-agent*.service ssh-agent
system dbus*.service dbus
system blockdev@*.service blockdev
system pipewire*.service pipewire
system pulseaudio*.service pulseaudio
system wireplumber*.service wireplumber
system gvfs-*.service gvfs
system xdg-*.service xdg
system at-spi-*.service at-spi
system snap.*.service snap
system systemd-*.service systemd
system app-*.scope app
system keyboxd*.service keyboxd
system podman*.service podman
system snapd*.service snapd
system launchpadlib-cache-clean*.service launchpadlib
system pk-debconf-helper*.service pk-debconf-helper
