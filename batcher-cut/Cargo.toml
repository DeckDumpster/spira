[package]
name = "batcher-cut"
version = "0.1.0"
edition = "2021"
description = "batcher-cut — the IO seam (git, testenv-batch, the forge, the bead store) that drives the batcher crate's pure core, wired into the queue in place of batch.sh's cut (sp-jzfog)."

[[bin]]
name = "batcher"
path = "src/main.rs"

[features]
integration = ["batcher/integration", "forge/integration", "gate/integration", "lifecycle/integration", "migration-numbers/integration", "runtime/integration", "sift/integration", "spira-config/integration", "spira-store/integration", "spira-otel/integration", "state-store/integration", "store-view/integration", "suite-select/integration", "testkit/integration", "tsd/integration"]

[dependencies]
batcher = { path = "../batcher" }
sift = { path = "../sift" }
spira-config = { path = "../spira-config" }
spira-store = { path = "../spira-store" }
spira-otel = { path = "../spira-otel" }
suite-select = { path = "../suite-select" }
gate = { path = "../gate" }
lifecycle = { path = "../lifecycle" }
state-store = { path = "../state-store" }
tsd = { path = "../tsd" }
migration-numbers = { path = "../migration-numbers" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
forge = { path = "../forge" }
store-view = { path = "../store-view" }
runtime = { path = "../runtime" }
libc = "0.2"


[dev-dependencies]
testkit = { path = "../testkit" }

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
