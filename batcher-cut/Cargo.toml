[package]
name = "batcher-cut"
version = "0.1.0"
edition = "2021"
autotests = false
description = "batcher-cut — the IO seam (git, testenv-batch, the forge, the bead store) that drives the batcher crate's pure core, wired into the queue in place of batch.sh's cut (sp-jzfog)."

[[bin]]
name = "batcher"
path = "src/main.rs"

[[test]]
name = "inbox_page"
path = "tests/inbox_page.rs"
required-features = ["integration"]

[features]
integration = ["inbox-rules/integration", "batcher/integration", "forge/integration", "gate/integration", "lifecycle/integration", "runtime/integration", "sift/integration", "spira-config/integration", "spira-store/integration", "spira-otel/integration", "state-store/integration", "store-view/integration", "suite-select/integration", "testenv/integration", "testkit/integration", "tsd/integration", "system-paths/integration", "spira-test-id/integration", "spira-lint/integration"]
[dependencies]
inbox-rules = { path = "../inbox-rules" }
system-paths = { path = "../system-paths" }
batcher = { path = "../batcher" }
sift = { path = "../sift" }
spira-config = { path = "../spira-config" }
spira-lint = { path = "../spira-lint" }
spira-store = { path = "../spira-store" }
spira-otel = { path = "../spira-otel" }
suite-select = { path = "../suite-select" }
testenv = { path = "../testenv" }
gate = { path = "../gate" }
lifecycle = { path = "../lifecycle" }
state-store = { path = "../state-store" }
tsd = { path = "../tsd" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
forge = { path = "../forge" }
store-view = { path = "../store-view" }
runtime = { path = "../runtime" }
libc = "0.2"
regex = "1"
sha2 = "0.10"
toml = "0.8"


[[test]]
name = "fence_green"
path = "tests/fence_green.rs"
required-features = ["integration"]

[dev-dependencies]
spira-test-id = { path = "../spira-test-id" }
testkit = { path = "../testkit" }

[package.metadata.spira]
test-bins = ["gate"]
