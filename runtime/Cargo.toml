[package]
name = "runtime"
version = "0.1.0"
edition = "2021"
description = "runtime — the event/handler contract, the Journal trait, the scheduler, the in-process executor and the conformance suite every executor passes."

[features]
integration = []

[dependencies]
lifecycle = { path = "../lifecycle" }
spira-otel = { path = "../spira-otel" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
socket2 = "0.6"
tokio = { version = "1", features = ["rt", "sync", "time", "macros"] }

[target.'cfg(target_os = "linux")'.dependencies]
unit-run = { path = "../unit-run" }

[dev-dependencies]
testkit = { path = "../testkit" }
