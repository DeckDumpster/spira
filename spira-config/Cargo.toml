[package]
name = "spira-config"
version = "1.0.0"
edition = "2021"
autotests = false
default-run = "spira-config"
description = "spira-config — typed spira.toml: schema, validate, get, export --sh, and a converter from spira.conf/repo-map/rune."

[[test]]
name = "admit_cli"
path = "tests/admit_cli.rs"
required-features = ["integration"]

[[test]]
name = "build_dir_cli"
path = "tests/build_dir_cli.rs"
required-features = ["integration"]

[[test]]
name = "convert"
path = "tests/convert.rs"
required-features = ["integration"]

[[test]]
name = "fresh_clone"
path = "tests/fresh_clone.rs"
required-features = ["integration"]

[[test]]
name = "hold_scripts"
path = "tests/hold_scripts.rs"
required-features = ["integration"]

[[test]]
name = "locate_parity"
path = "tests/locate_parity.rs"
required-features = ["integration"]

[[test]]
name = "process_refusal_not_kept"
path = "tests/process_refusal_not_kept.rs"
required-features = ["integration"]

[[test]]
name = "registry_pin"
path = "tests/registry_pin.rs"
required-features = ["integration"]

[[test]]
name = "registry_codegen"
path = "tests/registry_codegen.rs"
required-features = ["integration"]

[[test]]
name = "repo_set_cli"
path = "tests/repo_set_cli.rs"
required-features = ["integration"]

[[test]]
name = "retire"
path = "tests/retire.rs"
required-features = ["integration"]

[[test]]
name = "sccache_server_tmp"
path = "tests/sccache_server_tmp.rs"
required-features = ["integration"]

[[test]]
name = "set_release"
path = "tests/set_release.rs"
required-features = ["integration"]

[[test]]
name = "set_scheduler"
path = "tests/set_scheduler.rs"
required-features = ["integration"]

[[test]]
name = "validate"
path = "tests/validate.rs"
required-features = ["integration"]

[[test]]
name = "cadence_tool"
path = "tests/cadence_tool.rs"
required-features = ["integration"]

[[test]]
name = "deploy_script"
path = "tests/deploy_script.rs"
required-features = ["integration"]

[[test]]
name = "seed_instance"
path = "tests/seed_instance.rs"
required-features = ["integration"]

[[test]]
name = "uninstall_stray"
path = "tests/uninstall_stray.rs"
required-features = ["integration"]

[features]
integration = ["install/integration", "lifecycle/integration", "spira-otel/integration", "system-paths/integration", "testkit/integration", "tsd/integration", "spira-test-id/integration"]
[dependencies]
system-paths = { path = "../system-paths" }
testkit = { path = "../testkit" }
spira-otel = { path = "../spira-otel" }
serde = { version = "1", features = ["derive"] }
toml = "0.8"
toml_edit = "0.22"
serde_json = "1"
serde_path_to_error = "0.1"
sha2 = "0.10"
schemars = "0.8"
libc = "0.2"
tsd = { path = "../tsd" }
lifecycle = { path = "../lifecycle" }

[[bin]]
name = "spira-config"
path = "src/main.rs"
test = false

# The admission pools' agent-facing entry (sp-f4ig1, gate/DESIGN-admission.md): RUSTC_WRAPPER
# mode, `status`, `run`.
[[bin]]
name = "spira-admit"
path = "src/admit_main.rs"
test = false

[[bin]]
name = "spira-build-dir"
path = "src/build_dir_main.rs"
test = false

[[bin]]
name = "tsd-prune"
path = "src/tsd_prune_main.rs"
test = false

[dev-dependencies]
install = { path = "../install" }
spira-test-id = { path = "../spira-test-id" }
