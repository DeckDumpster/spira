[package]
name = "spira-config"
version = "1.0.0"
edition = "2021"
default-run = "spira-config"
description = "spira-config — typed spira.toml: schema, validate, get, export --sh, and a converter from spira.conf/repo-map/rune."
autotests = false

[features]
integration = []

[dependencies]
spira-otel = { path = "../spira-otel" }
serde = { version = "1", features = ["derive"] }
toml = "0.8"
toml_edit = "0.22"
serde_json = "1"
serde_path_to_error = "0.1"
schemars = "0.8"
libc = "0.2"
tsd = { path = "../tsd" }
lifecycle = { path = "../lifecycle" }

[[bin]]
name = "spira-config"
path = "src/main.rs"
test = false

# The admission pools' agent-facing entry (sp-f4ig1, gate/DESIGN-admission.md): RUSTC_WRAPPER
# mode, `status`, `run`.
[[bin]]
name = "spira-admit"
path = "src/admit_main.rs"
test = false

[[bin]]
name = "spira-build-dir"
path = "src/build_dir_main.rs"
test = false

[[bin]]
name = "tsd-prune"
path = "src/tsd_prune_main.rs"
test = false

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true

[dev-dependencies]
testkit = { path = "../testkit" }

[[test]]
name = "build_dir_cli"
path = "tests/build_dir_cli.rs"
required-features = ["integration"]

[[test]]
name = "convert"
path = "tests/convert.rs"
required-features = ["integration"]

[[test]]
name = "locate_parity"
path = "tests/locate_parity.rs"
required-features = ["integration"]

[[test]]
name = "registry_codegen"
path = "tests/registry_codegen.rs"
required-features = ["integration"]

[[test]]
name = "validate"
path = "tests/validate.rs"
required-features = ["integration"]

[[test]]
name = "set_release"
path = "tests/set_release.rs"
required-features = ["integration"]
