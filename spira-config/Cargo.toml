[package]
name = "spira-config"
version = "1.0.0"
edition = "2021"
default-run = "spira-config"
description = "spira-config — typed spira.toml: schema, validate, get, export --sh, and a converter from spira.conf/repo-map/fayth."

[dependencies]
serde = { version = "1", features = ["derive"] }
toml = "0.8"
toml_edit = "0.22"
serde_json = "1"
serde_path_to_error = "0.1"
schemars = "0.8"
libc = "0.2"
tsd = { path = "../tsd" }

[[bin]]
name = "spira-config"
path = "src/main.rs"

# The admission pools' agent-facing entry (sp-f4ig1, gate/DESIGN-admission.md): RUSTC_WRAPPER
# mode, `status`, `run`.
[[bin]]
name = "spira-admit"
path = "src/admit_main.rs"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true

[dev-dependencies]
testkit = { path = "../testkit" }
