# fixture spira.conf — generic values, structurally like a real install's file but with
# no inventory (no real host, path, or person) in it. Used by tests/convert.rs's golden
# test, not by anything the harness itself reads.

SPIRA_HOME_REPO = home
SPIRA_DB = ~/.local/share/spira/db
SPIRA_RUN = $HOME/.local/state/spira
SPIRA_GOAL = sp-goal
SPIRA_PROD = /srv/checkouts/harness-prod/spira
SPIRA_WORKSPACES = /srv/checkouts
SPIRA_DOLT_DATA = /srv/beads
SPIRA_PATH = /opt/spira/bin
SPIRA_WIKI = /srv/checkouts/notes
SPIRA_WIKI_HOOK = /srv/checkouts/notes/bin/synth-statutes
SPIRA_VIEW = /opt/spira/bin/view-follower

SPIRA_OPERATOR = the operator
SPIRA_OPERATOR_ACTOR = operator
SPIRA_TZ = America/Los_Angeles
SPIRA_ASK_LABEL = fixture-ask-label
SPIRA_CI_LABEL = fixture-ci-label
SPIRA_SCOPE_LABEL = myproject

SPIRA_MAX_AEONS = 4
SPIRA_MAX_LIVE_AEONS = 4
SPIRA_FAYTHS = "builder ops"

SPIRA_BATCH_MAXPAR = 8
SPIRA_CERTIFY_PAR = 4
SPIRA_CERTIFY_SUITES = off
SPIRA_CERT_IDLE_SKIP = 0

SPIRA_QUEUE_BATCH_MAX = 6
SPIRA_QUEUE_BATCH_WAIT = 1200
SPIRA_QUEUE_CI_MAXSEC = 21600
SPIRA_QUEUE_LOCAL_GATE = 0
SPIRA_QUEUE_THROTTLE_RELEASE_AT = 12

SPIRA_SUITES_BUDGET = 1800
SPIRA_LOOM_ADDR = 127.0.0.1:8788
SPIRA_LOOM_BUDGET_MS = 1500
SPIRA_MAIL_READERS = concierge=/opt/spira/concierge.sh wake
SPIRA_GH_INTAKE_REPO = example-org/example-repo

COCKPIT_BOTTOM_PCT = 40
COCKPIT_RIGHT_PCT = 45

SPIRA_CZAR_STAGE_DEADLOCK = shadow
