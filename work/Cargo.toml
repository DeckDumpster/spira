[package]
name = "work"
version = "1.0.0"
edition = "2021"
autotests = false
description = "work — the dwarf semantic layer client: show/note/submit/done/blocked/file-followup/split/superseded-by, bound to one called bead and reached only through the spira-lc socket. Holds no DB connection code at all, by construction — the dwarf's environment has no credential for one to hold. Deploys inert."

[features]
integration = ["system-paths/integration", "bead/integration", "forge/integration", "gate/integration", "habits/integration", "repo-contract/integration", "rule/integration", "spira-config/integration", "spira-store/integration", "spira-otel/integration", "testkit/integration", "tsd/integration", "spira-test-id/integration"]
[dependencies]
system-paths = { path = "../system-paths" }
serde_json = "1"
spira-config = { path = "../spira-config" }
spira-store = { path = "../spira-store" }
spira-otel = { path = "../spira-otel" }
habits = { path = "../habits" }
gate = { path = "../gate" }
tsd = { path = "../tsd" }
forge = { path = "../forge" }
bead = { path = "../bead" }
rule = { path = "../rule" }
repo-contract = { path = "../repo-contract" }

[[bin]]
name = "work"
path = "src/main.rs"
test = false

[dev-dependencies]
spira-test-id = { path = "../spira-test-id" }
testkit = { path = "../testkit" }

[[test]]
name = "scratch_gate"
path = "tests/scratch_gate.rs"
required-features = ["integration"]
