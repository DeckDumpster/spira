[package]
name = "pilgrimage"
version = "0.1.0"
edition = "2021"
description = "pilgrimage — the state machine of a feature's walk (waiting, walking, defects-filed, clean, concierge-walk, done): every move a recorded event, a clean close handing the feature to the Concierge, every transition an OTLP point."

[lib]
name = "pilgrimage"
path = "src/lib.rs"

[[bin]]
name = "pilgrimage"
path = "src/main.rs"
test = false

[features]
integration = ["spira-config/integration", "spira-otel/integration", "testkit/integration", "spira-test-id/integration"]
[dependencies]
spira-config = { path = "../spira-config" }
spira-otel = { path = "../spira-otel" }
serde_json = "1"

[dev-dependencies]
spira-test-id = { path = "../spira-test-id" }
testkit = { path = "../testkit" }
