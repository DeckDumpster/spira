[package]
name = "test-registry"
version = "0.1.0"
edition = "2021"
autotests = false
description = "test-registry — the one SQLite file and the one binary that hold each test's lifecycle state (disabled, quarantined) and its history, and answer the deny list at an instant."

[lib]
name = "test_registry"

[[bin]]
name = "test-registry"
path = "src/main.rs"
test = false

[features]
integration = ["runtime/integration", "spira-lint/integration", "spira-config/integration", "spira-otel/integration", "testkit/integration"]

[dependencies]
runtime = { path = "../runtime" }
rusqlite = { version = "0.37", features = ["bundled", "backup"] }
serde_json = "1"
sha2 = "0.10"
spira-config = { path = "../spira-config" }
spira-lint = { path = "../spira-lint" }
spira-otel = { path = "../spira-otel" }

[dev-dependencies]
spira-test-id = { path = "../spira-test-id" }
testkit = { path = "../testkit" }
