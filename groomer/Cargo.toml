[package]
name = "groomer"
version = "1.0.0"
edition = "2021"
autotests = false
description = "groomer — graph hygiene operations for the Spira DAG: split-piece, supersede, close, correct-lane, depends-on-fix, unpoison (delegates to spira-claim), triage-poison, deadlocked, and the hard unwanted refusal. Replaces spira/groomer.sh and spira/groomer-litter-predicate.py."

[[test]]
name = "no_fork_edges"
path = "tests/no_fork_edges.rs"
required-features = ["integration"]

[features]
integration = ["spira-config/integration", "spira-otel/integration", "strand/integration", "testkit/integration"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
spira-config = { path = "../spira-config" }
spira-otel = { path = "../spira-otel" }
strand = { path = "../strand" }

[dev-dependencies]
testkit = { path = "../testkit" }

[[bin]]
name = "groomer"
path = "src/main.rs"
test = false
