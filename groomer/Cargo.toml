[package]
name = "groomer"
version = "1.0.0"
edition = "2021"
description = "groomer — graph hygiene operations for the Spira DAG: split-piece, supersede, close, correct-lane, depends-on-fix, unpoison (delegates to spira-claim), triage-poison, deadlocked, and the hard unwanted refusal. Replaces spira/groomer.sh and spira/groomer-litter-predicate.py."

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
spira-config = { path = "../spira-config" }
strand = { path = "../strand" }

[[bin]]
name = "groomer"
path = "src/main.rs"

[dev-dependencies]
testkit = { path = "../testkit" }
