# acceptance.yml — run acceptance-run.sh against a release tag on a genuinely
# clean machine and record PASS/FAIL in refs/notes/acceptance on the tag.
#
# TRIGGERS
#   push to spira-release-* tags: fired by gate.yml's cut job, which pushes the
#     tag using a GitHub App installation token so the anti-recursion rule does
#     not apply. prev-tag is derived by acceptance-prev-tag.sh, which excludes
#     drafts, when not provided.
#   workflow_dispatch: for manual runs or testing outside the release pipeline.
#     The waive-upgrade input skips derivation and phases B/C/D entirely — an
#     operator escape hatch for when no predecessor has ever passed acceptance;
#     the recorded verdict says so, so a waived publish is never mistaken for a
#     tested upgrade.
#
# THE STUB AGENT. acceptance-agent.sh replaces claude so no model credential is
# needed. It commits acceptance-probe.txt and closes the bead — proving the full
# sentinel → summon → claim → branch → commit → land path deterministically.
#
# TARBALL INSTALL. Phase A downloads the candidate tarball from the draft GitHub
# release created by release.yml and installs via activate.sh + install.sh --skip-build.
# On PASS the draft is published (undrafted). On FAIL the draft is deleted and the
# tag is retracted so no incomplete release is left visible.
#
# RECORDING. acceptance-run.sh --record writes refs/notes/acceptance on the tag.
# When --prev-tag is given, the note also includes an aged-install from=<prev> line
# so each (from, to) upgrade path is queryable. The Push notes step pushes those
# notes back so the verdict persists on the repo. The Step summary step writes a
# one-line summary to the workflow run page.
#
# ACTION REFERENCES. The provision and teardown jobs reference the operator's own
# runner infrastructure (DeckDumpster/ephemeral-ci). A clone replaces these with
# its own or removes the provision/teardown jobs and points runs-on at whatever
# runner it has.

name: Acceptance

on:
  push:
    tags:
      - 'spira-release-*'
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to test (spira-release-*)
        required: true
      prev-tag:
        description: Previous tag for upgrade/rollback/aged-install phases (optional)
        required: false
        default: ''
      waive-upgrade:
        description: Skip prev-tag derivation and phases B/C/D entirely (operator waiver)
        type: boolean
        required: false
        default: false

concurrency:
  group: acceptance-${{ inputs.tag || github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  # ---------------------------------------------------------------------------
  # Create the machine the acceptance run will use.
  # ---------------------------------------------------------------------------
  provision:
    runs-on: ubuntu-latest
    outputs:
      vmid:  ${{ steps.vm.outputs.vmid }}
      label: ${{ steps.vm.outputs.label }}
    steps:
      - uses: DeckDumpster/ephemeral-ci/provision@v1
        id: vm
        with:
          ts-oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          ts-oauth-secret:    ${{ secrets.TS_OAUTH_SECRET }}
          runner-reg-pat:     ${{ secrets.RUNNER_REG_PAT }}
          pve-token-id:       ${{ secrets.PVE_TOKEN_ID }}
          pve-token-secret:   ${{ secrets.PVE_TOKEN_SECRET }}
          pve-api-host:       ${{ vars.PVE_API_HOST }}
          pve-api-hostname:   ${{ vars.PVE_API_HOSTNAME }}
          pve-node:           ${{ vars.PVE_NODE }}
          template-vmid:      ${{ vars.TEMPLATE_VMID }}

  # ---------------------------------------------------------------------------
  # The acceptance run itself, on the provisioned machine.
  # ---------------------------------------------------------------------------
  acceptance:
    needs: provision
    runs-on: [self-hosted, "${{ needs.provision.outputs.label }}"]
    # Phase D (aged-install) adds ~30 min to the fresh-install run. 90 min
    # covers all four phases (A fresh, B upgrade, C rollback, D aged-install)
    # with margin for slow package installs on the ephemeral VM.
    timeout-minutes: 90
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0
          fetch-tags: true

      - name: Confirm provisioned machine
        run: test "$RUNNER_NAME" = "${{ needs.provision.outputs.label }}"

      - name: Stop apt automation
        run: |
          sudo systemctl mask --now apt-daily.timer apt-daily-upgrade.timer unattended-upgrades.service
          sudo systemctl stop apt-daily-upgrade.service apt-daily.service unattended-upgrades.service || true
          sudo dpkg --configure -a || true

      - name: Enable systemd user session
        # The runner process is not a login session, so XDG_RUNTIME_DIR may be
        # unset and /run/user/<uid> may not exist. Linger creates the runtime
        # directory and starts the user systemd manager so systemctl --user works.
        # Both variables are written to GITHUB_ENV so every subsequent step,
        # including subprocesses of install.sh, inherits them without explicit env:.
        run: |
          sudo loginctl enable-linger "$USER"
          _xdg="/run/user/$(id -u)"
          echo "XDG_RUNTIME_DIR=${_xdg}" >> "$GITHUB_ENV"
          echo "DBUS_SESSION_BUS_ADDRESS=unix:path=${_xdg}/bus" >> "$GITHUB_ENV"
          for i in $(seq 10); do
            XDG_RUNTIME_DIR="${_xdg}" systemctl --user is-system-running >/dev/null 2>&1 && break
            sleep 1
          done

      - name: Install gh
        run: |
          if ! command -v gh >/dev/null 2>&1; then
            mkdir -p /etc/apt/keyrings
            curl -fsSL https://cli.github.com/packages/githubcli-archive-keyring.gpg \
              | sudo gpg --dearmor -o /usr/share/keyrings/githubcli-archive-keyring.gpg
            sudo chmod go+r /usr/share/keyrings/githubcli-archive-keyring.gpg
            printf 'deb [arch=%s signed-by=/usr/share/keyrings/githubcli-archive-keyring.gpg] https://cli.github.com/packages stable main\n' \
              "$(dpkg --print-architecture)" \
              | sudo tee /etc/apt/sources.list.d/github-cli.list
            sudo apt-get update -q && sudo apt-get install -yq gh
          fi

      - name: Install bd
        # build-bd.sh --from-release downloads the pinned release binary (SPIRA_BD_TAG
        # from conf.sh) and installs it to $HOME/.local/bin/bd and bd-embedded.
        # The schema check is skipped when no existing store is present — correct for a
        # fresh machine where the db has not been created yet.
        run: bash spira/build-bd.sh --from-release --install

      - name: Install dolt
        # Dolt version is pinned in testenv/Containerfile (DOLT_VERSION) to keep
        # the acceptance test environment consistent with the suite container.
        run: |
          _dolt_ver="$(grep '^ARG DOLT_VERSION=' spira/testenv/Containerfile | cut -d= -f2)"
          _arch="$(uname -m)"; [ "$_arch" = x86_64 ] && _arch=amd64
          curl -fsSL \
            "https://github.com/dolthub/dolt/releases/download/v${_dolt_ver}/dolt-linux-${_arch}.tar.gz" \
            | tar -xz -C /tmp
          sudo install -m 0755 "/tmp/dolt-linux-${_arch}/bin/dolt" /usr/local/bin/dolt

      - name: Run acceptance (scratch repo, config, run, verdict)
        # acceptance-ci.sh creates the scratch repo with --initial-branch=main,
        # writes the repo-map, calls acceptance-run.sh, pushes notes, and writes
        # the step summary. Exercisable by test-acceptance-ci.sh without the forge.
        env:
          CONFIGURE_MAX_AEONS: "1"
          CONFIGURE_MAX_LIVE_AEONS: ""
          CONFIGURE_DOLT_DATA: ""
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -uo pipefail
          _tag="${{ inputs.tag || github.ref_name }}"
          _prev="${{ inputs.prev-tag || '' }}"
          _waive="${{ inputs.waive-upgrade || 'false' }}"
          _args=("$_tag"
                 --bd-db  "$HOME/.local/share/spira/db"
                 --agent  "$GITHUB_WORKSPACE/spira/acceptance-agent.sh"
                 --record)
          if [ "$_waive" = "true" ]; then
            # Operator waiver (workflow_dispatch only, never a tag push): skip
            # derivation entirely so no prev-tag is passed at all, and acceptance-run.sh
            # prints its existing "skip phase B+C / phase D" lines.
            _args+=(--waive-upgrade)
          else
            # When triggered by a tag push the prev-tag input is unavailable; derive
            # the newest PUBLISHED predecessor so upgrade/rollback phases test a tag
            # that actually passed acceptance, never an unaccepted draft.
            if [ -z "${_prev:-}" ]; then
              _prev="$(bash spira/acceptance-prev-tag.sh "$_tag" --repo "$GITHUB_REPOSITORY" || true)"
            fi
            [ -n "${_prev:-}" ] && _args+=(--prev-tag "$_prev")
          fi
          bash spira/acceptance-ci.sh "${_args[@]}"

      - name: Upload forensics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: acceptance-forensics-${{ inputs.tag || github.ref_name }}
          path: ~/acceptance-forensics
          if-no-files-found: warn

      - name: Publish release on PASS
        # The release was created as a draft by release.yml so acceptance could test the
        # exact artifact. Undraft it now that acceptance passed.
        if: success()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          _tag="${{ inputs.tag || github.ref_name }}"
          gh release edit "$_tag" --draft=false --repo "$GITHUB_REPOSITORY"
          printf 'acceptance: published %s\n' "$_tag"

      - name: Retract release and tag on FAIL
        # Delete the draft release and the tag so no broken release is left visible.
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          _tag="${{ inputs.tag || github.ref_name }}"
          gh release delete "$_tag" --yes --repo "$GITHUB_REPOSITORY" 2>/dev/null || true
          gh api --method DELETE "repos/$GITHUB_REPOSITORY/git/refs/tags/$_tag" 2>/dev/null || true
          printf 'acceptance: retracted draft release and tag %s\n' "$_tag"

  # ---------------------------------------------------------------------------
  # Destroy the machine. Runs even when provision or acceptance fail.
  # ---------------------------------------------------------------------------
  teardown:
    needs: [provision, acceptance]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: DeckDumpster/ephemeral-ci/teardown@v1
        with:
          vmid:  ${{ needs.provision.outputs.vmid }}
          label: ${{ needs.provision.outputs.label }}
          runner-reg-pat:     ${{ secrets.RUNNER_REG_PAT }}
          ts-oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          ts-oauth-secret:    ${{ secrets.TS_OAUTH_SECRET }}
          pve-token-id:       ${{ secrets.PVE_TOKEN_ID }}
          pve-token-secret:   ${{ secrets.PVE_TOKEN_SECRET }}
          pve-api-host:       ${{ vars.PVE_API_HOST }}
          pve-api-hostname:   ${{ vars.PVE_API_HOSTNAME }}
          pve-ca-cert:        ${{ vars.PVE_CA_CERT }}
          pve-node:           ${{ vars.PVE_NODE }}
          template-vmid:      ${{ vars.TEMPLATE_VMID }}
