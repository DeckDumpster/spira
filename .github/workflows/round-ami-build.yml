# round-ami-build.yml — build the EC2 round image the round-vm EC2 provider launches.
#
# The tag `recipe-sha` is `round-vm recipe-sha`, the same function the provider compares
# against, so a recipe change makes the older image refused rather than silently used.
# Triggers: a recipe change on main, weekly (base-OS and package drift), dispatch. A round whose
# head changes the recipe dispatches this on a `spira-round-candidate/*` branch so it certifies on
# its own image before it lands; main's push build then finds that image tagged and builds nothing.
# An image built for a candidate that never lands ages out with the rest of the round images.
# Configuration is repository variables: ROUND_AMI_ROLE_ARN (the OIDC build role),
# ROUND_AMI_REGION, ROUND_AMI_SUBNET, ROUND_AMI_SECURITY_GROUP, ROUND_AMI_INSTANCE_PROFILE
# (SSM-managed), ROUND_AMI_STAGING_BUCKET, ROUND_AMI_BASE_PARAM (SSM parameter naming the
# base OS image), ROUND_AMI_INSTANCE_TYPE.

name: Round AMI

on:
  push:
    branches: [main]
    paths:
      - round-vm/ami-setup.sh
      - round-vm/src/template.sh
      - round-vm/src/recipe.rs
      - rust-toolchain.toml
      - flake.nix
      - flake.lock
      - spira/testenv/Containerfile
      - .github/workflows/round-ami-build.yml
  schedule:
    - cron: "17 5 * * 1"
  workflow_dispatch:
    inputs:
      force:
        description: Rebuild even when an image already carries this recipe
        type: boolean
        default: false

concurrency:
  group: round-ami-build
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write

jobs:
  build:
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/heads/spira-round-candidate/')
    runs-on: ubuntu-latest
    # ceil((2 * (600 stock instance-status waiter + SETUP_MAX) + WAIT_MAX) / 60) + 5
    timeout-minutes: 97
    env:
      AWS_REGION: ${{ vars.ROUND_AMI_REGION }}
      # Longest successful whole run of this workflow, 480s (2026-11-25), x 3. A phase cannot
      # outlast its run, so this bounds the setup command from above.
      ROUND_AMI_SETUP_MAX: 1440
      ROUND_AMI_SETUP_INTERVAL: 30
      # The same measurement (480s whole run, 2026-11-25, x 3), bounding the image wait.
      ROUND_AMI_WAIT_MAX: 1440
    steps:
      - uses: actions/checkout@v4

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.ROUND_AMI_ROLE_ARN }}
          aws-region: ${{ vars.ROUND_AMI_REGION }}

      - name: Recipe hash
        id: recipe
        run: |
          set -euo pipefail
          sha="$(cargo run -q --locked -p round-vm -- recipe-sha)"
          [ -n "$sha" ] || { echo "empty recipe hash" >&2; exit 1; }
          echo "sha=$sha" >> "$GITHUB_OUTPUT"

      - name: Skip when this recipe already has an image
        id: have
        run: |
          set -euo pipefail
          cutoff="$(date -u -d '7 days ago' +%Y-%m-%dT%H:%M:%S)"
          filters=(--owners self --filters "Name=tag:spill:owner,Values=round" "Name=tag:recipe-sha,Values=${{ steps.recipe.outputs.sha }}")
          fresh="$(aws ec2 describe-images "${filters[@]}" --query "length(Images[?CreationDate>='$cutoff'])" --output text)"
          any="$(aws ec2 describe-images "${filters[@]}" --query "length(Images)" --output text)"
          if [ "$fresh" != 0 ] && [ "${{ github.event_name }}" = schedule ]; then echo "fresh=1" >> "$GITHUB_OUTPUT"; fi
          if [ "$any" != 0 ] && [ "${{ github.event_name }}" = push ]; then echo "fresh=1" >> "$GITHUB_OUTPUT"; fi
          if [ "$any" != 0 ] && [ "${{ github.event_name }}" = workflow_dispatch ] && [ "${{ inputs.force }}" != true ]; then echo "fresh=1" >> "$GITHUB_OUTPUT"; fi
          if [ "$any" != 0 ] && [ "$GITHUB_REF" != refs/heads/main ] && [ "${{ inputs.force }}" != true ]; then echo "fresh=1" >> "$GITHUB_OUTPUT"; fi

      - name: Stage the tree
        if: steps.have.outputs.fresh != '1'
        run: |
          set -euo pipefail
          git archive --format=tar.gz -o "$RUNNER_TEMP/tree.tgz" HEAD
          aws s3 cp "$RUNNER_TEMP/tree.tgz" "s3://${{ vars.ROUND_AMI_STAGING_BUCKET }}/round-ami/${{ github.run_id }}.tgz"

      - name: Build, image and tag
        if: steps.have.outputs.fresh != '1'
        env:
          SHA: ${{ steps.recipe.outputs.sha }}
        run: |
          set -euo pipefail
          base="$(aws ssm get-parameter --name "${{ vars.ROUND_AMI_BASE_PARAM }}" --query Parameter.Value --output text)"
          toolchain="$(sed -n 's/^channel *= *"\(.*\)"/\1/p' rust-toolchain.toml)"
          status_file="$RUNNER_TEMP/setup-status"
          ids=()
          trap '[ "${#ids[@]}" = 0 ] || aws ec2 terminate-instances --instance-ids "${ids[@]}" >/dev/null || true' EXIT

          # Returns 0 set up, 3 hung (phase, hung_after and last say where), 1 failed.
          # errexit is off inside a function whose status is tested, so every step returns itself.
          attempt() {
            local url cmds cid started rc
            phase=launch
            id="$(aws ec2 run-instances --image-id "$base" \
              --instance-type "${{ vars.ROUND_AMI_INSTANCE_TYPE }}" \
              --subnet-id "${{ vars.ROUND_AMI_SUBNET }}" \
              --security-group-ids "${{ vars.ROUND_AMI_SECURITY_GROUP }}" \
              --iam-instance-profile "Name=${{ vars.ROUND_AMI_INSTANCE_PROFILE }}" \
              --block-device-mappings 'DeviceName=/dev/sda1,Ebs={VolumeSize=100,VolumeType=gp3}' \
              --instance-initiated-shutdown-behavior terminate \
              --tag-specifications "ResourceType=instance,Tags=[{Key=spill:owner,Value=round},{Key=Name,Value=spira-round-build}]" \
              --query 'Instances[0].InstanceId' --output text)" || return 1
            ids+=("$id")
            echo "launched $id"

            phase=instance-status
            started=$SECONDS
            if ! aws ec2 wait instance-status-ok --instance-ids "$id"; then
              hung_after=$((SECONDS - started))
              last="$(aws ec2 describe-instance-status --instance-ids "$id" --include-all-instances \
                --query 'InstanceStatuses[0].[InstanceState.Name,InstanceStatus.Status,SystemStatus.Status]' --output text | tr '\t' '/')"
              last="${last:-unknown}"
              echo "$id did not reach instance-status-ok; last reported $last"
              echo "--- console output of $id (tail)"
              aws ec2 get-console-output --instance-id "$id" --latest --output text | tail -n 60
              return 3
            fi

            phase=setup
            url="$(aws s3 presign "s3://${{ vars.ROUND_AMI_STAGING_BUCKET }}/round-ami/${{ github.run_id }}.tgz" --expires-in 14400)" || return 1
            cmds="$(jq -nc --arg u "$url" --arg t "$toolchain" \
              -f round-vm/ssm-commands.jq)" || return 1
            cid="$(aws ssm send-command --instance-ids "$id" --document-name AWS-RunShellScript \
              --timeout-seconds "$ROUND_AMI_SETUP_MAX" --parameters "$cmds" --query Command.CommandId --output text)" || return 1
            started=$SECONDS
            rm -f "$status_file"
            rc=0
            ROUND_AMI_SETUP_STATUS_FILE="$status_file" bash round-vm/wait-setup.sh "$cid" "$id" || rc=$?
            hung_after=$((SECONDS - started))
            last="$(cat "$status_file" 2>/dev/null || echo unknown)"
            return "$rc"
          }

          rc=0
          attempt || rc=$?
          if [ "$rc" = 3 ]; then
            first="$id"
            echo "::warning title=round image setup hung::attempt 1 on $first hung in $phase after ${hung_after}s (last status $last); retrying on a new instance"
            aws ec2 terminate-instances --instance-ids "$first" >/dev/null || echo "could not terminate $first; retried at exit" >&2
            rc=0
            attempt || rc=$?
            if [ "$rc" = 3 ]; then
              echo "attempt 2 on $id hung in $phase after ${hung_after}s (last status $last)" >&2
              echo "round image setup hung twice ($first, $id)" >&2
              exit 1
            fi
          fi
          [ "$rc" = 0 ] || { echo "round image setup failed on $id in $phase" >&2; exit 1; }

          ami="$(aws ec2 create-image --instance-id "$id" --name "spira-round-$SHA-$(date -u +%Y%m%d%H%M%S)" \
            --tag-specifications \
              "ResourceType=image,Tags=[{Key=spill:owner,Value=round},{Key=Name,Value=spira-round},{Key=recipe-sha,Value=$SHA}]" \
              "ResourceType=snapshot,Tags=[{Key=spill:owner,Value=round}]" \
            --query ImageId --output text)"
          bash round-vm/wait-image.sh "$ami"
          echo "built $ami recipe-sha=$SHA"

      - name: Remove the staged tree
        if: always() && steps.have.outputs.fresh != '1'
        run: aws s3 rm "s3://${{ vars.ROUND_AMI_STAGING_BUCKET }}/round-ami/${{ github.run_id }}.tgz" || true
