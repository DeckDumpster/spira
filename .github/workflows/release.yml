# release.yml — build and publish a Spira release tarball.
#
# Triggered by every spira-release-* tag pushed to the repository. The tag is
# cut by release.sh; this workflow builds both Rust binaries against the pinned
# toolchain, assembles the tarball via build-tarball.sh, and attaches it to a
# GitHub release of the same name.
#
# TOOLCHAIN PINNING
# The lockfile version (v4) requires Rust >= 1.78. The version is pinned to a
# specific semver — never "stable" — so a runner upgrade cannot silently change
# what binary ships. An assertion step exits non-zero if the installed version
# does not match the pin, so a mismatch is a hard failure rather than invisible
# drift.
#
# FAILURE SEMANTICS
# Every build step runs with the default failure policy: a step that exits
# non-zero fails the job and the publish step never runs. A build that fails
# silently publishes a broken binary; this workflow publishes nothing instead.

# TWO WAYS IN, ONE BUILD. The tag trigger stays for a tag pushed by hand. gate.yml
# calls this workflow directly after it cuts a tag, because GitHub does not start a
# workflow for a tag pushed with GITHUB_TOKEN — a deliberate anti-recursion rule,
# and a silent one: the tag appears, the release never does, and nothing reports a
# failure. Relying on the trigger there would produce tags with no releases forever.

name: Release

on:
  push:
    tags:
      - 'spira-release-*'
  workflow_call:
    inputs:
      tag:
        description: 'Release tag to build and publish'
        required: true
        type: string

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # The called path must build the TAG, not the branch the caller ran on.
          ref: ${{ inputs.tag || github.ref_name }}
          fetch-depth: 0
          fetch-tags: true

      - name: Install Rust 1.82.0
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: '1.82.0'

      - name: Assert Rust version
        # The installed version must match the pinned value exactly. A runner
        # whose default Rust differs from the pin would otherwise produce
        # binaries built against an unrecorded toolchain.
        run: |
          got=$(rustc --version | awk '{print $2}')
          [ "$got" = "1.82.0" ] || {
            printf 'expected Rust 1.82.0, got %s\n' "$got" >&2
            exit 1
          }

      - name: Build loom
        run: cargo build --release
        working-directory: loom

      - name: Build panel
        run: cargo build --release
        working-directory: cockpit/panel

      - name: Build broker
        run: cargo build --release
        working-directory: broker

      - name: Build release tarball
        id: tarball
        run: |
          tag="${{ inputs.tag || github.ref_name }}"
          # Derive the tarball stem from the tag so both share one timestamp.
          # Tag form: spira-release-<reponame>-<YYYYMMDDTHHMMSSZ>
          # Tarball stem: spira-<YYYYMMDDTHHMMSSZ>
          ts="${tag##*-}"
          tarball=$(bash spira/build-tarball.sh build \
            --loom-bin loom/target/release/loom \
            --panel-bin cockpit/panel/target/release/panel \
            --broker-bin broker/target/release/broker \
            --output /tmp/artifacts \
            --name "spira-${ts}")
          printf 'path=%s\n' "$tarball" >> "$GITHUB_OUTPUT"

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tag="${{ inputs.tag || github.ref_name }}"
          gh release create "$tag" \
            --title "$tag" \
            "${{ steps.tarball.outputs.path }}"
