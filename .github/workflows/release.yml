# release.yml — build and publish a Spira release tarball.
#
# Called by gate.yml's publish job for each spira-release-* tag its cut job pushes. The tag is
# cut by release.sh; this workflow builds both Rust binaries against the pinned
# toolchain, assembles the tarball via build-tarball.sh, and attaches it to a
# GitHub release of the same name.
#
# TOOLCHAIN PINNING
# The version comes from rust-toolchain.toml at the workspace root — never
# "stable" — so a runner upgrade cannot silently change what binary ships, and
# gate.yml and this workflow cannot disagree about which version they mean. An
# assertion step exits non-zero if the installed version does not match the
# pin, so a mismatch is a hard failure rather than invisible drift.
#
# FAILURE SEMANTICS
# Every build step runs with the default failure policy: a step that exits
# non-zero fails the job and the publish step never runs. A build that fails
# silently publishes a broken binary; this workflow publishes nothing instead.

# ONE WAY IN. gate.yml's publish job calls this workflow after it cuts a tag. There is
# no push trigger: the cut pushes the tag with an App token, so a trigger would build
# and release the same tag a second time.

name: Release

on:
  workflow_call:
    inputs:
      tag:
        description: 'Release tag to build and publish'
        required: true
        type: string

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # The called path must build the TAG, not the branch the caller ran on.
          ref: ${{ inputs.tag }}
          fetch-depth: 0
          fetch-tags: true

      - name: Read pinned toolchain
        id: toolchain
        run: |
          v=$(sed -n 's/^channel *= *"\(.*\)"/\1/p' rust-toolchain.toml)
          [ -n "$v" ] || { printf 'rust-toolchain.toml has no channel\n' >&2; exit 1; }
          printf 'version=%s\n' "$v" >> "$GITHUB_OUTPUT"

      - name: Install Rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ steps.toolchain.outputs.version }}

      - name: Assert Rust version
        # The installed version must match the pinned value exactly. A runner
        # whose default Rust differs from the pin would otherwise produce
        # binaries built against an unrecorded toolchain.
        run: |
          got=$(rustc --version | awk '{print $2}')
          want="${{ steps.toolchain.outputs.version }}"
          [ "$got" = "$want" ] || {
            printf 'expected Rust %s (rust-toolchain.toml), got %s\n' "$want" "$got" >&2
            exit 1
          }

      - name: Install Nix
        # build-aerc.sh takes its go from the harness flake's spira-env when the runner has
        # none usable; ubuntu-latest has neither go at GO_MIN nor nix.
        uses: cachix/install-nix-action@v31

      - name: Build
        run: make build

      - name: Build release tarball
        id: tarball
        run: |
          tag="${{ inputs.tag }}"
          # Derive the tarball stem from the tag so both share one timestamp.
          # Tag form: spira-release-<reponame>-<YYYYMMDDTHHMMSSZ>
          # Tarball stem: spira-<YYYYMMDDTHHMMSSZ>
          ts="${tag##*-}"
          # --repo-name carries the tag's reponame into MANIFEST, so an installed
          # release resolves its identity from that stamp rather than from its own
          # directory name (spira-<timestamp>, which changes on every upgrade).
          reponame="${tag#spira-release-}"
          reponame="${reponame%-"$ts"}"
          tarball=$(bash spira/build-tarball.sh build \
            --workspace . \
            --output /tmp/artifacts \
            --name "spira-${ts}" \
            --repo-name "$reponame" \
            --release-repo "$GITHUB_REPOSITORY")
          printf 'path=%s\n' "$tarball" >> "$GITHUB_OUTPUT"
          tar -tzf "$tarball" | grep -q '/vendor/bin/aerc$' || {
            printf 'release: %s carries no vendor/bin/aerc\n' "$tarball" >&2; exit 1; }

      - name: Create GitHub release (draft)
        # Draft: acceptance downloads and tests this tarball before it is published.
        # acceptance.yml publishes (undrafts) on PASS; on FAIL it deletes the draft.
        #
        # --target PINS THE COMMIT. Without it, a tag that has not yet reached the
        # remote has no commit to bind to, and GitHub mints one at the default
        # branch's head at whatever moment the release is later published — not the
        # commit this job built (sp-j7t1e). The checked-out HEAD is that commit.
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tag="${{ inputs.tag }}"
          sha="$(git rev-parse HEAD)"
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release view "$tag" --json assets --jq '.assets[].name' | grep -q '^spira-.*\.tar\.gz$' || {
              printf 'release: %s exists without a tarball asset\n' "$tag" >&2; exit 1; }
            printf 'release: %s already exists with its tarball — not creating a second\n' "$tag"
            exit 0
          fi
          gh release create "$tag" \
            --title "$tag" \
            --target "$sha" \
            --draft \
            "${{ steps.tarball.outputs.path }}"
