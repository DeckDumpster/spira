# gate.yml — run the landing gate in CI, and cut a release from a gate that passed.
#
# This is the same gate the harness runs locally: the three lints, then the suite
# corpus inside a container via testenv-batch.sh. A CI job that ran a cheaper
# subset would produce a green that does not mean what a local green means, and
# the whole point of gating here is that the two agree.
#
# THE RUNNER DOES NOT EXIST UNTIL THIS WORKFLOW CREATES IT. There is no standing
# pool of self-hosted machines. `provision` clones a virtual machine that has
# never run anything else, registers it as a runner under a label unique to this
# run, and `teardown` destroys it. So the gate job's `runs-on` is an expression,
# not a fixed label: a job naming a fixed label would wait for a runner nobody
# registers, which does not fail — it queues, silently, forever.
#
# WHY A FRESH MACHINE AND NOT A LONG-LIVED ONE. The suites install systemd user
# units, start timers and drive a terminal multiplexer. On a shared runner that
# is contamination in both directions: this repository's suites corrupting a
# neighbour's run, and undeclared state left by a neighbour deciding this one's
# verdict. A machine with no history is the only environment in which a green
# means what it says.
#
# PULL REQUEST vs PUSH ARE DIFFERENT GATES, AND MUST BE.
#   On a pull request, testenv-batch.sh derives the suite selection from the diff
#   against the base ref. That is the right, fast answer for a branch.
#   On a push to the base branch that diff is EMPTY. Diff-derived selection would
#   select nothing, exit 0, and cut a release off a gate that ran zero suites — a
#   green that means "nothing was tested". So the push gate names the whole
#   corpus explicitly (law-a-runner-takes-a-list), and that is the run a release
#   is cut from.
#
# EXIT 75 IS NOT A BRANCH FAILURE. testenv-batch exits 2 when the container never
# came up and 3 when the install inside it failed. In both cases the branch was
# never tested, so reporting it as tested-and-bad is a lie in the expensive
# direction — someone goes looking for a defect that was never demonstrated. Those
# map to 75, matching the repo-map's gate command, and the job says so. A missing
# host dependency would land in that same bucket and read as "retry me" forever,
# which is why runner-deps.sh runs first and fails with 1 on its own account.
#
# A FORK PULL REQUEST CANNOT RUN THIS. `provision` needs repository secrets and a
# fork does not receive them, so the provision job fails and no runner is ever
# created. That is the intended boundary, not a defect: it is what makes a
# per-run machine safe to offer to a public repository at all.
#
# THE ACTION REFERENCES BELOW NAME THE OPERATOR'S OWN RUNNER INFRASTRUCTURE, which
# is otherwise kept out of this repository. `uses:` cannot take an expression, so
# there is no way to make it configurable; a clone replaces these two references
# with its own, or deletes the provision and teardown jobs and points `runs-on` at
# whatever it has.

name: Gate

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  # merge_group fires when GitHub's merge queue groups commits before landing.
  # It replaces N per-push full gates with one batched gate. See: branch
  # protection → merge queue → required status checks must name "gate" to
  # match the job name below (law-a-documented-control-must-exist).
  #
  # SEQUENCING: do not enable the queue in branch protection until at least
  # one push gate has completed green. A queue in front of a gate that has
  # never passed blocks every merge indefinitely.
  merge_group:
  workflow_dispatch:

# A superseded pull-request run is cancelled; a push to the base branch is never
# cancelled, because a cancelled push is never gated — and the next cut then carries
# those commits into a release as though they had passed a gate that never ran.
#
# THE GROUP CARRIES THAT, NOT THE FLAG. This was written as a fixed group with
# cancel-in-progress set to an expression meant to be false on a push, and the
# expression did not hold: two consecutive pushes were each cancelled at the instant
# the next arrived, so neither was gated and neither was cut. Keying the group on the
# commit makes two push runs structurally incapable of sharing a group, so there is
# nothing for cancellation to act on however the flag is coerced. A pull request still
# keys on its ref and still supersedes itself, which is wanted: no release is cut from
# a pull-request run, so cancelling one costs nothing.
#
# merge_group behaves like push: each entry has a unique SHA, so keying on the SHA
# prevents cancellation between distinct queue entries. A re-run of the same entry
# would share a group and cancel the old run, which is wanted.
concurrency:
  group: gate-${{ (github.event_name == 'push' || github.event_name == 'merge_group') && github.sha || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  # ---------------------------------------------------------------------------
  # Create the machine the gate will run on.
  # ---------------------------------------------------------------------------
  provision:
    runs-on: ubuntu-latest
    outputs:
      vmid:  ${{ steps.vm.outputs.vmid }}
      label: ${{ steps.vm.outputs.label }}
    steps:
      - uses: DeckDumpster/ephemeral-ci/provision@v1
        id: vm
        with:
          ts-oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          ts-oauth-secret:    ${{ secrets.TS_OAUTH_SECRET }}
          runner-reg-pat:     ${{ secrets.RUNNER_REG_PAT }}
          pve-token-id:       ${{ secrets.PVE_TOKEN_ID }}
          pve-token-secret:   ${{ secrets.PVE_TOKEN_SECRET }}
          pve-api-host:       ${{ vars.PVE_API_HOST }}
          pve-node:           ${{ vars.PVE_NODE }}
          template-vmid:      ${{ vars.TEMPLATE_VMID }}

  # ---------------------------------------------------------------------------
  # The gate itself, on the machine provisioned above.
  #
  # THE JOB NAME IS A CONTRACT the moment a branch ruleset requires it. A required
  # status check that never reports does not fail a pull request — it blocks the
  # merge indefinitely with "the base branch policy prohibits the merge", while
  # every job in the run is green and nothing looks wrong. Renaming this job is
  # therefore a change to the branch policy and has to be made in both places or
  # neither.
  # ---------------------------------------------------------------------------
  gate:
    needs: provision
    runs-on: [self-hosted, "${{ needs.provision.outputs.label }}"]
    # BOUNDED, BECAUSE THIS JOB HOLDS A REAL MACHINE. Without it the job inherits
    # GitHub's 360-minute default, and a wedged suite would hold a provisioned
    # Proxmox VM for six hours before anything noticed. Pushes no longer cancel one
    # another either, so several could stack up behind a single wedge.
    #
    # 45 is roughly double the only measured pass: the first full run took 24
    # minutes for all 276 suites. Tight enough that a wedge is caught within the
    # hour, loose enough not to red a merely slow run. Revisit once there are
    # several completed runs to size from -- one observation is a number, not a
    # distribution.
    #
    # This bounds the JOB. testenv-batch already bounds each SUITE at
    # SPIRA_SUITE_TIMEOUT (600s default), so one hung suite is caught long before
    # this fires; what this catches is the case that never reaches a suite at all.
    timeout-minutes: 45
    permissions:
      contents: read
      # To pull the test image. The package inherits the repository's visibility,
      # so this is what makes the pull work while it is private.
      packages: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # spira_landref resolves the base ref from the repository, and the suite
          # selection diffs against it. Depth 1 has no base to diff against, so the
          # selection would be empty and the gate would pass having run nothing.
          fetch-depth: 0
          fetch-tags: true

      - name: Confirm the job landed on the provisioned machine
        # RUNNER_NAME is set by the runner process itself, so it is the one value
        # this workflow cannot assert into being true. A stale registration or a
        # label collision would otherwise run the whole gate somewhere else and
        # report success.
        run: test "$RUNNER_NAME" = "${{ needs.provision.outputs.label }}"

      - name: Host dependencies
        # A cold machine has no container runtime, no image and no caches. This
        # installs what is missing and then proves the machine can actually start
        # a rootless container, rather than inferring it from a package list.
        run: bash spira/runner-deps.sh

      - name: Resolve the registry path
        id: reg
        # A registry path must be lowercase; the organisation name arrives spelled
        # as it was typed. An uppercase path fails at pull time with an error about
        # authorisation rather than about case, which sends the reader to the token.
        run: |
          owner="$(printf '%s' "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')"
          printf 'registry=ghcr.io/%s\n' "$owner" >> "$GITHUB_OUTPUT"

      - name: Log in to the registry
        run: |
          printf '%s' "${{ secrets.GITHUB_TOKEN }}" \
            | podman login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Acquire the test image
        # SEPARATE FROM THE SUITES STEP ON PURPOSE. This is the expensive part on a
        # machine with no layer cache, and attributing it here means a slow gate
        # reads as a slow image acquisition rather than as slow tests.
        #
        # A MISS IS NOT A FAILURE. testenv.sh builds when the registry has no image
        # for this closure, which is exactly what happens on the first run after any
        # change to the Containerfile, the bd pin or doctor.sh's program lists. The
        # gate is slower in that case and still correct.
        env:
          SPIRA_TESTENV_REGISTRY: ${{ steps.reg.outputs.registry }}
        run: bash spira/testenv.sh image

      - name: Lints
        # Cheap, pure bash, and they fail on the things no suite can see: operator
        # infrastructure named in a public repo, configured names written as
        # literals, and scratch paths escaping into tracked files.
        run: |
          bash spira/inventory.sh
          bash spira/literal-lint.sh
          bash spira/scratch-fence.sh

      - name: Suites
        # The exit-code mapping matches the repo-map's gate command exactly. Keep
        # them in step: two gates that disagree about what 75 means is how a
        # harness fault comes to read as a branch failure.
        env:
          # The step above has already acquired the image under this closure's tag,
          # so testenv.sh finds it locally. Naming the registry here as well keeps
          # the two steps agreeing about which image the gate is entitled to use.
          SPIRA_TESTENV_REGISTRY: ${{ steps.reg.outputs.registry }}
        run: |
          set -uo pipefail
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            printf 'gate: pull request — running the suites the diff selects\n'
            _b=0
            bash spira/testenv-batch.sh "${{ github.sha }}" || _b=$?
          else
            # Full corpus for push, merge_group, and workflow_dispatch.
            # On push the diff against the base is empty. On merge_group the
            # diff is the PR's commits, but these are about to land so the
            # full gate is the right check — the PR gate already ran the diff
            # selection; this is the final pass before main.
            printf 'gate: %s on %s — running the whole corpus\n' \
              "${{ github.event_name }}" "${{ github.ref_name }}"
            _b=0
            ls spira/test-*.sh | xargs -n1 basename \
              | bash spira/testenv-batch.sh --suites - "${{ github.sha }}" || _b=$?
          fi
          case "$_b" in
            0) printf 'gate: pass\n' ;;
            2|3)
              printf 'gate: HARNESS FAULT (batch rc=%s) — the container did not come up, or the install inside it failed.\n' "$_b" >&2
              printf 'gate: this branch was NOT tested. Do not read this as a code failure; re-run the job.\n' >&2
              exit 75 ;;
            *) printf 'gate: suites failed (batch rc=%s)\n' "$_b" >&2; exit "$_b" ;;
          esac

  # ---------------------------------------------------------------------------
  # Destroy the machine.
  #
  # if: always() is load-bearing, and this workflow cancels superseded pull-request
  # runs by design, so the cancelled path is the common one here rather than the
  # rare one. Without it a cancelled run leaves the machine alive and the periodic
  # orphan sweep becomes the only thing that cleans up — which is a backstop, not
  # a plan. No guard on an empty vmid: the teardown action skips the destroy
  # itself when there is nothing to destroy, and it still has a runner
  # registration to remove, which a provision that registered but never got a job
  # scheduled onto it would otherwise leak.
  # ---------------------------------------------------------------------------
  teardown:
    needs: [provision, gate]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: DeckDumpster/ephemeral-ci/teardown@v1
        with:
          vmid:  ${{ needs.provision.outputs.vmid }}
          label: ${{ needs.provision.outputs.label }}
          runner-reg-pat:     ${{ secrets.RUNNER_REG_PAT }}
          ts-oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          ts-oauth-secret:    ${{ secrets.TS_OAUTH_SECRET }}
          pve-token-id:       ${{ secrets.PVE_TOKEN_ID }}
          pve-token-secret:   ${{ secrets.PVE_TOKEN_SECRET }}
          pve-api-host:       ${{ vars.PVE_API_HOST }}
          pve-node:           ${{ vars.PVE_NODE }}

  # ---------------------------------------------------------------------------
  # Cut the release unit. Only from the base branch, only from a gate that passed.
  #
  # ON A HOSTED RUNNER, not the provisioned one: this needs git and release.sh and
  # nothing else, and holding a machine open for it would keep a virtual machine
  # alive through a job that does no work on it.
  # ---------------------------------------------------------------------------
  cut:
    needs: gate
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      tag: ${{ steps.cut.outputs.tag }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # release.sh names every bead landed since the PREVIOUS release tag.
          # Without the tags it cannot find the previous one and every cut looks
          # like the first.
          fetch-depth: 0
          fetch-tags: true

      - name: Cut release tag
        id: cut
        env:
          # A RELEASE TAG IS ANNOTATED, AND AN ANNOTATED TAG NEEDS AN IDENTITY. A
          # hosted runner has no git identity configured, so `git tag -a` fails
          # with "Committer identity unknown" and the cut dies after the tag name
          # has already been computed. The domain is the harness's own synthetic
          # one, the same shape aeons commit under: this tag was made by a machine
          # and should say so rather than borrow a person's address.
          GIT_AUTHOR_NAME: Spira Gate
          GIT_AUTHOR_EMAIL: gate@spira.local
          GIT_COMMITTER_NAME: Spira Gate
          GIT_COMMITTER_EMAIL: gate@spira.local
        # release.sh exits 0 WITHOUT tagging when no bead landed since the last
        # release. That is the common case on a docs or workflow commit, and it is
        # success, not failure — so an empty tag output is normal and the publish
        # job below skips.
        #
        # THE CHECKOUT PATH IS PASSED EXPLICITLY. With no argument release.sh asks
        # the repo-map to resolve the home repository to a checkout, and the
        # repo-map describes an operator's own machine — in CI it resolves
        # nothing and the cut refuses.
        run: |
          set -uo pipefail
          tag="$(bash spira/release.sh cut "$GITHUB_WORKSPACE")" || {
            printf 'cut: release.sh refused\n' >&2; exit 1; }
          if [ -z "$tag" ]; then
            printf 'cut: no beads landed since the last release — nothing to tag\n'
            printf 'tag=\n' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          printf 'cut: %s\n' "$tag"
          git push origin "refs/tags/$tag"
          printf 'tag=%s\n' "$tag" >> "$GITHUB_OUTPUT"

  # ---------------------------------------------------------------------------
  # Publish. Invoked DIRECTLY, never left to release.yml's tag trigger.
  #
  # GitHub does not start a workflow for a tag pushed with GITHUB_TOKEN. That is a
  # deliberate anti-recursion rule, and it is silent: the tag appears, the release
  # never does, and nothing reports a failure. Calling release.yml as a reusable
  # workflow makes the publish a dependency of the cut rather than a hoped-for
  # side effect of it. release.yml keeps its tag trigger as well, so a tag pushed
  # by hand still publishes.
  # ---------------------------------------------------------------------------
  publish:
    needs: cut
    if: needs.cut.outputs.tag != ''
    uses: ./.github/workflows/release.yml
    permissions:
      contents: write
    with:
      tag: ${{ needs.cut.outputs.tag }}
