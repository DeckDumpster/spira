[package]
name = "doctor"
version = "1.0.0"
edition = "2021"
description = "doctor — is the running harness healthy, right now. Replaces spira/doctor.sh."

[lib]
name = "doctor"
path = "src/lib.rs"

[[bin]]
name = "doctor"
path = "src/main.rs"
test = false

[features]
integration = ["spira-config/integration", "system-paths/integration", "testkit/integration", "spira-test-id/integration"]
[dependencies]
spira-config = { path = "../spira-config" }
system-paths = { path = "../system-paths" }

[dev-dependencies]
spira-test-id = { path = "../spira-test-id" }
testkit = { path = "../testkit" }
