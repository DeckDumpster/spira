[package]
name = "watchd"
version = "1.0.0"
edition = "2021"
autotests = false
description = "watchd — the watcher manifest, and the face over the logs and cursors systemd fills. Replaces spira/watchd.sh (sp-48f6g)."

[[test]]
name = "no_fork_edges"
path = "tests/no_fork_edges.rs"
required-features = ["integration"]

[features]
integration = ["system-paths/integration", "inbox-rules/integration", "mail/integration", "runtime/integration", "sop/integration", "spira-config/integration", "spira-store/integration", "spira-world/integration", "testkit/integration", "tsd/integration", "spira-test-id/integration"]
[dependencies]
system-paths = { path = "../system-paths" }
inbox-rules = { path = "../inbox-rules" }
libc = "0.2"
mail = { path = "../mail" }
regex = "1"
runtime = { path = "../runtime" }
sop = { path = "../sop" }
spira-config = { path = "../spira-config" }
spira-store = { path = "../spira-store" }
spira-world = { path = "../spira-world" }
tsd = { path = "../tsd" }

[dev-dependencies]
spira-test-id = { path = "../spira-test-id" }
testkit = { path = "../testkit" }
