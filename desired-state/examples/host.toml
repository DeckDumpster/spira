# The Host section's spec: room and IO the box must keep. Not part of the default document,
# which every install composes and publishes: a section spec reaches the control store, so it
# is applied when the host section is armed
# (`spira compose desired-state/examples/default.toml desired-state/examples/host.toml`).

[producer]
producer = "spira-default"
version = "1"
time = "2026-11-01T00:00:00Z"

[[resources]]
apiVersion = "spira/v1"
kind = "Host"
[resources.metadata]
name = "host"
[resources.spec]
scratch_free_share = { value = 0.30, statute = "law-a-concurrency-ceiling-names-its-measurement" }
worktree_free_share = { value = 0.20, statute = "law-a-concurrency-ceiling-names-its-measurement" }
io_full_avg300 = { value = 40.0, statute = "law-a-concurrency-ceiling-names-its-measurement" }
