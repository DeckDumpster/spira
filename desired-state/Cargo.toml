[package]
name = "spira-desired-state"
version = "1.0.0"
edition = "2021"
description = "spira desired-state — typed resource kinds, the producer contract, the composer, and `spira apply`."

[dependencies]
serde = { version = "1", features = ["derive"] }
toml = "0.8"
serde_json = "1"
serde_path_to_error = "0.1"
schemars = "0.8"
sha2 = "0.10"

[[bin]]
name = "spira"
path = "src/main.rs"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
