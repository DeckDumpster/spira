[package]
name = "spira-store"
version = "1.0.0"
edition = "2021"
description = "spira-store — the lifecycle store client: LcClient, typed state reads, row writes, planning-write recognition."

[features]
integration = ["lifecycle/integration", "spira-config/integration", "testkit/integration", "spira-test-id/integration", "ports/integration"]
[dependencies]
spira-config = { path = "../spira-config" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
lifecycle = { path = "../lifecycle" }
ports = { path = "../ports" }
sha2 = "0.10"

[dev-dependencies]
spira-test-id = { path = "../spira-test-id" }
testkit = { path = "../testkit" }
