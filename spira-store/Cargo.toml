[package]
name = "spira-store"
version = "1.0.0"
edition = "2021"
description = "spira-store — the lifecycle store client: LcClient, typed state reads, row writes, planning-write recognition."

[features]
integration = ["lifecycle/integration", "testkit/integration"]

[dependencies]
spira-config = { path = "../spira-config" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
lifecycle = { path = "../lifecycle" }

[dev-dependencies]
testkit = { path = "../testkit" }
