[package]
name = "watchdog"
version = "0.1.0"
edition = "2021"
description = "spira-watchdog — the one watcher outside the scheduler: one pass on the platform's timer reads scheduler status and the scheduler unit's facts, and restarts and pages once per incident when the scheduler is wedged or absent."

[lib]
name = "watchdog"
path = "src/lib.rs"

[[bin]]
name = "spira-watchdog"
path = "src/main.rs"
test = false

[dependencies]
mail = { path = "../mail" }
runtime = { path = "../runtime" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
spira-config = { path = "../spira-config" }

[dev-dependencies]
testkit = { path = "../testkit" }
