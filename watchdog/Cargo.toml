[package]
name = "watchdog"
version = "0.1.0"
edition = "2021"
description = "spira-watchdog — the one watcher outside the scheduler: one pass on the platform's timer reads scheduler status and the scheduler unit's facts, and resets and starts it again with backoff while it is wedged or absent, and pages the Concierge inbox once per incident with the unit's last log lines."

[lib]
name = "watchdog"
path = "src/lib.rs"

[[bin]]
name = "spira-watchdog"
path = "src/main.rs"
test = false

[dependencies]
inbox-rules = { path = "../inbox-rules" }
runtime = { path = "../runtime" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
spira-config = { path = "../spira-config" }
spira-otel = { path = "../spira-otel" }
tsd = { path = "../tsd" }

[dev-dependencies]
testkit = { path = "../testkit" }
