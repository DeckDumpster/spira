[package]
name = "filings-collect"
version = "0.1.0"
edition = "2021"
description = "filings-collect — reads each product host's filings outbox over ssh, files or amends one builder bead per filing, and acknowledges it on the host."

[lib]
name = "filings_collect"
path = "src/lib.rs"

[[bin]]
name = "filings-collect"
path = "src/main.rs"
test = false

[dependencies]
serde_json = "1"
spira-config = { path = "../spira-config" }

[dev-dependencies]
testkit = { path = "../testkit" }

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
