[package]
name = "filings-collect"
version = "0.1.0"
edition = "2021"
autotests = false
description = "filings-collect — reads each product host's filings outbox over ssh, files or amends one builder bead per filing, and acknowledges it on the host."

[lib]
name = "filings_collect"
path = "src/lib.rs"

[[bin]]
name = "filings-collect"
path = "src/main.rs"
test = false

[[test]]
name = "no_fork_edges"
path = "tests/no_fork_edges.rs"
required-features = ["integration"]

[features]
integration = ["spira-config/integration", "spira-otel/integration"]

[dependencies]
serde_json = "1"
spira-config = { path = "../spira-config" }
spira-store = { path = "../spira-store" }
spira-otel = { path = "../spira-otel" }

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
