[package]
name = "gate-check"
version = "0.1.0"
edition = "2021"
description = "gate-check — resolve open gh:run gates, file flaky/red-twice suite beads, ingest TSD (sp-ubw2o, replaces spira/gate-check.sh)."

[lib]
name = "gate_check"
path = "src/lib.rs"

[[bin]]
name = "gate-check"
path = "src/main.rs"

[features]
integration = ["forge/integration", "testkit/integration", "spira-config/integration", "spira-store/integration", "spira-otel/integration", "spira-test-id/integration"]
[dependencies]
spira-otel = { path = "../spira-otel" }
forge = { path = "../forge" }
serde_json = "1"
spira-config = { path = "../spira-config" }
spira-store = { path = "../spira-store" }

[dev-dependencies]
spira-test-id = { path = "../spira-test-id" }
testkit = { path = "../testkit" }
