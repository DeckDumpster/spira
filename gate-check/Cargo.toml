[package]
name = "gate-check"
version = "0.1.0"
edition = "2021"
description = "gate-check — resolve open gh:run gates, file flaky/red-twice suite beads, ingest TSD (sp-ubw2o, replaces spira/gate-check.sh)."

[[bin]]
name = "gate-check"
path = "src/main.rs"

[dependencies]
serde_json = "1"

[dev-dependencies]
testkit = { path = "../testkit" }

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
