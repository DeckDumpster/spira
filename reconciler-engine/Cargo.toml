[package]
name = "reconciler-engine"
version = "1.0.0"
edition = "2021"
autotests = false
description = "reconciler-engine — pure invariant engine: (desired, observed) in, per-invariant gaps and remedy verdicts out, with hysteresis and unobservable as a first-class result."

[[test]]
name = "no_fork_edges"
path = "tests/no_fork_edges.rs"
required-features = ["integration"]

[features]
integration = ["mail/integration", "runtime/integration", "spira-config/integration", "spira-desired-state/integration", "spira-otel/integration", "testkit/integration", "tsd/integration"]

[dependencies]
spira-config = { path = "../spira-config" }
spira-desired-state = { path = "../desired-state" }
runtime = { path = "../runtime" }
mail = { path = "../mail" }
tsd = { path = "../tsd" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true

[dev-dependencies]
testkit = { path = "../testkit" }
spira-otel = { path = "../spira-otel" }
