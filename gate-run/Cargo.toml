[package]
name = "gate-run"
version = "0.1.0"
edition = "2021"
description = "gate-run — runs the landing gate detached and reports its verdict in bounded slices (sp-ubw2o, replaces spira/gate-run.sh)."

[[bin]]
name = "gate-run"
path = "src/main.rs"

[features]
integration = ["spira-config/integration", "spira-otel/integration", "system-paths/integration", "testkit/integration", "spira-test-id/integration"]
[dependencies]
spira-otel = { path = "../spira-otel" }
libc = "0.2"
spira-config = { path = "../spira-config" }
system-paths = { path = "../system-paths" }

[dev-dependencies]
spira-test-id = { path = "../spira-test-id" }
testkit = { path = "../testkit" }
