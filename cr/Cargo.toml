[package]
name = "cr"
version = "0.1.0"
edition = "2021"
autotests = false
description = "cr — draws one related unit of code for the operator to review: weighted, rotated through kinds, reproducible from a seed."

[lib]
name = "cr"
path = "src/lib.rs"

[[bin]]
name = "cr"
path = "src/main.rs"
test = false

[features]
integration = ["forge/integration", "spira-config/integration", "runtime/integration", "spira-otel/integration", "testkit/integration"]

[dependencies]
regex = "1"
base64 = "0.22"
forge = { path = "../forge" }
runtime = { path = "../runtime" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
spira-config = { path = "../spira-config" }
spira-otel = { path = "../spira-otel" }
toml = "0.8"

[dev-dependencies]
testkit = { path = "../testkit" }

[[test]]
name = "git_tree"
path = "tests/git_tree.rs"
required-features = ["integration"]

[[test]]
name = "review_flow"
path = "tests/review_flow.rs"
required-features = ["integration"]
