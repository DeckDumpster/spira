[package]
name = "czar-pass"
version = "1.0.0"
edition = "2021"
description = "Czar fast pass — deterministic queue-stall detection on a 30-second timer."

[dependencies]
spira-config = { path = "../spira-config" }
serde_json = "1"
spira-otel = { path = "../spira-otel" }
reconciler-engine = { path = "../reconciler-engine" }
tsd = { path = "../tsd" }
forge = { path = "../forge" }
runtime = { path = "../runtime" }
spira-runtime = { path = "../spira-runtime" }

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true

[dev-dependencies]
testkit = { path = "../testkit" }
