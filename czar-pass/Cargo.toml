[package]
name = "czar-pass"
version = "1.0.0"
edition = "2021"
description = "Czar fast pass — deterministic queue-stall detection on a 30-second timer."

[features]
integration = ["forge/integration", "incident/integration", "reconciler-engine/integration", "runtime/integration", "spira-config/integration", "spira-store/integration", "spira-otel/integration", "store-view/integration", "testkit/integration", "tsd/integration", "spira-test-id/integration"]
[dependencies]
spira-config = { path = "../spira-config" }
spira-store = { path = "../spira-store" }
serde_json = "1"
spira-otel = { path = "../spira-otel" }
reconciler-engine = { path = "../reconciler-engine" }
tsd = { path = "../tsd" }
forge = { path = "../forge" }
runtime = { path = "../runtime" }
store-view = { path = "../store-view" }
incident = { path = "../incident" }
serde = { version = "1", features = ["derive"] }

[dev-dependencies]
spira-test-id = { path = "../spira-test-id" }
testkit = { path = "../testkit" }
