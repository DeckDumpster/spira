[package]
name = "czar-pass"
version = "1.0.0"
edition = "2021"
description = "Czar fast pass — deterministic queue-stall detection on a 30-second timer."

[features]
integration = ["forge/integration", "incident/integration", "reconciler-engine/integration", "runtime/integration", "spira-config/integration", "spira-otel/integration", "store-view/integration", "testkit/integration", "tsd/integration"]

[dependencies]
spira-config = { path = "../spira-config" }
spira-store = { path = "../spira-store" }
serde_json = "1"
spira-otel = { path = "../spira-otel" }
reconciler-engine = { path = "../reconciler-engine" }
tsd = { path = "../tsd" }
forge = { path = "../forge" }
runtime = { path = "../runtime" }
store-view = { path = "../store-view" }
incident = { path = "../incident" }
serde = { version = "1", features = ["derive"] }

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true

[dev-dependencies]
testkit = { path = "../testkit" }
