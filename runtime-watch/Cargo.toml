[package]
name = "runtime-watch"
version = "0.1.0"
edition = "2021"
description = "runtime-watch — files one bump bead per repo and language runtime whose pinned release upstream no longer supports (Rust behind current stable, Node and Python past end-of-life)."

[lib]
name = "runtime_watch"
path = "src/lib.rs"

[[bin]]
name = "runtime-watch"
path = "src/main.rs"
test = false

[dependencies]
serde_json = "1"
spira-config = { path = "../spira-config" }
spira-otel = { path = "../spira-otel" }

[dev-dependencies]
testkit = { path = "../testkit" }

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
