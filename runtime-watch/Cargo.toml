[package]
name = "runtime-watch"
version = "0.1.0"
edition = "2021"
autotests = false
description = "runtime-watch — files one bump bead per repo and language runtime whose pinned release upstream no longer supports (Rust behind current stable, Node and Python past end-of-life)."

[lib]
name = "runtime_watch"
path = "src/lib.rs"

[[bin]]
name = "runtime-watch"
path = "src/main.rs"
test = false

[[test]]
name = "no_fork_edges"
path = "tests/no_fork_edges.rs"
required-features = ["integration"]

[features]
integration = ["bead/integration", "spira-config/integration", "spira-store/integration", "spira-otel/integration", "testkit/integration", "spira-test-id/integration"]
[dependencies]
serde_json = "1"
bead = { path = "../bead" }
spira-config = { path = "../spira-config" }
spira-store = { path = "../spira-store" }
spira-otel = { path = "../spira-otel" }

[dev-dependencies]
spira-test-id = { path = "../spira-test-id" }
testkit = { path = "../testkit" }
