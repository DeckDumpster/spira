[package]
name = "repo-contract"
version = "1.0.0"
edition = "2021"
autotests = false
description = "repo-contract — what a repository declares about the environment its check rows run in. The `repo-contract check` binary and the flake dev shell, entered by `nix print-dev-env --json`."

[[bin]]
name = "repo-contract"
path = "src/main.rs"
test = false

[features]
integration = ["forge/integration", "habits/integration", "spira-config/integration", "spira-otel/integration", "testkit/integration", "spira-test-id/integration"]
[dependencies]
serde_json = "1"
toml = "0.8"
habits = { path = "../habits" }
forge = { path = "../forge" }
spira-config = { path = "../spira-config" }
spira-otel = { path = "../spira-otel" }

[dev-dependencies]
spira-test-id = { path = "../spira-test-id" }
testkit = { path = "../testkit" }

[[test]]
name = "cached_shell"
required-features = ["integration"]
