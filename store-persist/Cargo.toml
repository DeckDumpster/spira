[package]
name = "store-persist"
version = "0.1.0"
edition = "2021"
autotests = false
description = "store-persist — keeps a RAM-resident Dolt store durable: restores it from its on-disk copy before the server starts, syncs it there continuously, compacts that copy, and reports its age."

[lib]
name = "store_persist"
path = "src/lib.rs"

[[bin]]
name = "store-persist"
path = "src/main.rs"
test = false

[features]
integration = ["spira-config/integration", "spira-otel/integration", "testkit/integration", "system-paths/integration", "spira-test-id/integration"]
[dependencies]
system-paths = { path = "../system-paths" }
spira-otel = { path = "../spira-otel" }
libc = "0.2"
spira-config = { path = "../spira-config" }

[dev-dependencies]
spira-test-id = { path = "../spira-test-id" }
testkit = { path = "../testkit" }
serde_json = "1"

[[test]]
name = "history_real_dolt"
path = "tests/history_real_dolt.rs"
required-features = ["integration"]
