[package]
name = "statute-check"
version = "0.1.0"
edition = "2021"
autotests = false
description = "statute-check — the statutes in force that govern a decision, ranked, with full text; and the PreToolUse hook that shows them before a decision command runs."

[lib]
name = "statute_check"
path = "src/lib.rs"

[[bin]]
name = "statute-check"
path = "src/main.rs"
test = false

[[test]]
name = "cli"
path = "tests/cli.rs"
required-features = ["integration"]

[features]
integration = ["spira-config/integration", "spira-otel/integration", "testkit/integration"]

[dependencies]
spira-config = { path = "../spira-config" }
spira-otel = { path = "../spira-otel" }
serde_json = "1"

[dev-dependencies]
testkit = { path = "../testkit" }
