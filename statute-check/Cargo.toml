[package]
name = "statute-check"
version = "0.1.0"
edition = "2021"
description = "statute-check — the statutes in force that govern a decision, ranked, with full text; and the PreToolUse hook that shows them before a decision command runs."

[lib]
name = "statute_check"
path = "src/lib.rs"

[[bin]]
name = "statute-check"
path = "src/main.rs"
test = false

[dependencies]
spira-config = { path = "../spira-config" }
serde_json = "1"

[dev-dependencies]
testkit = { path = "../testkit" }
