[package]
name = "spira-lint"
version = "0.1.0"
edition = "2021"
description = "spira-lint — the harness's static fences as one binary: one walk of the tracked tree, one Rule per fence, each with a named, shrink-only allow list."

[dependencies]
regex = "1"
serde = { version = "1", features = ["derive"] }
toml = "0.8"
spira-config = { path = "../spira-config" }
test-plan = { path = "../test-plan" }

[[bin]]
name = "spira-lint"
path = "src/main.rs"

[dev-dependencies]
testkit = { path = "../testkit" }
