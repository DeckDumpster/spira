[package]
name = "spira-lint"
version = "0.1.0"
edition = "2021"
description = "spira-lint — the harness's static fences as one binary: one walk of the tracked tree, one Rule per fence, each with a named, shrink-only allow list."

[dependencies]
regex = "1"

[[bin]]
name = "spira-lint"
path = "src/main.rs"
