[package]
name = "broker"
version = "1.0.0"
edition = "2021"
description = "Broker — aeons submit forge-write intents; a credentialed executor validates and executes them."

[dependencies]
spira-config = { path = "../spira-config" }
serde_json = "1"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true

[dev-dependencies]
testkit = { path = "../testkit" }
