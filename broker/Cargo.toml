[package]
name = "broker"
version = "1.0.0"
edition = "2021"
description = "Broker — mints the GitHub App token and answers read-only forge queries."

[features]
integration = ["forge/integration", "spira-config/integration", "spira-otel/integration", "testkit/integration", "spira-test-id/integration"]
[dependencies]
spira-config = { path = "../spira-config" }
spira-otel = { path = "../spira-otel" }
forge = { path = "../forge" }
serde_json = "1"

[dev-dependencies]
spira-test-id = { path = "../spira-test-id" }
testkit = { path = "../testkit" }
