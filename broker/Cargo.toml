[package]
name = "broker"
version = "1.0.0"
edition = "2021"
description = "Broker — mints the GitHub App token and answers read-only forge queries."

[dependencies]
spira-config = { path = "../spira-config" }
spira-otel = { path = "../spira-otel" }
serde_json = "1"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true

[dev-dependencies]
testkit = { path = "../testkit" }
