[package]
name = "testkit"
version = "0.1.0"
edition = "2021"
publish = false
description = "testkit — test scaffolding shared across the workspace: write an executable without an ETXTBSY race (dev-dependency only)."

[features]
integration = ["system-paths/integration", "spira-test-id/integration"]
[dependencies]
system-paths = { path = "../system-paths" }
libc = "0.2"
# TLS off: the test broker is a Unix socket.
rumqttc = { version = "0.25.1", default-features = false }
toml = "0.8"

[dev-dependencies]
spira-test-id = { path = "../spira-test-id" }
