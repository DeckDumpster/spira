[package]
name = "exec-census"
version = "1.0.0"
edition = "2021"
autotests = false
description = "exec-census — execs per minute by systemd unit, sampled from /proc and pushed over OTLP."

[lib]
name = "exec_census"
path = "src/lib.rs"

[[bin]]
name = "exec-census"
path = "src/main.rs"
test = false

[[test]]
name = "fixture"
path = "tests/fixture.rs"
required-features = ["integration"]

[features]
integration = ["spira-config/integration", "spira-otel/integration", "testkit/integration"]

[dependencies]
spira-config = { path = "../spira-config" }
spira-otel = { path = "../spira-otel" }

[dev-dependencies]
testkit = { path = "../testkit" }

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
