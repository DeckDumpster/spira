[package]
name = "install"
version = "0.1.0"
edition = "2021"
autotests = false
description = "install — rewrite wave 6a (sp-31dm0): the root installer, the per-instance unit renderer/writer, and the non-disruptive unit ensure. Replaces install.sh, systemd/install.sh, systemd/unit-ensure.sh, systemd/units.sh and systemd/render.py."

[lib]
name = "install"
path = "src/lib.rs"

[[bin]]
# NEVER "install": /usr/bin/install is a system command, and `release build` refuses a
# release whose bin/ shadows one (release::build::clashes, SYSTEM_DIRS).
name = "spira-install"
path = "src/bin/install.rs"

[[bin]]
name = "units-install"
path = "src/bin/units_install.rs"
test = false

[[bin]]
name = "unit-ensure"
path = "src/bin/unit_ensure.rs"
test = false

[[bin]]
name = "render-unit"
path = "src/bin/render_unit.rs"
test = false

[[test]]
name = "units_lint"
path = "tests/units_lint.rs"
required-features = ["integration"]

[features]
integration = ["lifecycle/integration", "release/integration", "runtime/integration", "spira-config/integration", "spira-otel/integration", "testkit/integration", "watchdog/integration"]

[dependencies]
release = { path = "../release" }
lifecycle = { path = "../lifecycle" }
spira-config = { path = "../spira-config" }
spira-store = { path = "../spira-store" }
spira-otel = { path = "../spira-otel" }
serde_json = "1"
watchdog = { path = "../watchdog" }
runtime = { path = "../runtime" }

[dev-dependencies]
testkit = { path = "../testkit" }
