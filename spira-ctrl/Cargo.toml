[package]
name = "spira-ctrl"
version = "1.0.0"
edition = "2021"
description = "spira-ctrl — the operational control plane: durable suspend/resume state outside source control. Replaces spira/ctrl.sh."

[lib]
name = "spira_ctrl"
path = "src/lib.rs"

[[bin]]
name = "ctrl"
path = "src/main.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
spira-config = { path = "../spira-config" }

[dev-dependencies]
testkit = { path = "../testkit" }
