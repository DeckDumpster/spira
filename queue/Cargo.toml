[package]
name = "queue"
version = "1.0.0"
edition = "2021"
description = "queue — the merge queue's operator and landing tool (submit, eject, abandon, open-batch, claim/release, land-local, publish, to-forge/to-local, rollback-local, stats). Replaces spira/queue.sh."

[features]
integration = ["bead/integration", "forge/integration", "gate/integration", "landing-pass/integration", "lifecycle/integration", "migration-numbers/integration", "release/integration", "runtime/integration", "spira-config/integration", "spira-store/integration", "spira-otel/integration", "state-store/integration", "testkit/integration", "tsd/integration"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
libc = "0.2"
spira-config = { path = "../spira-config" }
spira-store = { path = "../spira-store" }
spira-otel = { path = "../spira-otel" }
gate = { path = "../gate" }
release = { path = "../release" }
landing-pass = { path = "../landing-pass" }
migration-numbers = { path = "../migration-numbers" }
lifecycle = { path = "../lifecycle" }
bead = { path = "../bead" }
state-store = { path = "../state-store" }
tsd = { path = "../tsd" }
forge = { path = "../forge" }
runtime = { path = "../runtime" }

[[bin]]
name = "queue"
path = "src/main.rs"
test = false

# A separate binary, deliberately (queue/src/bin/queue-helpers.rs): a test fixture that
# stubs `queue` by name on PATH to isolate dispatch behaviour must never also swallow
# these plain git/mail leaf operations.
[[bin]]
name = "queue-helpers"
path = "src/bin/queue-helpers.rs"
test = false


[dev-dependencies]
testkit = { path = "../testkit" }

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
