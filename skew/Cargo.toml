[package]
name = "skew"
version = "1.0.0"
edition = "2021"
autotests = false
description = "skew — is the activated release the latest published, and the landing gate's foreign-harness fence. Replaces spira/skew.sh."

[lib]
name = "skew"
path = "src/lib.rs"

[[bin]]
name = "skew"
path = "src/main.rs"
test = false

[[test]]
name = "no_fork_edges"
path = "tests/no_fork_edges.rs"
required-features = ["integration"]

[features]
integration = ["mail/integration", "spira-config/integration", "spira-otel/integration", "tsd/integration"]

[dependencies]
spira-config = { path = "../spira-config" }
spira-store = { path = "../spira-store" }
spira-otel = { path = "../spira-otel" }
mail = { path = "../mail" }
tsd = { path = "../tsd" }
libc = "0.2"

[profile.release]
opt-level = "z"
