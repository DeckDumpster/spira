[package]
name = "reconciler-flow"
version = "1.0.0"
edition = "2021"
autotests = false
description = "reconciler-flow — flow invariants (backlog trend, stage velocities vs a trailing baseline, stage dwell, round health) over the run/tsd/ time series, on a 30-minute pass."

[[bin]]
name = "reconciler-flow"
path = "src/main.rs"
test = false

[[test]]
name = "no_fork_edges"
path = "tests/no_fork_edges.rs"
required-features = ["integration"]

[[test]]
name = "store_parity"
path = "tests/store_parity.rs"
required-features = ["integration"]

[features]
integration = ["reconciler-engine/integration", "spira-config/integration", "spira-store/integration", "spira-otel/integration", "testkit/integration", "tsd/integration"]

[dependencies]
spira-otel = { path = "../spira-otel" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
reconciler-engine = { path = "../reconciler-engine" }
tsd = { path = "../tsd" }
spira-config = { path = "../spira-config" }
spira-store = { path = "../spira-store" }

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true

[dev-dependencies]
spira-otel = { path = "../spira-otel" }
testkit = { path = "../testkit" }
