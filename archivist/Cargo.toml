[package]
name = "archivist"
version = "1.0.0"
edition = "2021"
autotests = false
description = "archivist — rescue a full session's unfinished business before it is cleared: the sweep and its per-session archive run, the drift-ordered candidate budget, the transcript digest, and the daily digest mail. Replaces spira/archivist.sh."

[features]
integration = ["dwarf/integration", "mail/integration", "spira-config/integration", "spira-otel/integration", "testkit/integration", "system-paths/integration", "spira-test-id/integration"]
[dependencies]
system-paths = { path = "../system-paths" }
dwarf = { path = "../dwarf" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
libc = "0.2"
spira-config = { path = "../spira-config" }
spira-otel = { path = "../spira-otel" }

[[bin]]
name = "archivist"
path = "src/main.rs"
test = false

[dev-dependencies]
mail = { path = "../mail" }
spira-test-id = { path = "../spira-test-id" }
testkit = { path = "../testkit" }

[[test]]
name = "exit_commit"
path = "tests/exit_commit.rs"
required-features = ["integration"]
