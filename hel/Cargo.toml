[package]
name = "hel"
version = "1.0.0"
edition = "2021"
autotests = false
description = "hel — the Hel: delete the branch and worktree of every bead whose work has landed, and nothing else. Replaces spira/hel.sh (sp-arpjt)."

[features]
integration = ["cockpit-collect/integration", "forge/integration", "runtime/integration", "spira-config/integration", "spira-store/integration", "spira-otel/integration", "system-paths/integration", "testkit/integration"]

[dependencies]
system-paths = { path = "../system-paths" }
serde_json = "1"
spira-config = { path = "../spira-config" }
spira-store = { path = "../spira-store" }
spira-otel = { path = "../spira-otel" }
forge = { path = "../forge" }
runtime = { path = "../runtime" }

[lib]
name = "hel"
path = "src/lib.rs"

[[bin]]
name = "hel"
path = "src/main.rs"
test = false

[[test]]
name = "scan_spawns"
path = "tests/scan_spawns.rs"
required-features = ["integration"]

[dev-dependencies]
spira-test-id = { path = "../spira-test-id" }
testkit = { path = "../testkit" }
cockpit-collect = { path = "../cockpit-collect" }

