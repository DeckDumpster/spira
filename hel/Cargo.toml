[package]
name = "hel"
version = "1.0.0"
edition = "2021"
description = "hel — the Hel: delete the branch and worktree of every bead whose work has landed, and nothing else. Replaces spira/hel.sh (sp-arpjt)."

[dependencies]
serde_json = "1"
spira-config = { path = "../spira-config" }
spira-otel = { path = "../spira-otel" }

[lib]
name = "hel"
path = "src/lib.rs"

[[bin]]
name = "hel"
path = "src/main.rs"
test = false

[dev-dependencies]
testkit = { path = "../testkit" }

