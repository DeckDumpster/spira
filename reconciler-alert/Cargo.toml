[package]
name = "reconciler-alert"
version = "1.0.0"
edition = "2021"
autotests = false
description = "reconciler-alert — the alert path's IO seam: an evidence-carrying wake to the Concierge, deduplicated per gap, and an operator escalation path refused for any class but permissions, policy or destructive."

[[test]]
name = "no_fork_edges"
path = "tests/no_fork_edges.rs"
required-features = ["integration"]

[features]
integration = ["mail/integration", "reconciler-engine/integration", "spira-config/integration", "spira-otel/integration", "testkit/integration"]

[dependencies]
spira-otel = { path = "../spira-otel" }
spira-config = { path = "../spira-config" }
spira-store = { path = "../spira-store" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reconciler-engine = { path = "../reconciler-engine" }

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true

[dev-dependencies]
testkit = { path = "../testkit" }
mail = { path = "../mail" }
