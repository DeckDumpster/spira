[package]
name = "cockpit-collect"
version = "1.0.0"
edition = "2021"
autotests = false
description = "cockpit-collect — Spira's own cockpit collector: tiered probe supervisor and probe library, replacing spira/cockpit.sh and spira/collect.sh (sp-kt4l3)."

[[bin]]
name = "cockpit-collect"
path = "src/main.rs"

[[test]]
name = "no_fork_edges"
path = "tests/no_fork_edges.rs"
required-features = ["integration"]

[[test]]
name = "pinned_config"
path = "tests/pinned_config.rs"
required-features = ["integration"]

[features]
integration = ["ctx-meter/integration", "install/integration", "bead/integration", "dwarf/integration", "runtime/integration", "spira-claim/integration", "spira-config/integration", "spira-store/integration", "spira-otel/integration", "store-view/integration", "strand/integration", "testkit/integration", "tsd/integration", "system-paths/integration", "spira-test-id/integration", "release/integration", "queue/integration"]
[dependencies]
ctx-meter = { path = "../ctx-meter" }
dwarf = { path = "../dwarf" }
bead = { path = "../bead" }
serde_json = "1"
spira-config = { path = "../spira-config" }
spira-store = { path = "../spira-store" }
spira-claim = { path = "../spira-claim" }
spira-otel = { path = "../spira-otel" }
strand = { path = "../strand" }
store-view = { path = "../store-view" }
runtime = { path = "../runtime" }
tsd = { path = "../tsd" }
libc = "0.2"
system-paths = { path = "../system-paths" }
release = { path = "../release" }
install = { path = "../install" }
queue = { path = "../queue" }

[dev-dependencies]
spira-test-id = { path = "../spira-test-id" }
testkit = { path = "../testkit" }
