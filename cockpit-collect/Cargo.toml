[package]
name = "cockpit-collect"
version = "1.0.0"
edition = "2021"
autotests = false
description = "cockpit-collect — Spira's own cockpit collector: tiered probe supervisor and probe library, replacing spira/cockpit.sh and spira/collect.sh (sp-kt4l3)."

[[bin]]
name = "cockpit-collect"
path = "src/main.rs"

[[test]]
name = "no_fork_edges"
path = "tests/no_fork_edges.rs"
required-features = ["integration"]

[features]
integration = ["bead/integration", "dwarf/integration", "runtime/integration", "spira-config/integration", "spira-otel/integration", "store-view/integration", "strand/integration", "testkit/integration", "tsd/integration"]

[dependencies]
dwarf = { path = "../dwarf" }
bead = { path = "../bead" }
serde_json = "1"
spira-config = { path = "../spira-config" }
spira-otel = { path = "../spira-otel" }
strand = { path = "../strand" }
store-view = { path = "../store-view" }
runtime = { path = "../runtime" }
tsd = { path = "../tsd" }
libc = "0.2"

[dev-dependencies]
testkit = { path = "../testkit" }

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
