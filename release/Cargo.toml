[package]
name = "release"
version = "0.1.0"
edition = "2021"
autotests = false
description = "release — the release producer (sp-m3ipc): build, verify, activate (with --hotfix), rollback and prune spira-releases/<sha>. Replaces make install, spira/activate.sh and spira/build-tarball.sh for local use."

[lib]
name = "release"
path = "src/lib.rs"

[[bin]]
name = "release"
path = "src/main.rs"
test = false

[[bin]]
name = "round-recert"
path = "src/bin/round-recert.rs"
test = false

[[test]]
name = "acceptance_host"
path = "tests/acceptance_host.rs"
required-features = ["integration"]

[[test]]
name = "pre_activate_store"
path = "tests/pre_activate_store.rs"
required-features = ["integration"]

[[test]]
name = "activate_registry"
path = "tests/activate_registry.rs"
required-features = ["integration"]

[features]
integration = ["runtime/integration", "spira-config/integration", "spira-store/integration", "spira-otel/integration", "state-store/integration", "system-paths/integration", "testkit/integration", "spira-test-id/integration", "bead/integration", "spira-pub/integration"]
[dependencies]
system-paths = { path = "../system-paths" }
sha2 = "0.10"
toml = "0.8"
rustc-demangle = "0.1"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
spira-config = { path = "../spira-config" }
spira-store = { path = "../spira-store" }
spira-otel = { path = "../spira-otel" }
state-store = { path = "../state-store" }
runtime = { path = "../runtime" }
spira-pub = { path = "../spira-pub" }

[dev-dependencies]
bead = { path = "../bead" }
spira-test-id = { path = "../spira-test-id" }
testkit = { path = "../testkit" }
