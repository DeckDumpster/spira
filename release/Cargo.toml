[package]
name = "release"
version = "0.1.0"
edition = "2021"
description = "release — the release producer (sp-m3ipc): build, verify, activate (with --hotfix), rollback and prune spira-releases/<sha>. Replaces make install, spira/activate.sh and spira/build-tarball.sh for local use."

[lib]
name = "release"
path = "src/lib.rs"

[[bin]]
name = "release"
path = "src/main.rs"
test = false

[[bin]]
name = "round-recert"
path = "src/bin/round-recert.rs"
test = false

[features]
integration = ["round-controller/integration", "runtime/integration", "spira-config/integration", "spira-store/integration", "spira-otel/integration", "state-store/integration", "testkit/integration"]

[dependencies]
sha2 = "0.10"
toml = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
spira-config = { path = "../spira-config" }
spira-store = { path = "../spira-store" }
spira-otel = { path = "../spira-otel" }
round-controller = { path = "../round-controller" }
state-store = { path = "../state-store" }
runtime = { path = "../runtime" }

[dev-dependencies]
testkit = { path = "../testkit" }
