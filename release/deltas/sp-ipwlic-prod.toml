# sp-ipwlic — the production config delta for ~/.config/spira/spira.toml (instance prod).
#
# 99 keys are new on this branch against local/main (spira/conf.d); 84 of them are REQUIRED.
# Every one must be declared in spira.toml, because resolve reads nothing else.
#
# HOW THEY ARRIVE. `release activate` applies spira/config-delta.toml, which declares all 99.
# An added key that a layer already sets is left alone. The 14 keys in the first table are
# paths on this box, so the public delta can only declare them as "" and the operator sets
# them here BEFORE activating. Otherwise the scheduler's tasks resolve an empty path. The
# second table is what activation writes by itself; it is listed so the operator can check it.
#
# Values: the conf.d defaults and the task contracts' pins. SPIRA_TASK_MODES puts every task
# in act (ruling D4); SPIRA_UNITS is systemd. The paths come from this box's own roots:
# spira.run, spira.releases, the repo map's harness row and the units the tasks replace.

# --- 1. Set by hand before activation (14) ---
[spira]
heimdall_fallback = "/home/ryan/spira/run/heimdall.alerts.json"
heimdall_mirror = "/home/ryan/spira/brain/raw/spira-beads/spira.jsonl"
heimdall_strands = "/home/ryan/spira/run/strands.json"
incident_log = "/home/ryan/spira/run/incident.log"
nix_env_link = "/home/ryan/.local/lib/spira-env"
reaplog = "/home/ryan/spira/run/reap.log"
reclaim_cache_dir = "/home/ryan/spira/run/sccache-dav"
reclaim_globs = "/home/ryan/spira/run/worktree/.tgt-* /home/ryan/spira/run/tgt-* /home/ryan/spira/run/cargo-target-bins /home/ryan/spira/run/worktree/*/target"
reclaim_lease_dir = "/home/ryan/spira/run/dwarf"
reclaim_podman_dir = "/home/ryan/.local/share/containers/storage"
reclaim_require = "/home/ryan/spira/run/worktree"
release = "/home/ryan/spira/spira-releases/current"
repo = "/home/ryan/spira/harness"
runtime_socket = "/home/ryan/spira/run/runtime-control.sock"

