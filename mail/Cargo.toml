[package]
name = "mail"
version = "1.0.0"
edition = "2021"
autotests = false
description = "mail — Maildir mailboxes for operator/concierge messages: send with transport lint and repeat-guard, list/read/count/unread-age/done, sendmail (RFC 5322 reply intake that closes the tracking bead), tidy and sweep-dismissed. Replaces spira/mail.sh (sp-ooh1k)."

[[test]]
name = "no_fork_edges"
path = "tests/no_fork_edges.rs"
required-features = ["integration"]

[features]
integration = ["bead/integration", "spira-config/integration", "spira-otel/integration", "testkit/integration", "tsd/integration"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
libc = "0.2"
regex = "1"
spira-config = { path = "../spira-config" }
spira-store = { path = "../spira-store" }
spira-otel = { path = "../spira-otel" }
bead = { path = "../bead" }
tsd = { path = "../tsd" }

[[bin]]
name = "mail"
path = "src/main.rs"
test = false

[dev-dependencies]
testkit = { path = "../testkit" }

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
