[package]
name = "round-vm"
version = "0.1.0"
edition = "2021"
autotests = false
default-run = "round-vm"
rust-version = "1.99"
description = "round-vm — a pool of one ephemeral round VM from the hypervisor: acquire / release / run / status (sp-o3o6z; replaces spira/round-vm.sh and round-vm-provider-pve.sh)."

[[bin]]
name = "round-vm"
path = "src/main.rs"
test = false

[[bin]]
name = "round-vm-stub-pve"
path = "src/bin/round-vm-stub-pve.rs"
test = false

[[test]]
name = "image_preflight"
path = "tests/image_preflight.rs"
required-features = ["integration"]

[[test]]
name = "image_bytes"
path = "tests/image_bytes.rs"
required-features = ["integration"]

[[test]]
name = "image_readings"
path = "tests/image_readings.rs"
required-features = ["integration"]

[[test]]
name = "preflight_guest_harness"
path = "tests/preflight_guest_harness.rs"
required-features = ["integration"]

[[test]]
name = "unit_deadline_real"
path = "tests/unit_deadline_real.rs"
required-features = ["integration"]

[[test]]
name = "unit_prune_real"
path = "tests/unit_prune_real.rs"
required-features = ["integration"]

[[test]]
name = "deny_list_real"
path = "tests/deny_list_real.rs"
required-features = ["integration"]

[[test]]
name = "foreign_script_real"
path = "tests/foreign_script_real.rs"
required-features = ["integration"]

[features]
integration = ["runtime/integration", "spira-config/integration", "spira-store/integration", "spira-otel/integration", "testkit/integration", "tsd/integration", "spira-desired-state/integration", "reconciler-engine/integration", "test-registry/integration", "gate/integration", "batcher/integration", "batcher-cut/integration", "system-paths/integration", "spira-test-id/integration"]
[dependencies]
spira-config = { path = "../spira-config" }
spira-store = { path = "../spira-store" }
gate = { path = "../gate" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tsd = { path = "../tsd" }
spira-desired-state = { path = "../desired-state" }
reconciler-engine = { path = "../reconciler-engine" }
spira-otel = { path = "../spira-otel" }
libc = "0.2"
ureq = { version = "2", default-features = false, features = ["tls"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }
rustls-pemfile = "2"
sha2 = "0.10"
system-paths = { path = "../system-paths" }


[dev-dependencies]
spira-test-id = { path = "../spira-test-id" }
testkit = { path = "../testkit" }
toml = "0.8"
test-registry = { path = "../test-registry" }
runtime = { path = "../runtime" }
batcher = { path = "../batcher" }
batcher-cut = { path = "../batcher-cut" }
