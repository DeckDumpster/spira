[package]
name = "reclaim"
version = "0.1.0"
edition = "2021"
description = "reclaim — loses nothing: judges idle top-level tmp directories no live process holds, and chooses the oldest compilation-cache files to trim to a size cap."

[lib]
name = "reclaim"
path = "src/lib.rs"

[features]
integration = ["testkit/integration", "system-paths/integration", "spira-test-id/integration"]
[dependencies]
system-paths = { path = "../system-paths" }

[dev-dependencies]
spira-test-id = { path = "../spira-test-id" }
testkit = { path = "../testkit" }
