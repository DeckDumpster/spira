[package]
name = "sop"
version = "1.0.0"
edition = "2021"
description = "sop — write, match, recall and synthesise a Standard Operating Procedure. Replaces spira/sop.sh."

[lib]
name = "sop"
path = "src/lib.rs"

[[bin]]
name = "sop"
path = "src/main.rs"

[dependencies]
serde_json = "1"
sha2 = "0.10"
regex = "1"

[dev-dependencies]
testkit = { path = "../testkit" }
