[package]
name = "sop"
version = "1.0.0"
edition = "2021"
description = "sop — write, match, recall and synthesise a Standard Operating Procedure. Replaces spira/sop.sh."

[lib]
name = "sop"
path = "src/lib.rs"

[[bin]]
name = "sop"
path = "src/main.rs"
test = false

[features]
integration = ["spira-config/integration", "spira-otel/integration", "spira-store/integration", "testkit/integration", "system-paths/integration"]

[dependencies]
spira-otel = { path = "../spira-otel" }
serde_json = "1"
sha2 = "0.10"
regex = "1"
spira-config = { path = "../spira-config" }
spira-store = { path = "../spira-store" }
system-paths = { path = "../system-paths" }

[dev-dependencies]
spira-test-id = { path = "../spira-test-id" }
testkit = { path = "../testkit" }
