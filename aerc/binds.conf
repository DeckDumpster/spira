# aerc/binds.conf — the Spira bindings to put in your own binds.conf.
#
# Do not copy this file over it: aerc installs its default bindings only when binds.conf is
# absent, so a file holding just these lines leaves every other key unbound. Start from the
# default (/usr/share/aerc/binds.conf) and replace the `A` line in each section.
# `A` (accept) replies with the message's X-Spira-Default.

[messages]
A = :pipe -m /path/to/spira/aerc/accept-default.sh<Enter>

[view]
A = :pipe /path/to/spira/aerc/accept-default.sh<Enter>
