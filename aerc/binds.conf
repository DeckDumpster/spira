# aerc/binds.conf — example key bindings for reading Spira mail.
#
# Copy to ~/.config/aerc/binds.conf and adjust paths for your installation.
# The `A` key (for Accept) sends an accept-default reply: it extracts
# X-Spira-Default from the current message and sends that value as the reply body.

[messages]
A = :pipe -m /path/to/spira/aerc/accept-default.sh<Enter>

[view]
A = :pipe /path/to/spira/aerc/accept-default.sh<Enter>
