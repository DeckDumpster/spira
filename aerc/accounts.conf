# aerc/accounts.conf — example operator account for reading Spira mail.
#
# Copy to ~/.config/aerc/accounts.conf and fill in the paths for your installation.
# The source path must match SPIRA_MAIL/operator (see spira.conf).
# outgoing pipes the full RFC 5322 message to mail.sh sendmail, which closes
# tracking beads on replies and routes to the sender's mailbox or concierge.

[spira]
source        = maildir://~/.local/share/spira/run/mail/operator
outgoing      = /path/to/spira/mail.sh sendmail
from          = Operator <operator@spira>
copy-to       = Sent
