# aerc/accounts.conf — example operator account for reading Spira mail.
#
# Copy to ~/.config/aerc/accounts.conf (mode 600) and replace the paths; spira-install writes spira-sendmail and repoints outgoing at it on every run.
# aerc's maildir source is the directory CONTAINING mailboxes, so it is SPIRA_MAIL,
# narrowed to the operator mailbox. No copy-to: every directory under SPIRA_MAIL is a mailbox.

[spira]
source   = maildir:///path/to/SPIRA_MAIL
folders  = operator
default  = operator
outgoing = /path/to/.local/bin/spira-sendmail
from     = Operator <operator@spira>
