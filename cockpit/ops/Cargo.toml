[package]
name = "cockpit-ops"
version = "1.0.0"
edition = "2021"
autotests = false
description = "Cockpit operator surface — the ops dashboard pane, the tmux layout it lives in, and the bead-answer plumbing beside it. Replaces cockpit/health.sh, cockpit/layout.sh, cockpit/rebuild.sh, cockpit/resolve.sh and cockpit/reply.sh (sp-llbmi)."

[lib]
name = "cockpit_ops"
path = "src/lib.rs"

[[bin]]
name = "health"
path = "src/health_main.rs"
test = false

[[bin]]
name = "layout"
path = "src/layout_main.rs"
test = false

[[bin]]
name = "rebuild"
path = "src/rebuild_main.rs"
test = false

[[bin]]
name = "resolve"
path = "src/resolve_main.rs"
test = false

[[bin]]
name = "lc-view"
path = "src/lcview_main.rs"

[[bin]]
name = "reply"
path = "src/reply_main.rs"
test = false

[[test]]
name = "no_fork_edges"
path = "tests/no_fork_edges.rs"
required-features = ["integration"]

[[test]]
name = "ensure_real_tmux"
path = "tests/ensure_real_tmux.rs"
required-features = ["integration"]

[[test]]
name = "pane_idle"
path = "tests/pane_idle.rs"
required-features = ["integration"]

[[test]]
name = "launchers_as_launched"
path = "tests/launchers_as_launched.rs"
required-features = ["integration"]

[features]
integration = ["bead/integration", "hel/integration", "mail/integration", "runtime/integration", "spira-claim/integration", "spira-config/integration", "spira-store/integration", "store-view/integration", "spira-otel/integration", "spira-world/integration", "testkit/integration", "tsd/integration", "system-paths/integration", "spira-test-id/integration", "release/integration"]

[dependencies]
crossterm = "0.28"
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
libc = "0.2"
spira-config = { path = "../../spira-config" }
spira-store = { path = "../../spira-store" }
store-view = { path = "../../store-view" }
bead = { path = "../../bead" }
hel = { path = "../../hel" }
spira-claim = { path = "../../spira-claim" }
mail = { path = "../../mail" }
spira-world = { path = "../../spira-world" }
runtime = { path = "../../runtime" }
spira-otel = { path = "../../spira-otel" }
tsd = { path = "../../tsd" }
system-paths = { path = "../../system-paths" }

[dev-dependencies]
release = { path = "../../release" }
spira-test-id = { path = "../../spira-test-id" }
testkit = { path = "../../testkit" }
