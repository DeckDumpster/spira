[package]
name = "panel"
version = "1.0.0"
edition = "2021"
autotests = false
description = "Cockpit panel — decisions, insights and notifications over beads and Gas Town mail."

[[test]]
name = "no_fork_edges"
path = "tests/no_fork_edges.rs"
required-features = ["integration"]

[features]
integration = ["mail/integration", "spira-config/integration", "spira-store/integration", "spira-otel/integration", "testkit/integration", "system-paths/integration", "spira-test-id/integration"]
[dependencies]
crossterm = "0.28"
serde_json = "1"

[dependencies.spira-config]
path = "../../spira-config"

[dependencies.spira-store]
path = "../../spira-store"

[dependencies.spira-otel]
path = "../../spira-otel"


[dependencies.mail]
path = "../../mail"

[dev-dependencies.system-paths]
path = "../../system-paths"

[dev-dependencies.testkit]
path = "../../testkit"

[dev-dependencies]
spira-test-id = { path = "../../spira-test-id" }
