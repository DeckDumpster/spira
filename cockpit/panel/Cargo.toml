[package]
name = "panel"
version = "1.0.0"
edition = "2021"
autotests = false
description = "Cockpit panel — decisions, insights and notifications over beads and Gas Town mail."

[[test]]
name = "no_fork_edges"
path = "tests/no_fork_edges.rs"
required-features = ["integration"]

[features]
integration = ["mail/integration", "spira-config/integration", "spira-otel/integration", "testkit/integration"]

[dependencies]
crossterm = "0.28"
serde_json = "1"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true

[dependencies.spira-config]
path = "../../spira-config"

[dependencies.spira-otel]
path = "../../spira-otel"


[dependencies.mail]
path = "../../mail"

[dev-dependencies.testkit]
path = "../../testkit"
