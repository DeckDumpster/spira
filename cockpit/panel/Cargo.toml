[package]
name = "panel"
version = "1.0.0"
edition = "2021"
description = "Cockpit panel — decisions, insights and notifications over beads and Gas Town mail."

[dependencies]
crossterm = "0.28"
serde_json = "1"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true

[dev-dependencies]
testkit = { path = "../../testkit" }
