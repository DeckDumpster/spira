# The contract's functions: the aggregate branch-coverage run reports any branch in them that
# the conformance suite leaves uncovered, naming path:line, and exits 1.
[[scope]]
path = "state-store/src/contract.rs"
functions = [
    "Contract::open",
    "Contract::read",
    "Contract::with_expiry",
    "Contract::list_page",
    "Contract::create",
    "Contract::txn",
    "Contract::delete",
    "Contract::watch",
    "Contract::lock",
    "Contract::check_lock_ttl",
    "Contract::expire_dead_locks",
    "Contract::fences_at",
    "Contract::holder_write",
    "Contract::holds",
    "Contract::engine",
    "Contract::stage",
    "Contract::commit",
    "Contract::expire",
    "Contract::collect",
    "validate",
    "Txn::lock_keys",
    "Op::key",
    "Compare::key",
    "audited",
    "ttl_ms",
    "normalize",
]

[[scope]]
path = "state-store/src/limits.rs"
functions = ["check", "request_bytes", "compare_bytes"]

[[scope]]
path = "state-store/src/gc.rs"
functions = ["Controller::tick"]

[[scope]]
path = "state-store/src/mem.rs"
functions = ["MemBackend::range", "MemBackend::commit", "MemBackend::log", "MemBackend::compact"]
