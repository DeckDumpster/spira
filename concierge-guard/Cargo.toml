[package]
name = "concierge-guard"
version = "1.0.0"
edition = "2021"
description = "concierge-guard — wakes the Concierge session when its inbox waiter lapses, and mails the operator when the wake does not take."

[lib]
name = "concierge_guard"
path = "src/lib.rs"

[[bin]]
name = "concierge-guard"
path = "src/main.rs"
test = false

[dependencies]
spira-config = { path = "../spira-config" }

[dev-dependencies]
testkit = { path = "../testkit" }

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
