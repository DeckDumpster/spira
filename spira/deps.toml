# spira/deps.toml — every external program this harness or its tests invoke.
#
# Fields:
#   name          the program name as found on PATH
#   tier          runtime | optional | dev | operator
#   purpose       one sentence: what it does for the harness
#   version_min   minimum acceptable version string (empty = any)
#   version_probe shell command that emits the program's version on stdout
# Optional:
#   absent        what actually happens when the program is missing, if more
#                 than one named feature going off — doctor.sh prints this
#
# Tiers:
#   runtime   the loop cannot run at all without this
#   optional  the loop runs; one named feature is off
#   operator  needed on an operated instance (SPIRA_OPERATED=1)
#   dev       needed to develop or test Spira; not needed to run it
#   release   one of Spira's own binaries, shipped in every release's bin/ and invoked by
#             bare name on the launcher's PATH (sp-gypjk); a missing one is a broken
#             release, never an optional feature. doctor.sh checks every one resolves.
#             Its version is the release it came from: the probe resolves the binary's
#             real path, spira-releases/<sha>/bin/<name>.

[[dep]]
name = "bd"
tier = "runtime"
purpose = "the beads issue tracker — the substrate; nothing runs without it"
version_min = ""
version_probe = "bd --version"

[[dep]]
name = "git"
tier = "runtime"
purpose = "every repository operation"
version_min = ""
version_probe = "git --version"

[[dep]]
name = "hostname"
tier = "optional"
purpose = "incident's systemd-unit evidence gathering names the host it ran on; missing it degrades to an empty host field, never a failure to file"
version_min = ""
version_probe = "hostname --version"

[[dep]]
name = "journalctl"
tier = "optional"
purpose = "incident's systemd-unit evidence gathering includes the failing unit's last 40 journal lines; missing it degrades to '(journal unavailable)', never a failure to file"
version_min = ""
version_probe = "journalctl --version"

[[dep]]
name = "tar"
tier = "runtime"
purpose = "release build extracts git archive of the commit it builds (release crate)"
version_min = ""
version_probe = "tar --version"

[[dep]]
name = "python3"
tier = "runtime"
purpose = "every JSON payload this harness parses"
version_min = ""
version_probe = "python3 --version"

[[dep]]
name = "flock"
tier = "runtime"
purpose = "serialising writers that share one path — the transcript archive, and the landing gate's per-repository tree"
version_min = ""
version_probe = "flock --version"

[[dep]]
name = "dolt"
tier = "optional"
purpose = "the SQL server beads stores its database in"
version_min = ""
version_probe = "dolt version"

[[dep]]
name = "duckdb"
tier = "runtime"
purpose = "the query layer over run/tsd/'s append-only JSONL files — trailing baselines, rates and dwell percentiles for the reconciler's flow invariants (tsd-query.sh)"
version_min = ""
version_probe = "duckdb --version"

[[dep]]
name = "gh"
tier = "optional"
purpose = "opening and landing pull requests (repos whose land mode is 'pr')"
version_min = ""
version_probe = "gh --version"

[[dep]]
name = "openssl"
tier = "optional"
purpose = "signing GitHub App JWTs to mint installation tokens (broker and app-token.sh) — needed only for repos whose land mode is 'pr'"
version_min = ""
version_probe = "openssl version"

[[dep]]
name = "tmux"
tier = "optional"
purpose = "the cockpit panes"
version_min = ""
version_probe = "tmux -V"

[[dep]]
name = "node"
tier = "optional"
purpose = "gating the browser page's view model; the loop itself never needs it"
version_min = ""
version_probe = "node --version"

[[dep]]
name = "cargo"
tier = "optional"
purpose = "building the decisions panel; not needed to run the loop"
version_min = "1.78.0"
version_probe = "cargo --version"

[[dep]]
name = "sccache"
tier = "operator"
purpose = "the box's one shared compilation cache (sp-z61hj): every Spira build (gate tree tools and unit phases, testenv, release build) compiles through it, so a dependency crate is compiled once per Cargo.lock and profile, not once per worktree. Install: cargo install sccache --locked"
version_min = ""
version_probe = "sccache --version"
absent = "every build tool refuses rather than compile every dependency cold: the gate is NO_VERDICT reason=no-build-cache, testenv faults rc=3 reason=no-build-cache, release build errors; an aeon session runs with its builds uncached and says so. SPIRA_BUILD_CACHE=off opts out on purpose."

[[dep]]
name = "rustup"
tier = "dev"
purpose = "acceptance-local.sh: pins the tarball build to release.yml's own Rust toolchain (SPIRA_RELEASE_RUST_TOOLCHAIN)"
version_min = ""
version_probe = "rustup --version"
absent = "acceptance-local.sh builds with whatever cargo resolves to on PATH instead of the pinned release toolchain, and says so"

[[dep]]
name = "jq"
tier = "optional"
purpose = "optional JSON convenience"
version_min = ""
version_probe = "jq --version"

[[dep]]
name = "zstd"
tier = "optional"
purpose = "compressing archived transcripts; gzip is used when it is absent"
version_min = ""
version_probe = "zstd --version"

[[dep]]
name = "aws"
tier = "optional"
purpose = "the AWS CLI v2 — required when the runner pool spills to EC2; without it, spilled gate runs cannot authenticate to AWS"
version_min = ""
version_probe = "aws --version"

[[dep]]
name = "claude"
tier = "optional"
purpose = "the agent an aeon is a session of"
version_min = ""
version_probe = "claude --version"

[[dep]]
name = "bd-embedded"
tier = "dev"
purpose = "the CGO build of bd that opens an embedded Dolt store — the test fixture engine"
version_min = ""
version_probe = "bd-embedded version"
absent = "test fixtures fall back to a shared Dolt server instead of a private embedded store per fixture. Not a feature off: concurrent fixture builds contend on one schema lock, measured at 610s with 5 of 6 failing, against 25s with 0 failing on embedded. Suites fail in ways that read as defects in the code under test. Restore with build-bd.sh --install (needs a Go toolchain)."

[[dep]]
name = "podman"
tier = "dev"
purpose = "container fixtures for the suites that need a whole machine"
version_min = ""
version_probe = "podman --version"
absent = "every suite that builds a container fixture cannot run; testenv.sh and the suites that use it fail rather than skip."

[[dep]]
name = "inotifywait"
tier = "operator"
purpose = "delivering mail the moment it arrives (inotify-tools); without it mail waits for the next session start"
version_min = ""
version_probe = "inotifywait --version"
absent = "no mail is delivered to registered readers mid-session — escalations and verdict replies wait for the next session start."

[[dep]]
name = "aerc"
tier = "operator"
purpose = "the operator's mail client for reading and answering; any Maildir client works"
version_min = ""
version_probe = "aerc --version"

[[dep]]
name = "hunk"
tier = "operator"
purpose = "the review pane: designs and diffs are read and commented on in hunk (npm hunkdiff, needs node)"
version_min = ""
version_probe = "hunk --version"

[[dep]]
name = "go"
tier = "operator"
purpose = "building the pinned bd from source when no prebuilt exists for this platform; without it a bd mismatch cannot be recovered locally"
version_min = ""
version_probe = "go version"

