extensions:
  file_storage:
    directory: /state
  file_storage/logs:
    directory: /state/logs

receivers:
  otlp:
    protocols:
      http:
        endpoint: 0.0.0.0:4318
  otlpjsonfile:
    include: ["/otel/*.jsonl"]
    start_at: end
    storage: file_storage
  otlpjsonfile/logs:
    include: ["/otel/*.jsonl"]
    start_at: end
    storage: file_storage/logs

connectors:
  spanmetrics:
    namespace: traces.span.metrics
    histogram:
      explicit:
        buckets: [1ms, 5ms, 10ms, 25ms, 50ms, 100ms, 250ms, 500ms, 1s, 2500ms, 5s, 10s, 30s]
    dimensions:
      - name: rpc.method
      - name: spira.caller

exporters:
  prometheusremotewrite:
    endpoint: http://victoria-metrics:8428/api/v1/write
    timeout: 30s
    resource_to_telemetry_conversion:
      enabled: true

  otlphttp/victorialogs:
    logs_endpoint: http://victoria-logs:9428/insert/opentelemetry/v1/logs
    timeout: 30s

service:
  extensions: [file_storage, file_storage/logs]
  pipelines:
    traces:
      receivers: [otlpjsonfile, otlp]
      exporters: [spanmetrics]
    metrics:
      receivers: [spanmetrics]
      exporters: [prometheusremotewrite]
    logs:
      receivers: [otlpjsonfile/logs, otlp]
      exporters: [otlphttp/victorialogs]
