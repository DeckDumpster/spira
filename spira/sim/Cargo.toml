[package]
name = "spira-sim"
version = "0.1.0"
edition = "2021"
autotests = false
publish = false
description = "spira-sim — the deterministic simulator's hermetic scratch world (sim world up/down); the simulator and sim gh live in this crate."

[lib]
name = "spira_sim"
path = "src/lib.rs"

[[bin]]
name = "sim"
path = "src/main.rs"
test = false

[[bin]]
name = "sim-agent"
path = "src/bin/sim-agent.rs"
test = false

[[test]]
name = "it"
path = "tests/it/main.rs"
required-features = ["integration"]

[features]
integration = ["lifecycle/integration", "queue/integration", "runtime/integration", "sim/integration", "spira-config/integration", "spira-store/integration", "spira-otel/integration", "spira-runtime/integration", "testkit/integration", "batcher-cut/integration", "cockpit-collect/integration", "cockpit-ops/integration", "test-registry/integration", "system-paths/integration", "dwarf/integration", "spira-test-id/integration", "spira-lint/integration", "release/integration"]
[dependencies]
spira-otel = { path = "../../spira-otel" }
serde_json = "1"
serde = { version = "1", features = ["derive"] }
toml = "0.8"
sim = { path = "../../sim" }
spira-runtime = { path = "../../spira-runtime" }
runtime = { path = "../../runtime" }
lifecycle = { path = "../../lifecycle" }
spira-config = { path = "../../spira-config" }
spira-store = { path = "../../spira-store" }
system-paths = { path = "../../system-paths" }
batcher-cut = { path = "../../batcher-cut" }
spira-lint = { path = "../../spira-lint" }
test-registry = { path = "../../test-registry" }
cockpit-collect = { path = "../../cockpit-collect" }
cockpit-ops = { path = "../../cockpit/ops" }
release = { path = "../../release" }

[dev-dependencies]
spira-test-id = { path = "../../spira-test-id" }
testkit = { path = "../../testkit" }
queue = { path = "../../queue" }
dwarf = { path = "../../dwarf" }
