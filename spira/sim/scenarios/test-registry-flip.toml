# The test registry's flip path as an operator meets it: a round finds two tests red on its
# combined tree and green on every member alone, disables each in the registry for its hold with a
# follow-on bead, and lands without them; the ops pane lists both with their beads and expiry; the
# first follow-on lands and its landing clears its row; the second never lands, its row expires,
# the pane empties, and a later round finds the test red again. The hold is set to a day, not the
# registry's seven, so the walk costs seconds of real time. Run it with
# `sim run test-registry-flip`.
#
# A loop world: the registry is the real file and verbs, the disabling is batcher-cut's own
# `disable_flips_with`, and the pane is drawn by the cockpit's own collector and renderer. The
# world scripts the attribution's verdict (red together, green alone) instead of rerunning trees;
# the attribution itself is the batcher's tests (spira/sim/src/loopworld.rs).
driver = "loop"
goal = "sp-tr02:LANDED"
until = 120000000
settings = { SPIRA_TEST_REGISTRY_HOLD_SECS = "86400" }

[[bead]]
id = "sp-tr01"
at = 30000

# Past the second row's expiry: its test is out of the deny list and blocks its round again.
[[bead]]
id = "sp-tr04"
at = 95000000

[[flip]]
test = "unit:loom factory::tests::cleared_by_landing"
members = ["sp-tr01"]
follow_on = "sp-tr02"

[[flip]]
test = "unit:loom factory::tests::left_to_expire"
members = ["sp-tr01", "sp-tr04"]
follow_on = "sp-tr03"
follow_on_lands = false
blocks_again_after = 95000000

# The round has landed and neither follow-on has: both rows are held.
[[look]]
at = 1500000
rows = [
  { test = "unit:loom factory::tests::cleared_by_landing", bead = "sp-tr02" },
  { test = "unit:loom factory::tests::left_to_expire", bead = "sp-tr03" },
]

# sp-tr02 has landed: its row is gone, the other stays.
[[look]]
at = 10000000
rows = [{ test = "unit:loom factory::tests::left_to_expire", bead = "sp-tr03" }]

# A day and a little on: nothing is held.
[[look]]
at = 90000000
