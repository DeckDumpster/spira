epoch = 1800000000
horizon = 2400000
goal = "sp-rp02:LANDED"
real_actors = ["sentinel-landing", "sift"]

[[actor]]
name = "gate-worker"
command = "gate-worker run"
first = 20000
every = 30000
duration_min = 2000
duration_max = 10000

[[actor]]
name = "submit-call"
command = "sentinel --call-only"
first = 1000
duration_min = 1000
duration_max = 2500

[[step]]
at = 0
command = 'spira-config set spira.batcher_enable 0 "$SPIRA_TOML"'

[[step]]
at = 0
command = 'spira-config set spira.queue_rounds_max 2 "$SPIRA_TOML"'

[[step]]
at = 0
file = "sp-rp01"

[[step]]
at = 0
file = "sp-rp02"

[[step]]
at = 0
claim = "sp-rp01"
script = ["commit out/a.txt", "submit"]

[[step]]
at = 0
claim = "sp-rp02"
script = ["commit out/b.txt", "submit"]

# Each move runs 10 s after a gate-worker start, so the gate's verdicts are on disk when a
# move lands the round.
[[step]]
name = "move-1"
at = 150000
command = "sh spira/sim/scenarios/steps/rc-stale-round.sh sim sp-rp01 sp-rp02"

