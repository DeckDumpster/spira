[[invariant]]
name = "no_move_answered_wrong"
sql = "SELECT seq, actor, exit FROM events WHERE kind = 'step' AND exit NOT IN (0, 3)"

[[expect]]
name = "b_landed_after_a_was_abandoned_under_its_record"
sql = "SELECT 1 FROM run_landing_log WHERE event = 'ROUND-LAND' AND repo = 'sim' AND text LIKE '%batch=rc-b%'"
