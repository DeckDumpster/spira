epoch = 1800000000
horizon = 900000
settle = 240000
goal = "sp-qa01:SUBMITTED"

# The call. sentinel-call is a task of `spira-runtime serve` now (ruling D6): when to call is
# decided in-process and tested in sim/tests (`whole_loop.rs`, `loop_ports.rs`). This world keeps
# what its `unit_start` effect runs once it calls: `dwarf --home <home> builder` under the
# properties `call_argv` gives, through the world's SPIRA_CALL seam (`sim-call`, standing where
# systemd-run stands, which ranks the builder's claimable beads with `spira-claim`), on the
# call's minute.
[[actor]]
name = "call"
command = '"$SPIRA_CALL" --property=TimeoutStartSec=3600 --property=IOSchedulingClass=idle --property=IOWeight=10 --setenv=SPIRA_RELEASE="$SPIRA_RELEASE" --setenv=PATH="$SPIRA_RELEASE/bin:$SPIRA_RELEASE/spira:/usr/local/bin:/usr/bin:/bin" --setenv=HOME="$HOME" --setenv=SPIRA_TOML="$SPIRA_TOML" "$SPIRA_RELEASE/bin/dwarf" --home "$SPIRA_HOME" builder'
first = 5000
every = 60000
duration_min = 1000
duration_max = 2500

[[step]]
at = 0
file = "sp-qa01"

[[step]]
at = 0
file = "sp-qa02"

[[step]]
at = 0
command = 'bd -C "$SIM_BEADS_DB" label add sp-qa02 qa-proposed'

[[step]]
at = 0
claim = "sp-qa01"
script = ["commit out/qa01.txt", "submit"]

[[step]]
at = 0
claim = "sp-qa02"
script = ["commit out/qa02.txt", "submit"]

[[step]]
at = 30000
command = "sh spira/sim/scenarios/steps/partition-excludes.sh sp-qa01 sp-qa02"

[[step]]
at = 150000
command = "sh spira/sim/scenarios/steps/partition-excludes.sh sp-qa01 sp-qa02"

[[step]]
at = 300000
command = "sh spira/sim/scenarios/steps/partition-excludes.sh sp-qa01 sp-qa02"

[[invariant]]
name = "step_failed"
sql = "SELECT seq, actor, exit FROM events WHERE kind = 'step' AND exit NOT IN (0, 3)"

[[expect]]
name = "plain_bead_claimed_and_submitted"
sql = "SELECT 1 FROM bead_state WHERE bead = 'sp-qa01' AND lc_state = 'SUBMITTED'"

[[expect]]
name = "proposal_never_claimed"
sql = "SELECT 1 FROM bead_state WHERE bead = 'sp-qa02' AND lc_state = 'READY'"

[[expect]]
name = "exclusion_checked"
sql = "SELECT 1 FROM events WHERE kind = 'step' AND exit = 0 AND actor IN ('step6', 'step7', 'step8')"
