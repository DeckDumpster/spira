# The round controller's cutover readiness in a world of two round repos: both declare a gate in
# gate.steps and carry a green base on their lane's image, and only sim has a SUBMITTED bead. The
# checker waits (exit 3) until sim's bead is SUBMITTED, then seeds both lanes and base verdicts
# and runs `round-controller cutover-check --readiness`, which must exit 1 with sim's row green,
# other's red on submitted alone and the global row green.
epoch = 1800000000
horizon = 300000
repos = ["other:queue.local"]

# The call claims the bead and plays its script; nothing lands or certifies it. sentinel-call is
# a task of `spira-runtime serve` now (ruling D6), tested in sim/tests; this world keeps what its
# `unit_start` effect runs once it calls: `dwarf --home <home> builder` under the properties
# `call_argv` gives, through the world's SPIRA_CALL seam (`sim-call`), on the call's minute.
[[actor]]
name = "call"
command = '"$SPIRA_CALL" --property=TimeoutStartSec=3600 --property=IOSchedulingClass=idle --property=IOWeight=10 --setenv=SPIRA_RELEASE="$SPIRA_RELEASE" --setenv=PATH="$SPIRA_RELEASE/bin:$SPIRA_RELEASE/spira:/usr/local/bin:/usr/bin:/bin" --setenv=HOME="$HOME" --setenv=SPIRA_TOML="$SPIRA_TOML" "$SPIRA_RELEASE/bin/dwarf" --home "$SPIRA_HOME" builder'
first = 5000
every = 60000
duration_min = 1000
duration_max = 2500

# Filed naming its repo, so the lifecycle row carries the repo readiness counts SUBMITTED beads by.
[[step]]
at = 0
file = "sp-cr01"
repo = "sim"

[[step]]
at = 0
claim = "sp-cr01"
script = ["commit out/cr01.txt", "submit"]

[[actor]]
name = "readiness"
command = "sh spira/sim/scenarios/steps/rc-cutover-readiness.sh sp-cr01"
first = 30000
every = 30000
duration_min = 1000
duration_max = 2000

[[invariant]]
name = "step_failed"
sql = "SELECT seq, actor, exit FROM events WHERE kind = 'step' AND exit <> 0"

[[invariant]]
name = "readiness_rows_wrong"
sql = "SELECT seq, actor, exit FROM events WHERE kind = 'complete' AND actor = 'readiness' AND exit NOT IN (0, 3)"

[[expect]]
name = "readiness_named_the_unready_repo"
sql = "SELECT 1 FROM events WHERE kind = 'complete' AND actor = 'readiness' AND exit = 0"
