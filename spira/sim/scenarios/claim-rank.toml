epoch = 1800000000
horizon = 900000
settle = 120000
goal = "sp-cr01:SUBMITTED"

# The call. sentinel-call is a task of `spira-runtime serve` now (ruling D6): when to call is
# decided in-process and tested in sim/tests/it (`whole_loop.rs`, `loop_ports.rs`). This world keeps
# what its `unit_start` effect runs once it calls: `dwarf --home <home> builder` under the
# properties `call_argv` gives, through the world's SPIRA_CALL seam (`sim-call`, standing where
# systemd-run stands, which claims in `spira-claim select`'s rank), on the call's minute: one
# claim at 5 s, the next at 65 s.
[[actor]]
name = "call"
command = '"$SPIRA_CALL" --property=TimeoutStartSec=3600 --property=IOSchedulingClass=idle --property=IOWeight=10 --setenv=SPIRA_RELEASE="$SPIRA_RELEASE" --setenv=PATH="$SPIRA_RELEASE/bin:$SPIRA_RELEASE/spira:/usr/local/bin:/usr/bin:/bin" --setenv=HOME="$HOME" --setenv=SPIRA_TOML="$SPIRA_TOML" "$SPIRA_RELEASE/bin/dwarf" --home "$SPIRA_HOME" builder'
first = 5000
every = 60000
duration_min = 1000
duration_max = 2500

[[step]]
at = 0
file = "sp-cr01"
priority = 2

[[step]]
at = 0
file = "sp-cr02"
priority = 0

[[step]]
at = 0
claim = "sp-cr01"
script = ["commit out/cr01.txt", "submit"]

[[step]]
at = 0
claim = "sp-cr02"
script = ["commit out/cr02.txt", "submit"]

[[step]]
at = 30000
command = "sh spira/sim/scenarios/steps/claim-rank.sh sp-cr02 sp-cr01"

[[step]]
at = 90000
command = "sh spira/sim/scenarios/steps/claim-rank.sh sp-cr02 sp-cr01"

[[invariant]]
name = "step_failed"
sql = "SELECT seq, actor, exit FROM events WHERE kind = 'step' AND exit NOT IN (0, 3)"

[[expect]]
name = "first_ranked_submitted"
sql = "SELECT 1 FROM bead_state WHERE bead = 'sp-cr02' AND lc_state = 'SUBMITTED'"

[[expect]]
name = "second_ranked_submitted"
sql = "SELECT 1 FROM bead_state WHERE bead = 'sp-cr01' AND lc_state = 'SUBMITTED'"

[[expect]]
name = "order_checked"
sql = "SELECT 1 FROM events WHERE kind = 'step' AND exit = 0 AND actor IN ('step5', 'step6')"
