# The round controller's world twin of remarkable-stack: the sim-only actor runs `round-controller
# pass` with the Lander registered after supersede and orphans. The world's control store holds no
# lane and no round, so the Lander finds nothing to land: every pass exits 0, abandons nothing,
# lands nothing and leaves the world's run state untouched.
epoch = 1800000000
horizon = 150000
real_actors = ["round-controller"]

[[invariant]]
name = "rc_pass_exited_nonzero"
sql = "SELECT seq, exit FROM events WHERE actor = 'round-controller' AND kind = 'complete' AND exit <> 0"

[[invariant]]
name = "rc_changed_run_state"
sql = "SELECT seq, 'queue' AS family, key AS what FROM run_queue UNION ALL SELECT seq, 'locks', name FROM run_locks UNION ALL SELECT seq, 'ejected', bead FROM run_ejected UNION ALL SELECT seq, 'verdicts', key FROM run_verdicts UNION ALL SELECT seq, 'gate-log', text FROM run_gate_log UNION ALL SELECT seq, 'landing-log', text FROM run_landing_log"

[[expect]]
name = "rc_passes_ran_with_the_lander"
sql = "SELECT 1 FROM events WHERE actor = 'round-controller' AND kind = 'complete' AND exit = 0"
