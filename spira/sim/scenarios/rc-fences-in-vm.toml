epoch = 1800000000
horizon = 3600000
settle = 120000
goal = "sp-fv01:LANDED"
real_actors = ["sentinel-call", "sentinel-landing", "sift", "rounds"]

# A round's fences run inside the round VM from the tree's gate.steps, never on the host.

[[actor]]
name = "gate-worker"
command = "gate-worker run"
first = 20000
every = 30000
duration_min = 2000
duration_max = 10000

[[actor]]
name = "fences-in-vm"
command = "sh spira/sim/scenarios/steps/fences-in-vm.sh"
first = 30000
every = 30000
duration_min = 100
duration_max = 500

[[step]]
at = 0
file = "sp-fv01"

[[step]]
at = 0
claim = "sp-fv01"
script = ["commit out/fv01.txt", "submit"]

[[invariant]]
name = "no_fence_runs_on_the_host"
sql = "SELECT seq, actor, exit FROM events WHERE kind = 'complete' AND actor = 'fences-in-vm' AND exit NOT IN (0, 3)"

[[expect]]
name = "fence_results_arrive_from_the_round_vm"
sql = "SELECT 1 FROM events WHERE kind = 'complete' AND actor = 'fences-in-vm' AND exit = 0"
