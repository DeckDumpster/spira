# The happy path: one bead filed, called, claimed, submitted, sifted, cut into a round, its corpus
# and certify legs green, landed on local main, and the landed head published by PR.
#
# A loop world (ruling D6 of the scheduler consolidation design): the service's own registrations
# run in-process on the virtual clock and every effect is a double (spira/sim/src/loopworld.rs).
# The dwarf session, the round VM's corpus pass and the certify leg are units on the scripted
# manager; the landing is `queue round land`'s double; the forge is the publish task's doubles,
# which open the PR. Merging that PR and tagging the release were GitHub's acts in the world
# scenario this replaces (sim gh's `pr-merge` and `tag`), not the loop's.
driver = "loop"
goal = "sp-hp01:LANDED"
publish = true
until = 2400000

[[bead]]
id = "sp-hp01"
at = 30000
