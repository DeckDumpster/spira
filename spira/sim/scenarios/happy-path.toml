epoch = 1800000000
horizon = 7200000
goal = "sp-hp01:LANDED"
goal_tag = "spira-release-"
real_actors = ["sentinel-summon", "sentinel-landing", "gate-worker", "rounds", "publish"]

[[step]]
at = 0
file = "sp-hp01"

[[step]]
at = 0
claim = "sp-hp01"
script = ["commit out/happy.txt", "submit"]

# Real GitHub finishes the publish PR's checks, merges it, and the release workflow tags the
# merge; here each is one explicit act, retried until the publish PR exists.
[[step]]
at = 340000
command = """
pr=$(gh pr list --state open --json number -q '.[0].number // ""'); [ -n "$pr" ] || exit 3
sha=$(gh pr view "$pr" --json headRefOid -q .headRefOid)
sim ghctl "$SIM_GH_DIR" check-run "$sha" gate completed success
sim ghctl "$SIM_GH_DIR" pr-merge "$pr"
sim ghctl "$SIM_GH_DIR" tag "spira-release-$(printf %.12s "$sha")" "$sha"
"""

[[step]]
at = 420000
command = """
pr=$(gh pr list --state open --json number -q '.[0].number // ""'); [ -n "$pr" ] || exit 3
sha=$(gh pr view "$pr" --json headRefOid -q .headRefOid)
sim ghctl "$SIM_GH_DIR" check-run "$sha" gate completed success
sim ghctl "$SIM_GH_DIR" pr-merge "$pr"
sim ghctl "$SIM_GH_DIR" tag "spira-release-$(printf %.12s "$sha")" "$sha"
"""
