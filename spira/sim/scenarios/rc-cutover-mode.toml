# Every move is done by now: the world is halted, cutover mode's stops are gone, the bead stayed unclaimed.
[[step]]
name = "rehalted"
at = 1200000
command = "bash spira/sim/scenarios/steps/rc-cutover-mode.sh sim sp-cm01 sp-cm02 sp-cm03 final"

[[invariant]]
name = "no_move_answered_wrong"
sql = "SELECT seq, actor, exit FROM events WHERE kind = 'step' AND exit NOT IN (0, 3)"

[[invariant]]
name = "a_held_actor_ran_under_cutover_mode"
sql = "SELECT seq, actor, exit FROM events WHERE kind = 'complete' AND actor IN ('landing', 'czar-pass', 'reconciler') AND exit <> 0"

[[invariant]]
name = "the_window_claimed_a_bead"
sql = "SELECT seq, bead, lc_state FROM bead_state WHERE bead = 'sp-cm02' AND lc_state NOT IN ('READY', 'OPEN')"

[[invariant]]
name = "a_round_landed_that_was_not_hand_landed"
sql = "SELECT seq, text FROM run_landing_log WHERE event = 'ROUND-LAND' AND text NOT LIKE '%batch=rc-cm%'"

[[expect]]
name = "round_recert_landed_the_round_under_cutover_mode"
sql = "SELECT 1 FROM run_landing_log WHERE event = 'ROUND-LAND' AND repo = 'sim' AND text LIKE '%batch=rc-cm%'"

[[expect]]
name = "the_landed_bead_landed"
sql = "SELECT 1 FROM bead_state WHERE bead = 'sp-cm01' AND lc_state = 'LANDED'"

[[expect]]
name = "the_world_was_halted_again_and_rolled_back"
sql = "SELECT 1 FROM events WHERE kind = 'step' AND actor = 'rehalted' AND exit = 0"
