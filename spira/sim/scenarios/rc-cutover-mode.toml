# A world held in cutover mode for a hand-landed round: two beads are certified, the world is
# stopped, and `world cutover-mode` lifts the halt stamp and stops every lane but rounds. Over the
# window round-recert lands one round, while the sentinel's calls claim nothing, landing-pass lands
# nothing and czar-pass and the reconciler skip. `world stop` re-halts and lifts exactly the stops
# cutover mode laid, and a round of the other bead is abandoned as a rollback would. Every move is
# a checked block of docs/runbooks/rounds.md (steps/runbook.sh).
epoch = 1800000000
horizon = 1500000
real_actors = ["sentinel-call", "sift"]

[[actor]]
name = "gate-worker"
command = "gate-worker run"
first = 20000
every = 30000
duration_min = 2000
duration_max = 10000

[[actor]]
name = "landing"
command = "sh spira/sim/scenarios/steps/rc-cutover-actor.sh land landing-pass land"
first = 15000
every = 30000
duration_min = 1000
duration_max = 3000

[[actor]]
name = "czar-pass"
command = "sh spira/sim/scenarios/steps/rc-cutover-actor.sh czar czar-pass --pass"
first = 25000
every = 30000
duration_min = 1000
duration_max = 2000

[[actor]]
name = "reconciler"
command = "sh spira/sim/scenarios/steps/rc-cutover-actor.sh remedies reconciler --pass"
first = 35000
every = 30000
duration_min = 1000
duration_max = 2000

[[step]]
at = 0
command = 'spira-config set spira.batcher_enable 0 "$SPIRA_TOML"'

[[step]]
at = 0
file = "sp-cm01"

[[step]]
at = 0
file = "sp-cm02"

[[step]]
at = 0
file = "sp-cm03"

# The unclaimed bead is reserved until cutover mode is entered, so only the window can claim it.
[[step]]
at = 0
command = 'world pause --reserve sp-cm02 --reason "claimable only under cutover mode" --until "cutover mode is entered"'

[[step]]
at = 0
claim = "sp-cm01"
script = ["commit out/cm01.txt", "submit"]

[[step]]
at = 0
claim = "sp-cm02"
script = ["commit out/cm02.txt", "submit"]

[[step]]
at = 0
claim = "sp-cm03"
script = ["commit out/cm03.txt", "submit"]

[[step]]
name = "move-1"
at = 150000
command = "bash spira/sim/scenarios/steps/rc-cutover-mode.sh sim sp-cm01 sp-cm02 sp-cm03"

