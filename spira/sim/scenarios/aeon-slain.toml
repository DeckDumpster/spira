epoch = 1800000000
horizon = 900000
settle = 240000
goal = "sp-sl01:SUBMITTED"
real_actors = ["sentinel-summon"]
real_aeon = true

[[step]]
at = 0
file = "sp-sl01"
body = "## Build\n\nAdd out/sl01.txt."

[[step]]
at = 0
claim = "sp-sl01"
script = ["slain", "summon", "commit out/sl01.txt", "submit"]

[[step]]
at = 100000
name = "attempts1"
command = "sh spira/sim/scenarios/steps/attempts.sh sp-sl01 1"

[[step]]
at = 160000
name = "attempts2"
command = "sh spira/sim/scenarios/steps/attempts.sh sp-sl01 1"

[[step]]
at = 220000
name = "attempts3"
command = "sh spira/sim/scenarios/steps/attempts.sh sp-sl01 1"

[[invariant]]
name = "step_failed"
sql = "SELECT seq, actor, exit FROM events WHERE kind = 'step' AND exit NOT IN (0, 3)"

[[expect]]
name = "slain_session_released_the_bead_for_a_second"
sql = "SELECT 1 FROM briefs WHERE bead = 'sp-sl01' AND n = 2"

[[expect]]
name = "slain_charged_no_attempt"
sql = "SELECT 1 FROM events WHERE kind = 'step' AND actor IN ('attempts1', 'attempts2', 'attempts3') AND exit = 0"
