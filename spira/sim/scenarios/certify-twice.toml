epoch = 1800000000
horizon = 2400000
goal = "sp-ct01:LANDED"
real_actors = ["sentinel-summon", "sentinel-landing", "sift"]

[[actor]]
name = "gate-worker"
command = "gate-worker run"
first = 20000
every = 30000
duration_min = 2000
duration_max = 10000

[[step]]
at = 0
command = 'spira-config set spira.batcher_enable 0 "$SPIRA_TOML"'

[[step]]
at = 0
file = "sp-ct01"

[[step]]
at = 0
claim = "sp-ct01"
script = ["commit out/a.txt", "submit"]

[[step]]
at = 800000
command = "sh spira/sim/scenarios/steps/recertify.sh sp-ct01"

[[step]]
at = 860000
command = "sh spira/sim/scenarios/steps/recertify.sh sp-ct01"

[[step]]
at = 920000
command = "sh spira/sim/scenarios/steps/recertify.sh sp-ct01"

[[step]]
at = 1000000
command = 'spira-config set spira.batcher_enable 1 "$SPIRA_TOML"'

[[invariant]]
name = "repeat_verdict_refused"
sql = "SELECT seq, actor, exit FROM events WHERE kind = 'step' AND exit NOT IN (0, 3)"

[[expect]]
name = "certified_before_the_round"
sql = "SELECT 1 FROM bead_state WHERE bead = 'sp-ct01' AND lc_state = 'CERTIFIED' AND lc_tip = branch_tip"

[[expect]]
name = "repeat_verdict_accepted"
sql = "SELECT 1 FROM events WHERE kind = 'step' AND exit = 0 AND actor IN ('step4', 'step5', 'step6')"
