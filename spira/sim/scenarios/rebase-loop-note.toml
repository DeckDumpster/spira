epoch = 1800000000
horizon = 1200000
goal = "sp-rl01:SUBMITTED"

# `landing-pass ask-rebase-loop` tells the Concierge with a note and never asks the operator
# (replaced test-rebase-escalation, sp-jyx6yr). The property is the ask's, so the world needs the
# bead's branch and row, not its landing: it stops at SUBMITTED. The loop's tasks are
# `spira-runtime serve`'s now (ruling D6), tested in sim/tests/it.
#
# The call: what sentinel-call's `unit_start` effect runs once it calls, `dwarf --home <home>
# builder` under the properties `call_argv` gives, through the world's SPIRA_CALL seam
# (`sim-call`, standing where systemd-run stands), on the call's minute.
[[actor]]
name = "call"
command = '"$SPIRA_CALL" --property=TimeoutStartSec=3600 --property=IOSchedulingClass=idle --property=IOWeight=10 --setenv=SPIRA_RELEASE="$SPIRA_RELEASE" --setenv=PATH="$SPIRA_RELEASE/bin:$SPIRA_RELEASE/spira:/usr/local/bin:/usr/bin:/bin" --setenv=HOME="$HOME" --setenv=SPIRA_TOML="$SPIRA_TOML" "$SPIRA_RELEASE/bin/dwarf" --home "$SPIRA_HOME" builder'
first = 5000
every = 60000
duration_min = 1000
duration_max = 2500

[[step]]
at = 0
file = "sp-rl01"

[[step]]
at = 0
claim = "sp-rl01"
script = ["commit out/a.txt", "submit"]

[[step]]
at = 1000
command = 'landing-pass ask-rebase-loop sp-rl01 spira/sp-rl01 spira 3 foo.sh ""'

[[invariant]]
name = "rebase_loop_never_asks_the_operator"
sql = "SELECT seq, mailbox, kind, subject FROM mail WHERE mailbox = 'operator' OR kind IN ('question', 'decision')"

[[expect]]
name = "concierge_got_the_rebase_loop_note"
sql = "SELECT 1 FROM mail WHERE mailbox = 'concierge' AND kind = 'note' AND bead = 'sp-rl01' AND NOT read AND subject LIKE '%spira/sp-rl01 rebase loop x3 in %'"
