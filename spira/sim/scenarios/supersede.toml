epoch = 1800000000
horizon = 3600000
settle = 160000
goal = "sp-su01:LANDED"
real_actors = ["sentinel-landing", "sift", "gate-worker"]

[[actor]]
name = "submit-call"
command = "sentinel --call-only"
first = 1000
duration_min = 1000
duration_max = 2500

[[actor]]
name = "supersede-duty"
command = 'SPIRA_CONCIERGE_INBOX="$SPIRA_RUN/duty-inbox.log" bash spira/supersede-duty.sh pass'
first = 90000
every = 60000
duration_min = 1000
duration_max = 4000

[[step]]
at = 0
file = "sp-su01"

[[step]]
at = 0
claim = "sp-su01"
script = ["commit out/su01.txt", "submit"]

[[step]]
at = 0
file = "sp-su02"

[[step]]
at = 200000
command = "sh spira/sim/scenarios/steps/supersede-request.sh sp-su02 sp-su01 after-landed"

[[step]]
at = 230000
command = "sh spira/sim/scenarios/steps/supersede-request.sh sp-su02 sp-su01 after-landed"

[[step]]
at = 260000
command = "sh spira/sim/scenarios/steps/supersede-request.sh sp-su02 sp-su01 after-landed"

[[step]]
name = "check-landed"
at = 300000
command = "sh spira/sim/scenarios/steps/supersede-check.sh landed"

[[step]]
name = "check-landed-again"
at = 330000
command = "sh spira/sim/scenarios/steps/supersede-check.sh landed"

[[invariant]]
name = "step_failed"
sql = "SELECT seq, actor, exit FROM events WHERE kind = 'step' AND exit NOT IN (0, 3)"

[[invariant]]
name = "only_a_landed_successor_supersedes"
sql = "SELECT seq, bead FROM bead_state WHERE lc_state = 'SUPERSEDED' AND bead <> 'sp-su02'"

[[expect]]
name = "landed_successor_supersedes"
sql = "SELECT 1 FROM bead_state WHERE bead = 'sp-su02' AND lc_state = 'SUPERSEDED'"

[[expect]]
name = "bd_side_and_inbox_checked"
sql = "SELECT 1 FROM events WHERE kind = 'step' AND exit = 0 AND actor IN ('check-landed', 'check-landed-again')"
