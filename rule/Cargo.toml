[package]
name = "rule"
version = "0.1.0"
edition = "2021"
autotests = false
description = "rule — enact, retire, list, show a statute in one command (sp-g9mhe, replaces rule.sh)."

[lib]
name = "rule"
path = "src/lib.rs"

[[bin]]
name = "rule"
path = "src/main.rs"
test = false

[[test]]
name = "code"
path = "tests/code.rs"
required-features = ["integration"]

[[test]]
name = "law_synth"
path = "tests/law_synth.rs"
required-features = ["integration"]

[[test]]
name = "wiki_commit"
path = "tests/wiki_commit.rs"
required-features = ["integration"]

[[test]]
name = "prompt_paths"
path = "tests/prompt_paths.rs"
required-features = ["integration"]

[[test]]
name = "vocab"
path = "tests/vocab.rs"
required-features = ["integration"]

[features]
integration = ["bead/integration", "spira-config/integration", "spira-store/integration", "spira-lint/integration", "sop/integration", "spira-otel/integration", "testkit/integration", "spira-test-id/integration", "release/integration"]

[dependencies]
spira-otel = { path = "../spira-otel" }
serde_json = "1"
toml = "0.8"
spira-config = { path = "../spira-config" }
spira-store = { path = "../spira-store" }
spira-lint = { path = "../spira-lint" }
sop = { path = "../sop" }

[dev-dependencies]
spira-test-id = { path = "../spira-test-id" }
testkit = { path = "../testkit" }
bead = { path = "../bead" }
release = { path = "../release" }
