[package]
name = "rule"
version = "0.1.0"
edition = "2021"
autotests = false
description = "rule — enact, retire, list, show a statute in one command (sp-g9mhe, replaces rule.sh)."

[lib]
name = "rule"
path = "src/lib.rs"

[[bin]]
name = "rule"
path = "src/main.rs"
test = false

[[test]]
name = "code"
path = "tests/code.rs"
required-features = ["integration"]

[features]
integration = ["bead/integration", "spira-config/integration", "spira-lint/integration", "spira-otel/integration", "testkit/integration"]

[dependencies]
spira-otel = { path = "../spira-otel" }
serde_json = "1"
toml = "0.8"
spira-config = { path = "../spira-config" }
spira-lint = { path = "../spira-lint" }

[dev-dependencies]
testkit = { path = "../testkit" }
bead = { path = "../bead" }
