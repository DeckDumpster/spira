[package]
name = "bead"
version = "0.1.0"
edition = "2021"
autotests = false
description = "bead — file a bead through the contract, lint the store against it, report it, wire a blocks edge (sp-g9mhe, replaces spira/bead.sh). Also carries the write guards the content door applies."

[lib]
name = "bead"
path = "src/lib.rs"

[[bin]]
name = "bead"
path = "src/main.rs"

[[bin]]
name = "bdsim"
path = "src/bin/bdsim.rs"
test = false

[[test]]
name = "no_fork_edges"
path = "tests/no_fork_edges.rs"
required-features = ["integration"]

[features]
integration = ["spira-config/integration", "spira-store/integration", "spira-otel/integration", "strand/integration", "testkit/integration", "system-paths/integration", "spira-test-id/integration"]
[dependencies]
system-paths = { path = "../system-paths" }
spira-otel = { path = "../spira-otel" }
regex = "1"
serde_json = { version = "1", features = ["preserve_order"] }
sha2 = "0.10"
spira-config = { path = "../spira-config" }
spira-store = { path = "../spira-store" }
strand = { path = "../strand" }

[dev-dependencies]
spira-test-id = { path = "../spira-test-id" }
testkit = { path = "../testkit" }
