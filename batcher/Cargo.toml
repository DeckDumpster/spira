[package]
name = "batcher"
version = "0.1.0"
edition = "2021"
description = "batcher — pure core: round membership, set-asides, green/flip/double-red classification, adaptive triggers and stacking. The IO seam (git, testenv-batch, the forge, the bead store) lives in a separate crate."

[features]
integration = ["forge/integration", "suite-select/integration", "spira-config/integration", "testkit/integration", "spira-test-id/integration"]
[dependencies]
suite-select = { path = "../suite-select" }

[dev-dependencies]
spira-test-id = { path = "../spira-test-id" }
testkit = { path = "../testkit" }
spira-config = { path = "../spira-config" }
forge = { path = "../forge" }
