[package]
name = "mimir-trigger"
version = "1.0.0"
edition = "2021"
description = "mimir-trigger — evaluate the Mimir trigger conditions (landing volume, time gap, invalid-closed rows) and file a sweep bead when one fires, with idempotent dedup. Rust port of spira/mimir-trigger.sh (sp-0ekp7, wave 7b)."

[[bin]]
name = "mimir-trigger"
path = "src/main.rs"

[features]
integration = ["spira-config/integration", "spira-store/integration", "spira-otel/integration", "strand/integration"]

[dependencies]
spira-config = { path = "../spira-config" }
spira-store = { path = "../spira-store" }
spira-otel = { path = "../spira-otel" }
serde_json = "1"
strand = { path = "../strand" }

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
