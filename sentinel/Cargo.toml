[package]
name = "sentinel"
version = "1.0.0"
edition = "2021"
description = "sentinel — the loop's heartbeat: one reconcile pass over the work graph (CHECK 1-8), the 15s call fast path. Replaces spira/sentinel.sh."

[features]
integration = ["dwarf/integration", "hel/integration", "mail/integration", "reconciler-engine/integration", "runtime/integration", "spira-claim/integration", "spira-config/integration", "spira-store/integration", "spira-desired-state/integration", "spira-otel/integration", "strand/integration", "testkit/integration", "tsd/integration", "watchtower/integration"]

[dependencies]
dwarf = { path = "../dwarf" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
libc = "0.2"
spira-config = { path = "../spira-config" }
spira-store = { path = "../spira-store" }
spira-otel = { path = "../spira-otel" }
hel = { path = "../hel" }
spira-claim = { path = "../spira-claim" }
runtime = { path = "../runtime" }
tsd = { path = "../tsd" }
mail = { path = "../mail" }
strand = { path = "../strand" }
watchtower = { path = "../watchtower" }
spira-desired-state = { path = "../desired-state" }
reconciler-engine = { path = "../reconciler-engine" }

[[bin]]
name = "sentinel"
path = "src/main.rs"

[dev-dependencies]
testkit = { path = "../testkit" }
