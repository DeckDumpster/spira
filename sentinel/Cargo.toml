[package]
name = "sentinel"
version = "1.0.0"
edition = "2021"
description = "sentinel — the library the scheduler's sentinel tasks link: the work-graph model, the pass checks, the dwarf call plan and the ask to the Concierge."

[features]
integration = ["dwarf/integration", "hel/integration", "mail/integration", "reconciler-engine/integration", "runtime/integration", "spira-claim/integration", "spira-config/integration", "spira-store/integration", "spira-desired-state/integration", "strand/integration", "testkit/integration", "tsd/integration", "watchtower/integration", "system-paths/integration"]

[dependencies]
system-paths = { path = "../system-paths" }
dwarf = { path = "../dwarf" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
spira-config = { path = "../spira-config" }
spira-store = { path = "../spira-store" }
hel = { path = "../hel" }
spira-claim = { path = "../spira-claim" }
runtime = { path = "../runtime" }
tsd = { path = "../tsd" }
mail = { path = "../mail" }
strand = { path = "../strand" }
watchtower = { path = "../watchtower" }
spira-desired-state = { path = "../desired-state" }
reconciler-engine = { path = "../reconciler-engine" }

[dev-dependencies]
spira-test-id = { path = "../spira-test-id" }
testkit = { path = "../testkit" }
