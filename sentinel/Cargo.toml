[package]
name = "sentinel"
version = "1.0.0"
edition = "2021"
description = "sentinel — the loop's heartbeat: one reconcile pass over the work graph (CHECK 1-8), the 15s call fast path. Replaces spira/sentinel.sh."

[dependencies]
dwarf = { path = "../dwarf" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
libc = "0.2"
spira-config = { path = "../spira-config" }
spira-otel = { path = "../spira-otel" }
hel = { path = "../hel" }

[[bin]]
name = "sentinel"
path = "src/main.rs"

[dev-dependencies]
testkit = { path = "../testkit" }
