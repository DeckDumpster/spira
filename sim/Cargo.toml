[package]
name = "sim"
version = "0.1.0"
edition = "2021"
autotests = false
description = "spira-sim — deterministic simulation of the Spira loop: virtual-time event loop driven by one seed."

[lib]
name = "sim"
path = "src/lib.rs"

[[bin]]
name = "sim-fit"
path = "src/bin/sim-fit.rs"
test = false

[[bin]]
name = "sim-replay"
path = "src/bin/sim-replay.rs"
test = false

[[test]]
name = "goodput_fixture"
path = "tests/goodput_fixture.rs"
required-features = ["integration"]

[[test]]
name = "it"
path = "tests/it/main.rs"
required-features = ["integration"]

[features]
integration = ["lifecycle/integration", "reconciler-engine/integration", "runtime/integration", "spira-config/integration", "spira-desired-state/integration", "spira-lc/integration", "spira-otel/integration", "spira-runtime/integration", "state-store/integration", "testkit/integration"]

[dependencies]
spira-otel = { path = "../spira-otel" }
serde = { version = "1", features = ["derive"] }
toml = "0.8"
spira-config = { path = "../spira-config" }
runtime = { path = "../runtime" }
serde_json = "1"
spira-desired-state = { path = "../desired-state" }
spira-lc = { path = "../spira-lc" }
state-store = { path = "../state-store" }
reconciler-engine = { path = "../reconciler-engine" }

[dev-dependencies]
spira-runtime = { path = "../spira-runtime" }
lifecycle = { path = "../lifecycle" }
testkit = { path = "../testkit" }
