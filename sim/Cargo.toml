[package]
name = "sim"
version = "0.1.0"
edition = "2021"
description = "spira-sim — deterministic simulation of the Spira loop: virtual-time event loop driven by one seed."

[lib]
name = "sim"
path = "src/lib.rs"

[[bin]]
name = "sim-fit"
path = "src/bin/sim-fit.rs"
test = false

[[bin]]
name = "sim-replay"
path = "src/bin/sim-replay.rs"
test = false

[dependencies]
spira-otel = { path = "../spira-otel" }
serde = { version = "1", features = ["derive"] }
toml = "0.8"
spira-config = { path = "../spira-config" }
runtime = { path = "../runtime" }
serde_json = "1"
spira-desired-state = { path = "../desired-state" }
spira-lc = { path = "../spira-lc" }
state-store = { path = "../state-store" }

[dev-dependencies]
testkit = { path = "../testkit" }
