# Actors the world scenarios (`spira/sim`, `real_actors`) run as processes on their own timers.
#
# Every unit the loop used to run on a shipped timer (landing-pass, gate-worker, sentinel-call,
# sentinel-landing, sift, rounds, publish, reconciler-goodput) is a task of `spira-runtime serve`
# now, and its timer is gone from systemd/. Ruling D6 of the scheduler consolidation design: the
# simulator drives those tasks' real registrations with effect doubles (sim/tests/whole_loop.rs),
# never an actor process, so none has a row here. `actors::parse_specs` refuses an actor whose
# units would be shipped ones.

# The round controller, run only by world scenarios that select it through real_actors. It is
# no task of the service; its units live under sim/units, which nothing installs: it is never a
# production shadow run.
[[actor]]
name = "round-controller"
command = "round-controller pass"
timer = "spira-round-controller.timer"
duration = "land.phase.tools"
sim_only = true
