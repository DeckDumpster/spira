[package]
name = "lifecycle"
version = "1.0.0"
edition = "2021"
autotests = false
description = "lifecycle — the three pure bead/delivery/batch transition machines and the event log fold. No I/O, no clock, no git."

[[test]]
name = "delivery_properties"
path = "tests/delivery_properties.rs"
required-features = ["integration"]

[[test]]
name = "schema_views"
path = "tests/schema_views.rs"
required-features = ["integration"]

[features]
integration = []

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
proptest = { version = "=1.5.0", default-features = false, features = ["std"] }

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
