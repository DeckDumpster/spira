[package]
name = "incident"
version = "1.0.0"
edition = "2021"
autotests = false
description = "incident — turn a production event into a bead Ops can claim, deduplicated on external_ref, through one control-store row per unfiled reference. Rust port of spira/incident.sh (sp-0ekp7); contract, scar and scope: DESIGN.md."

[[test]]
name = "no_fork_edges"
path = "tests/no_fork_edges.rs"
required-features = ["integration"]

[[test]]
name = "inbox_page"
path = "tests/inbox_page.rs"
required-features = ["integration"]

[features]
integration = ["inbox-rules/integration", "bead/integration", "mail/integration", "reconciler-engine/integration", "runtime/integration", "spira-config/integration", "spira-store/integration", "spira-desired-state/integration", "spira-world/integration", "testkit/integration", "tsd/integration", "system-paths/integration", "spira-test-id/integration"]
[dependencies]
inbox-rules = { path = "../inbox-rules" }
system-paths = { path = "../system-paths" }
bead = { path = "../bead" }
spira-config = { path = "../spira-config" }
spira-store = { path = "../spira-store" }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
regex = "1"
sha2 = "0.10"
toml = "0.8"
tsd = { path = "../tsd" }
mail = { path = "../mail" }
runtime = { path = "../runtime" }
reconciler-engine = { path = "../reconciler-engine" }
spira-desired-state = { path = "../desired-state" }
spira-world = { path = "../spira-world" }
ureq = { version = "2", default-features = false, features = ["tls"] }

[[bin]]
name = "incident"
path = "src/main.rs"

[[bin]]
name = "incident-stub-bd"
path = "src/bin/incident-stub-bd.rs"

[dev-dependencies]
spira-test-id = { path = "../spira-test-id" }
testkit = { path = "../testkit" }
