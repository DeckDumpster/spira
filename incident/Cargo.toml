[package]
name = "incident"
version = "1.0.0"
edition = "2021"
description = "incident — turn a production event into a bead Ops can claim, deduplicated on external_ref, with a write-ahead spool so an event that arrives while the store is down is never lost. Rust port of spira/incident.sh (sp-0ekp7); contract, scar and scope: DESIGN.md."

[features]
integration = []

[dependencies]
bead = { path = "../bead" }
spira-config = { path = "../spira-config" }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
regex = "1"
sha2 = "0.10"
toml = "0.8"
tsd = { path = "../tsd" }
mail = { path = "../mail" }
runtime = { path = "../runtime" }
reconciler-engine = { path = "../reconciler-engine" }
spira-desired-state = { path = "../desired-state" }
spira-world = { path = "../spira-world" }
ureq = { version = "2", default-features = false, features = ["tls"] }

[[bin]]
name = "incident"
path = "src/main.rs"

[[bin]]
name = "incident-stub-bd"
path = "src/bin/incident-stub-bd.rs"

[dev-dependencies]
testkit = { path = "../testkit" }

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
