[package]
name = "acceptance-daily"
version = "0.1.0"
edition = "2021"
description = "acceptance-daily — runs the fresh-install acceptance against the landing ref once a day, records the verdict, and files or amends one builder bead per distinct failure."

[lib]
name = "acceptance_daily"
path = "src/lib.rs"

[[bin]]
name = "acceptance-daily"
path = "src/main.rs"
test = false

[dependencies]
libc = "0.2"
serde_json = "1"
spira-config = { path = "../spira-config" }
spira-otel = { path = "../spira-otel" }

[dev-dependencies]
testkit = { path = "../testkit" }

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
