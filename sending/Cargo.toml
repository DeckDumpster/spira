[package]
name = "sending"
version = "1.0.0"
edition = "2021"
description = "sending — the Sending: delete the branch and worktree of every bead whose work has landed, and nothing else. Replaces spira/sending.sh (sp-arpjt)."

[dependencies]
serde_json = "1"
spira-config = { path = "../spira-config" }
spira-otel = { path = "../spira-otel" }

[lib]
name = "sending"
path = "src/lib.rs"

[[bin]]
name = "sending"
path = "src/main.rs"
test = false

[dev-dependencies]
testkit = { path = "../testkit" }

