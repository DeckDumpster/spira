[package]
name = "inbox-rules"
version = "1.0.0"
edition = "2021"
publish = false
autotests = false
description = "inbox-rules — the one drop/dedup rule set for the Concierge inbox, shared by the inbox-triage Monitor and `watchd next` so the two cannot diverge, and the one append-and-push leg (record) every inbox writer calls."

[[test]]
name = "publish"
path = "tests/publish.rs"
required-features = ["integration"]

[[test]]
name = "sink"
path = "tests/sink.rs"
required-features = ["integration"]

[features]
integration = ["ports/integration", "spira-config/integration", "spira-pub/integration", "testkit/integration", "spira-test-id/integration"]
[dependencies]
regex = "1"
serde_json = "1"
spira-pub = { path = "../spira-pub" }
ports = { path = "../ports" }
spira-config = { path = "../spira-config" }

[dev-dependencies]
libc = "0.2"
spira-test-id = { path = "../spira-test-id" }
testkit = { path = "../testkit" }
