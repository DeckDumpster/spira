[package]
name = "idea-prompt"
version = "0.1.0"
edition = "2021"
autotests = false
description = "idea-prompt — when Spira has been idle for a sustained stretch inside the operator's waking hours, mails the operator the parked idea beads and asks which to start."

[lib]
name = "idea_prompt"
path = "src/lib.rs"

[[bin]]
name = "idea-prompt"
path = "src/main.rs"
test = false

[[test]]
name = "no_fork_edges"
path = "tests/no_fork_edges.rs"
required-features = ["integration"]

[features]
integration = ["mail/integration", "spira-config/integration", "spira-store/integration", "spira-otel/integration", "testkit/integration"]

[dependencies]
mail = { path = "../mail" }
serde_json = "1"
spira-config = { path = "../spira-config" }
spira-store = { path = "../spira-store" }
spira-otel = { path = "../spira-otel" }

[dev-dependencies]
testkit = { path = "../testkit" }

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
