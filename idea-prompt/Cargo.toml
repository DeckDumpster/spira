[package]
name = "idea-prompt"
version = "0.1.0"
edition = "2021"
description = "idea-prompt — when Spira has been idle for a sustained stretch inside the operator's waking hours, mails the operator the parked idea beads and asks which to start."

[lib]
name = "idea_prompt"
path = "src/lib.rs"

[[bin]]
name = "idea-prompt"
path = "src/main.rs"
test = false

[dependencies]
serde_json = "1"
spira-config = { path = "../spira-config" }
spira-otel = { path = "../spira-otel" }

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
