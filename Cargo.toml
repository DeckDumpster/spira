resolver = "2"

[profile.release]
# Chosen by measurement (sp-zqo8s, 2026-09-30): see spira-config/DESIGN-build-cache.md
# section 5 for the full table. Fat LTO + codegen-units=1 (the prior setting) runs a
# whole-program link-time-optimization pass on every release-bins build that sccache
# cannot cache, regardless of how warm the rest of the tree is: measured 191-199s on a
# fresh gate tree and still 146-165s on a tree that already built this release profile
# once. lto=false lets the link step become a plain linker pass over already-cached
# object code: measured 113s fresh, 25-28s on a re-certified tip -- faster on both axes,
# not just the warm one.
opt-level = 2
lto = false
codegen-units = 16
strip = true

# The round's unit-test build: workspace members unoptimised, dependencies as release builds
# them, so their compiled artefacts are shared with the release build.
[profile.unittest]
inherits = "release"
opt-level = 0
codegen-units = 16
strip = false
[profile.unittest.package."*"]
opt-level = 2

# aeon and gate runs (sp-zv7j4): fast, incremental builds of a worktree that is thrown
# away after its suites run — none of release's link-time cost buys anything here.
[profile.aeon]
inherits = "dev"
opt-level = 0
incremental = true
debug = "line-tables-only"

# lifecycle-guard runs as a gate fence over the whole tree (gate.steps, sp-ts2qr), built in
# this profile by the gate's tools phase. At opt-level 0 the tree-sitter bash parse of the
# harness's ~116k lines of shell took ~22 s every gate; optimising the guard and its parser
# alone costs a few seconds of compile once per cached tree.
[profile.aeon.package.lifecycle-guard]
opt-level = 2
[profile.aeon.package.tree-sitter]
opt-level = 2
[profile.aeon.package.tree-sitter-bash]
opt-level = 2

# spira-lint is the other whole-tree fence of every gate (gate.steps), built the same way. At
# opt-level 0 its 33 regex-heavy rules took ~36 s of every gate's fences phase on a loaded
# host (measured 2026-10-06); optimised, with the regex engine it spends its time in, ~8 s
# serial (spira-lint also checks its rules concurrently now).
[profile.aeon.package.spira-lint]
opt-level = 2
[profile.aeon.package.regex]
opt-level = 2
[profile.aeon.package.regex-automata]
opt-level = 2
[profile.aeon.package.regex-syntax]
opt-level = 2
[profile.aeon.package.aho-corasick]
opt-level = 2
[profile.aeon.package.memchr]
opt-level = 2

# Every dependency optimised, as the unittest profile does: they are compiled once and cached,
# while at opt-level 0 each process of a sim world paid for toml/serde parsing its config and the
# gate for sha2 over its own binaries (~10 MB/s).
[profile.aeon.package."*"]
opt-level = 2

# Every Rust binary resolves its config at start (13 ms here at opt-level 0, 3 ms optimised), and
# a sim world starts a few hundred of them; the sim is the stand-in for the forge and the probes
# those worlds call on every step.
[profile.aeon.package.spira-config]
opt-level = 2
[profile.aeon.package.spira-sim]
opt-level = 2
[profile.aeon.package.sim]
opt-level = 2
