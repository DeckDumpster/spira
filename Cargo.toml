[workspace]
members = [
    "loom",
    "cockpit/panel",
    "broker",
    "czar-pass",
    "supervise",
    "spira-config",
    "queue-watch",
    "tsd",
    "desired-state",
    "batcher",
    "batcher-cut",
    "tsd",
    "reconciler-engine",
    "reconciler",
    "test-plan",
    "reconciler-alert",
    "landing-pass",
    "reconciler-flow",
    "lifecycle-guard",
    "lifecycle",
    "spira-lc",
    "tsd-lifecycle-export",
    "work",
    "spira-lint",
    "rebase-stale",
    "round-vm",
    "spira-claim",
    "strand",
    "testenv",
    "sentinel",
    "queue",
    "aeon",
    "gate",
    "intent-report",
]
resolver = "2"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true

# aeon and gate runs (sp-zv7j4): fast, incremental builds of a worktree that is thrown
# away after its suites run — none of release's link-time cost buys anything here.
[profile.aeon]
inherits = "dev"
opt-level = 0
incremental = true
debug = "line-tables-only"
