[package]
name = "refusal-watch"
version = "0.1.0"
edition = "2021"
autotests = false
description = "refusal-watch — groups the lifecycle machine's refused bead events by caller and refusal, and files one bead per class whose count passes its baseline, once per class per repeat window."

[lib]
name = "refusal_watch"
path = "src/lib.rs"

[[bin]]
name = "refusal-watch"
path = "src/main.rs"
test = false

[[test]]
name = "no_fork_edges"
path = "tests/no_fork_edges.rs"
required-features = ["integration"]

[features]
integration = []

[dependencies]
serde_json = "1"
spira-config = { path = "../spira-config" }
incident = { path = "../incident" }

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
