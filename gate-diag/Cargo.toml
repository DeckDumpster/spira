[package]
name = "gate-diag"
version = "0.1.0"
edition = "2021"
description = "gate-diag — diagnostic output and machine-readable results for a finished batch run (sp-ubw2o, replaces spira/gate-diag.sh)."

[[bin]]
name = "gate-diag"
path = "src/main.rs"

[dependencies]
serde_json = "1"
testenv = { path = "../testenv" }

[dev-dependencies]
testkit = { path = "../testkit" }

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
