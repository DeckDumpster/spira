[package]
name = "gate-diag"
version = "0.1.0"
edition = "2021"
description = "gate-diag — diagnostic output and machine-readable results for a finished batch run (sp-ubw2o, replaces spira/gate-diag.sh)."

[[bin]]
name = "gate-diag"
path = "src/main.rs"

[features]
integration = ["spira-config/integration", "spira-otel/integration", "testenv/integration", "testkit/integration", "tsd/integration", "spira-test-id/integration"]
[dependencies]
spira-otel = { path = "../spira-otel" }
spira-config = { path = "../spira-config" }
serde_json = "1"
testenv = { path = "../testenv" }
tsd = { path = "../tsd" }

[dev-dependencies]
spira-test-id = { path = "../spira-test-id" }
testkit = { path = "../testkit" }
