[package]
name = "spira-runtime"
version = "1.0.0"
edition = "2021"
autotests = false
description = "spira-runtime — the long-running service that hosts the loop's workflows: pinned config, wide events as OTLP logs, a heartbeat schedule, a loop-kicked systemd watchdog and stall quarantine."

[package.metadata.spira]
test-bins = ["spira-config", "spira-lc", "reconciler", "tsd", "work"]

[lib]
name = "spira_runtime"
path = "src/lib.rs"

[[bin]]
name = "spira-runtime"
path = "src/main.rs"
test = false

[[test]]
name = "it"
path = "tests/it/main.rs"
required-features = ["integration"]

[[test]]
name = "sources_on_the_loop"
path = "tests/sources_on_the_loop.rs"
required-features = ["integration"]

[[test]]
name = "task_f_incident_file_runners"
path = "tests/task_f_incident_file_runners.rs"
