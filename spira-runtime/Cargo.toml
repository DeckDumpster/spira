[package]
name = "spira-runtime"
version = "1.0.0"
edition = "2021"
autotests = false
description = "spira-runtime — the long-running service that hosts the loop's workflows: pinned config, wide events as OTLP logs, a heartbeat schedule, a loop-kicked systemd watchdog and stall quarantine."

[package.metadata.spira]
test-bins = ["spira-config", "spira-lc", "reconciler", "reconciler-flow", "tsd"]

[lib]
name = "spira_runtime"
path = "src/lib.rs"

[[bin]]
name = "spira-runtime"
path = "src/main.rs"
test = false

[[test]]
name = "it"
path = "tests/it/main.rs"
required-features = ["integration"]

[[test]]
name = "task_e_watch_dwarf_usage"
path = "tests/task_e_watch_dwarf_usage.rs"
required-features = ["integration"]

[[test]]
name = "task_e_watch_transitions"
path = "tests/task_e_watch_transitions.rs"
required-features = ["integration"]

[[test]]
name = "world_flow_export"
path = "tests/world_flow_export.rs"
required-features = ["integration"]

[[test]]
name = "world_readiness_dependents"
path = "tests/world_readiness_dependents.rs"
required-features = ["integration"]

[[test]]
name = "world_readiness_dependents_off"
path = "tests/world_readiness_dependents_off.rs"
required-features = ["integration"]

[[test]]
name = "world_round_records"
path = "tests/world_round_records.rs"
required-features = ["integration"]

[[test]]
name = "world_round_snapshot"
path = "tests/world_round_snapshot.rs"
required-features = ["integration"]

[features]
integration = ["dep:testkit", "archivist/integration", "batcher/integration", "batcher-cut/integration", "bead/integration", "cert-sweep/integration", "cockpit-collect/integration", "cockpit-ops/integration", "czar-pass/integration", "dwarf/integration", "filings-collect/integration", "forge/integration", "gate-check/integration", "gate-worker/integration", "gh-intake/integration", "groomer/integration", "heimdall/integration", "hel/integration", "idea-prompt/integration", "inbox-rules/integration", "incident/integration", "install/integration", "kit-bump/integration", "landing-pass/integration", "mail/integration", "mimir-trigger/integration", "perf-watch/integration", "queue/integration", "reclaim/integration", "reconciler/integration", "reconciler-engine/integration", "reconciler-flow/integration", "refusal-watch/integration", "release/integration", "round-controller/integration", "round-vm/integration", "rule/integration", "runtime/integration", "runtime-watch/integration", "sentinel/integration", "sift/integration", "sim/integration", "skew/integration", "sop/integration", "spira-claim/integration", "spira-config/integration", "spira-otel/integration", "spira-submission/integration", "spira-world/integration", "store-view/integration", "testenv/integration", "testkit/integration", "tsd/integration", "unit-run/integration", "watchd/integration", "watchtower/integration"]

[dependencies]
testkit = { path = "../testkit", optional = true }
inbox-rules = { path = "../inbox-rules" }
base64 = "0.22"
install = { path = "../install" }
libc = "0.2"
mail = { path = "../mail" }
cockpit-ops = { path = "../cockpit/ops" }
# Family A's landing tasks (batcher.local/forge, queue.step, publish): their libraries.
batcher = { path = "../batcher" }
batcher-cut = { path = "../batcher-cut" }
queue = { path = "../queue" }
reconciler = { path = "../reconciler" }
reconciler-engine = { path = "../reconciler-engine" }
reconciler-flow = { path = "../reconciler-flow" }
# Family B reconcilers: heimdall's in-scheduler checks as a library.
heimdall = { path = "../heimdall" }
# Family A's loop core (sentinel, czar, sift): the crates its tasks call as libraries.
sentinel = { path = "../sentinel" }
spira-claim = { path = "../spira-claim" }
czar-pass = { path = "../czar-pass" }
round-controller = { path = "../round-controller" }
sift = { path = "../sift" }
runtime = { path = "../runtime" }
unit-run = { path = "../unit-run" }
spira-config = { path = "../spira-config" }
store-view = { path = "../store-view" }
skew = { path = "../skew" }
perf-watch = { path = "../perf-watch" }
spira-otel = { path = "../spira-otel" }
ring = "0.17"
tsd = { path = "../tsd" }
# Family C sweeps (hel, reclaim, round-vm): the crates their tasks call as libraries.
hel = { path = "../hel" }
reclaim = { path = "../reclaim" }
round-vm = { path = "../round-vm" }
testenv = { path = "../testenv" }
watchd = { path = "../watchd" }
# Family A's gate, landing, reap and provision tasks: their libraries.
gate-check = { path = "../gate-check" }
bead = { path = "../bead" }
gate-worker = { path = "../gate-worker" }
landing-pass = { path = "../landing-pass" }
# The landing task's pull-request verbs, in-process (its one child is gh).
forge = { path = "../forge" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt", "sync", "time", "macros"] }
ureq = { version = "2", default-features = false, features = ["tls"] }
spira-submission = { path = "../spira-submission" }
gh-intake = { path = "../gh-intake" }
dwarf = { path = "../dwarf" }
archivist = { path = "../archivist" }
incident = { path = "../incident" }
watchtower = { path = "../watchtower" }
runtime-watch = { path = "../runtime-watch" }
refusal-watch = { path = "../refusal-watch" }
# Family D watchers (sop-lint, statute-audit, the cert sweeps): their libraries.
sop = { path = "../sop" }
rule = { path = "../rule" }
cert-sweep = { path = "../cert-sweep" }
release = { path = "../release" }
cockpit-collect = { path = "../cockpit-collect" }
groomer = { path = "../groomer" }
idea-prompt = { path = "../idea-prompt" }
filings-collect = { path = "../filings-collect" }
kit-bump = { path = "../kit-bump" }
mimir-trigger = { path = "../mimir-trigger" }

[target.'cfg(target_os = "linux")'.dependencies]
inotify = { version = "0.11", default-features = false }

[dev-dependencies]
spira-config = { path = "../spira-config", features = ["fake-content"] }
forge = { path = "../forge" }
# dwarves.sh's live count, held to sentinel-call's on the same unit list.
spira-world = { path = "../spira-world" }
sim = { path = "../sim" }
testkit = { path = "../testkit" }
release = { path = "../release" }

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
