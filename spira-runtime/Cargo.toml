[package]
name = "spira-runtime"
version = "1.0.0"
edition = "2021"
description = "spira-runtime — the long-running service that hosts the loop's workflows: pinned config, wide events as OTLP logs, a heartbeat schedule, a loop-kicked systemd watchdog and stall quarantine."

[package.metadata.spira]
test-bins = ["spira-config", "spira-lc"]

[lib]
name = "spira_runtime"
path = "src/lib.rs"

[[bin]]
name = "spira-runtime"
path = "src/main.rs"
test = false

[dependencies]
mail = { path = "../mail" }
runtime = { path = "../runtime" }
spira-config = { path = "../spira-config" }
spira-otel = { path = "../spira-otel" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt", "sync", "time", "macros"] }
ureq = { version = "2", default-features = false, features = ["tls"] }

[dev-dependencies]
libc = "0.2"
testkit = { path = "../testkit" }
release = { path = "../release" }

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
