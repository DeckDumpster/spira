[features]
integration = ["watchdog/integration", "dep:testkit", "ctx-meter/integration", "archivist/integration", "batcher/integration", "batcher-cut/integration", "bead/integration", "cockpit-collect/integration", "cockpit-ops/integration", "cr/integration", "czar-pass/integration", "dwarf/integration", "filings-collect/integration", "forge/integration", "gate-check/integration", "gate-worker/integration", "gh-intake/integration", "groomer/integration", "heimdall/integration", "hel/integration", "inbox-rules/integration", "incident/integration", "install/integration", "kit-bump/integration", "landing-pass/integration", "mail/integration", "mimir-trigger/integration", "perf-watch/integration", "queue/integration", "reclaim/integration", "reconciler/integration", "reconciler-engine/integration", "reconciler-flow/integration", "refusal-watch/integration", "release/integration", "round-vm/integration", "runtime/integration", "runtime-watch/integration", "sentinel/integration", "sift/integration", "sim/integration", "skew/integration", "sop/integration", "spira-claim/integration", "spira-config/integration", "spira-store/integration", "state-store-sqlite/integration", "state-store/integration", "spira-otel/integration", "spira-submission/integration", "spira-world/integration", "store-view/integration", "testenv/integration", "testkit/integration", "system-paths/integration", "tsd/integration", "tsd-lifecycle-export/integration", "unit-run/integration", "watchd/integration", "watchtower/integration", "spira-test-id/integration", "lifecycle/integration", "margin-client/integration", "design-review/integration", "spira-pub/integration", "spira-lc/integration"]
[dependencies]
testkit = { path = "../testkit", optional = true }
system-paths = { path = "../system-paths" }
inbox-rules = { path = "../inbox-rules" }
spira-pub = { path = "../spira-pub" }
base64 = "0.22"
sha2 = { version = "0.10", features = ["compress"] }
install = { path = "../install" }
libc = "0.2"
mail = { path = "../mail" }
cockpit-ops = { path = "../cockpit/ops" }
# Family A's landing tasks (batcher.local/forge, queue.step, publish): their libraries.
batcher = { path = "../batcher" }
batcher-cut = { path = "../batcher-cut" }
queue = { path = "../queue" }
reconciler = { path = "../reconciler" }
reconciler-engine = { path = "../reconciler-engine" }
reconciler-flow = { path = "../reconciler-flow" }
# Family B reconcilers: heimdall's in-scheduler checks as a library.
heimdall = { path = "../heimdall" }
# Family A's loop core (sentinel, czar, sift): the crates its tasks call as libraries.
sentinel = { path = "../sentinel" }
spira-claim = { path = "../spira-claim" }
czar-pass = { path = "../czar-pass" }
sift = { path = "../sift" }
runtime = { path = "../runtime" }
unit-run = { path = "../unit-run" }
spira-config = { path = "../spira-config" }
spira-store = { path = "../spira-store" }
store-view = { path = "../store-view" }
skew = { path = "../skew" }
perf-watch = { path = "../perf-watch" }
spira-otel = { path = "../spira-otel" }
ring = "0.17"
tsd = { path = "../tsd" }
tsd-lifecycle-export = { path = "../tsd-lifecycle-export" }
# Family C sweeps (hel, reclaim, round-vm): the crates their tasks call as libraries.
hel = { path = "../hel" }
reclaim = { path = "../reclaim" }
round-vm = { path = "../round-vm" }
testenv = { path = "../testenv" }
watchd = { path = "../watchd" }
# Family A's gate, landing, reap and provision tasks: their libraries.
gate-check = { path = "../gate-check" }
bead = { path = "../bead" }
gate-worker = { path = "../gate-worker" }
landing-pass = { path = "../landing-pass" }
# The landing task's pull-request verbs, in-process (its one child is gh).
forge = { path = "../forge" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
tokio = { version = "1", features = ["rt", "sync", "time", "macros", "net", "io-util"] }
ureq = { version = "2", default-features = false, features = ["tls"] }
bytes = "1"
http-body-util = "0.1"
hyper = { version = "1", default-features = false, features = ["client", "http1"] }
hyper-util = { version = "0.1", default-features = false, features = ["tokio"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
webpki-roots = "0.26"
spira-submission = { path = "../spira-submission" }
gh-intake = { path = "../gh-intake" }
cr = { path = "../cr" }
margin-client = { path = "../margin-client" }
design-review = { path = "../design-review" }
dwarf = { path = "../dwarf" }
archivist = { path = "../archivist" }
incident = { path = "../incident" }
watchtower = { path = "../watchtower" }
runtime-watch = { path = "../runtime-watch" }
refusal-watch = { path = "../refusal-watch" }
# Family D watchers (sop-lint): their libraries.
sop = { path = "../sop" }
release = { path = "../release" }
lifecycle = { path = "../lifecycle" }
cockpit-collect = { path = "../cockpit-collect" }
ctx-meter = { path = "../ctx-meter" }
groomer = { path = "../groomer" }
filings-collect = { path = "../filings-collect" }
kit-bump = { path = "../kit-bump" }
mimir-trigger = { path = "../mimir-trigger" }

spira-world = { path = "../spira-world" }
state-store-sqlite = { path = "../state-store-sqlite" }

[target.'cfg(target_os = "linux")'.dependencies]
inotify = { version = "0.11", default-features = false }

[dev-dependencies]
rustls-pemfile = "2"
spira-test-id = { path = "../spira-test-id" }
forge = { path = "../forge" }
sim = { path = "../sim" }
testkit = { path = "../testkit" }
release = { path = "../release" }
watchdog = { path = "../watchdog" }
lifecycle = { path = "../lifecycle" }
state-store = { path = "../state-store" }
spira-lc = { path = "../spira-lc" }

[[test]]
name = "batcher_image_build"
path = "tests/batcher_image_build.rs"
required-features = ["integration"]

[[test]]
name = "sift_reads"
path = "tests/sift_reads.rs"
required-features = ["integration"]

[[test]]
name = "watch_topics"
path = "tests/watch_topics.rs"
required-features = ["integration"]
