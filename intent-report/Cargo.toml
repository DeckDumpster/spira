[package]
name = "intent-report"
version = "0.1.0"
edition = "2021"
description = "intent-report — prints the gate-unit-round-integration epic's Intent measures for a window from run/tsd rows (sp-cln99)."

[lib]
name = "intent_report"
path = "src/lib.rs"

[[bin]]
name = "intent-report"
path = "src/main.rs"
test = false

[features]
integration = ["spira-config/integration", "spira-otel/integration", "tsd/integration", "spira-test-id/integration"]
[dependencies]
serde_json = "1"
tsd = { path = "../tsd" }
spira-config = { path = "../spira-config" }
spira-otel = { path = "../spira-otel" }

[dev-dependencies]
spira-test-id = { path = "../spira-test-id" }
