[package]
name = "intent-report"
version = "0.1.0"
edition = "2021"
description = "intent-report — prints the gate-unit-round-integration epic's Intent measures for a window from run/tsd rows (sp-cln99)."

[lib]
name = "intent_report"
path = "src/lib.rs"

[[bin]]
name = "intent-report"
path = "src/main.rs"

[dependencies]
serde_json = "1"
tsd = { path = "../tsd" }

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
