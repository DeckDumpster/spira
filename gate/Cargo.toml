[package]
name = "gate"
version = "0.1.0"
edition = "2021"
autotests = false
description = "gate — the certification gate: judges a branch merged onto its landing ref (sp-0tpcs, replaces the logic of spira/gate.sh and spira/gate-lib.sh)."

[[bin]]
name = "gate"
path = "src/main.rs"
test = false

[features]
integration = ["incident/integration", "spira-config/integration", "spira-desired-state/integration", "spira-otel/integration", "suite-select/integration", "system-paths/integration", "testkit/integration", "tsd/integration", "spira-test-id/integration"]
[dependencies]
libc = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
toml = "0.8"
spira-config = { path = "../spira-config" }
spira-otel = { path = "../spira-otel" }
tsd = { path = "../tsd" }
spira-desired-state = { path = "../desired-state" }
suite-select = { path = "../suite-select" }
incident = { path = "../incident" }
system-paths = { path = "../system-paths" }

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true

[dev-dependencies]
spira-test-id = { path = "../spira-test-id" }
testkit = { path = "../testkit" }

[[test]]
name = "warm_build"
path = "tests/warm_build.rs"
required-features = ["integration"]

[[test]]
name = "spira_scripts"
path = "tests/spira_scripts.rs"
required-features = ["integration"]
