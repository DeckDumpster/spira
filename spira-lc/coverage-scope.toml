# The section, intent and lock verbs on the control store: the bead's own gate reports any
# branch in them no test takes.
[[scope]]
path = "spira-lc/src/sections.rs"
functions = [
    "run",
    "apply_spec_doc",
    "publish",
    "put",
    "owned_intent",
    "intent_ack",
    "intent_judge",
    "intent_apply",
    "knob_key",
    "section_get",
    "section_list",
    "section_snapshot",
    "sections_of",
    "lock_acquire",
    "lock_renew",
    "lock_release",
    "lock_error",
    "resource",
    "ttl_ms",
    "parse_token",
    "holds_lock",
    "intent_get",
    "pass_record",
    "lock_holder",
    "pass_standby",
]

# Goodput and the lifecycle section's publisher.
[[scope]]
path = "spira-lc/src/goodput.rs"
functions = ["halts", "Window::new", "Window::contains", "Window::overlap", "goodput", "dwell_p95"]

[[scope]]
path = "spira-lc/src/control/sections/lifecycle.rs"
functions = [
    "run",
    "windowed",
    "certified_stays",
    "repos_in",
    "below_floor",
    "distance",
    "push_metrics",
    "publish_lifecycle",
    "round_events",
]

# The skew guard: the planes' planning watermarks judged, served and asked.
[[scope]]
path = "spira-lc/src/skew.rs"
functions = ["judge", "served", "guard", "both", "parse_control", "parse_bd_kv"]

# The cutover's import: its archive, its mapping onto the control plane's keys and its checks.
[[scope]]
path = "spira-lc/src/import/archive.rs"
functions = ["row_key", "row_sha", "table_sum", "parse"]

[[scope]]
path = "spira-lc/src/import/map.rs"
functions = ["import_rev", "audit_of", "record_of", "readiness_of", "mend_of", "runtime_key", "project", "record_baseline"]

[[scope]]
path = "spira-lc/src/import/checks.rs"
functions = ["loaded", "kind_of", "fields", "differences", "fold_bead", "delivery_seed", "delivery_exit", "fold_delivery", "fold_batch", "logs", "replay", "cursors"]

[[scope]]
path = "spira-lc/src/import/mod.rs"
functions = ["import", "import_store", "report_path", "write_report"]

# The parity tool's comparison.
[[scope]]
path = "spira-lc/src/parity.rs"
functions = ["normalize", "strip", "first_difference", "judge", "ids_in", "walk", "calls", "enumerate", "run"]
