[package]
name = "spira-lc"
version = "1.0.0"
edition = "2021"
autotests = false
description = "spira-lc — the lifecycle CLI and system service: show/list/history/event against spira_lifecycle, over a local socket when the system-user service is installed, or a direct connection in same-user fallback. Deploys inert."

[[test]]
name = "e2e_goodput_20d"
path = "tests/e2e_goodput_20d.rs"
required-features = ["integration"]

[features]
integration = ["bead/integration", "incident/integration", "lifecycle/integration", "reconciler-engine/integration", "runtime/integration", "round-vm/integration", "sentinel/integration", "spira-config/integration", "spira-store/integration", "spira-desired-state/integration", "spira-otel/integration", "state-store/integration", "state-store-sqlite/integration", "testkit/integration", "tsd/integration"]

[dependencies]
bead = { path = "../bead" }
lifecycle = { path = "../lifecycle" }
spira-config = { path = "../spira-config" }
spira-store = { path = "../spira-store" }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
spira-otel = { path = "../spira-otel" }
spira-desired-state = { path = "../desired-state" }
serde_path_to_error = "0.1"
sha2 = "0.10"
state-store = { path = "../state-store" }
state-store-sqlite = { path = "../state-store-sqlite" }
runtime = { path = "../runtime" }
tsd = { path = "../tsd" }

[[bin]]
name = "spira-lc"
path = "src/main.rs"

[package.metadata.spira]
# plan_conformance files through the real bead and bdq.
test-bins = ["bead", "spira-config"]

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true

[dev-dependencies]
opentelemetry-proto = { version = "0.30", default-features = false, features = ["trace", "gen-tonic-messages", "with-serde"] }
testkit = { path = "../testkit" }
reconciler-engine = { path = "../reconciler-engine" }
incident = { path = "../incident" }
sentinel = { path = "../sentinel" }
round-vm = { path = "../round-vm" }
