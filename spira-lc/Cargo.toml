[package]
name = "spira-lc"
version = "1.0.0"
edition = "2021"
autotests = false
description = "spira-lc — the lifecycle CLI and system service: show/list/history/event over the control store, over a local socket when the system-user service is installed, or in-process in same-user fallback. Deploys inert."

[[test]]
name = "compact_after_stop"
path = "tests/compact_after_stop.rs"
required-features = ["integration"]

[[test]]
name = "content_writes"
path = "tests/content_writes.rs"
required-features = ["integration"]

[[test]]
name = "e2e_goodput_20d"
path = "tests/e2e_goodput_20d.rs"
required-features = ["integration"]

[[test]]
name = "lc_backup_drill"
path = "tests/lc_backup_drill.rs"
required-features = ["integration"]

[[test]]
name = "serve_loop"
path = "tests/serve_loop.rs"
required-features = ["integration"]

[[test]]
name = "serve_memory"
path = "tests/serve_memory.rs"
required-features = ["integration"]

[[test]]
name = "writer_retry"
path = "tests/writer_retry.rs"
required-features = ["integration"]

[[test]]
name = "verbs_on_store"
path = "tests/verbs_on_store.rs"
required-features = ["integration"]

[features]
integration = ["system-paths/integration", "bead/integration", "watchtower/integration", "incident/integration", "lifecycle/integration", "gate/integration", "forge/integration", "groomer/integration", "reconciler-engine/integration", "runtime/integration", "round-vm/integration", "sentinel/integration", "spira-config/integration", "spira-store/integration", "spira-desired-state/integration", "spira-otel/integration", "state-store/integration", "state-store-sqlite/integration", "testkit/integration", "tsd/integration", "spira-test-id/integration", "ports/integration"]

[dependencies]
system-paths = { path = "../system-paths" }
bead = { path = "../bead" }
lifecycle = { path = "../lifecycle" }
spira-config = { path = "../spira-config" }
forge = { path = "../forge" }
spira-store = { path = "../spira-store" }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
spira-otel = { path = "../spira-otel" }
spira-desired-state = { path = "../desired-state" }
serde_path_to_error = "0.1"
sha2 = "0.10"
libc = "0.2"
state-store = { path = "../state-store" }
state-store-sqlite = { path = "../state-store-sqlite" }
runtime = { path = "../runtime" }
ports = { path = "../ports" }
tsd = { path = "../tsd" }
tokio = { version = "1", features = ["rt", "net", "time", "sync"] }

[[bin]]
name = "spira-lc"
path = "src/main.rs"

[package.metadata.spira]
# plan_conformance files through the real bead and bdq.
test-bins = ["bead", "spira-config", "spira-lc", "testenv"]

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true

[dev-dependencies]
spira-test-id = { path = "../spira-test-id" }
inotify = { version = "0.11", default-features = false }
opentelemetry-proto = { version = "0.30", default-features = false, features = ["trace", "gen-tonic-messages", "with-serde"] }
testkit = { path = "../testkit" }
rusqlite = { version = "0.37", features = ["bundled"] }
reconciler-engine = { path = "../reconciler-engine" }
incident = { path = "../incident" }
sentinel = { path = "../sentinel" }
watchtower = { path = "../watchtower" }
round-vm = { path = "../round-vm" }
gate = { path = "../gate" }
groomer = { path = "../groomer" }
