[package]
name = "store-view"
version = "0.1.0"
edition = "2021"
autotests = false
description = "store-view — the store's hot reads held in memory: rounds, open and ended forge batches and ready counts, kept current by the store's watch, refusing once stale. A leaf crate any binary can depend on."

[lib]
name = "store_view"
path = "src/lib.rs"

[[test]]
name = "store"
path = "tests/store.rs"
required-features = ["integration"]

[features]
integration = ["spira-config/integration"]

[dependencies]
spira-config = { path = "../spira-config" }
spira-store = { path = "../spira-store" }
serde_json = "1"
