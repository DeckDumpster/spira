[package]
name = "store-view"
version = "0.1.0"
edition = "2021"
description = "store-view — the store's hot reads held in memory: rounds, open and ended forge batches and ready counts, kept current by the store's watch, refusing once stale. A leaf crate any binary can depend on."

[lib]
name = "store_view"
path = "src/lib.rs"

[features]
integration = []

[dependencies]
spira-config = { path = "../spira-config" }
serde_json = "1"
