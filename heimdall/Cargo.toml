[package]
name = "heimdall"
version = "1.0.0"
edition = "2021"
autotests = false
description = "heimdall — the watchdog over the loop. Its only power is speech: it reads timestamps and counters, asks the database one question, and raises or clears an alert bead. Replaces spira/heimdall.sh."

[lib]
path = "src/lib.rs"

[[bin]]
name = "heimdall"
path = "src/main.rs"

[[test]]
name = "no_fork_edges"
path = "tests/no_fork_edges.rs"
required-features = ["integration"]

[[test]]
name = "lane"
path = "tests/lane.rs"
required-features = ["integration"]

[[test]]
name = "inbox_page"
path = "tests/inbox_page.rs"
required-features = ["integration"]

[features]
integration = ["spira-pub/integration", "runtime/integration", "inbox-rules/integration", "spira-config/integration", "spira-store/integration", "spira-otel/integration", "testkit/integration", "spira-test-id/integration"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
regex = "1"
spira-config = { path = "../spira-config" }
spira-store = { path = "../spira-store" }
spira-otel = { path = "../spira-otel" }
runtime = { path = "../runtime" }
inbox-rules = { path = "../inbox-rules" }
spira-pub = { path = "../spira-pub" }

[dev-dependencies]
spira-test-id = { path = "../spira-test-id" }
testkit = { path = "../testkit" }
