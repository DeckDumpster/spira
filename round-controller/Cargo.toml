[package]
name = "round-controller"
version = "0.1.0"
edition = "2021"
description = "round-controller — rounds as resources with one owner and one store: injected ports, typed stamped outcomes, and the scenario harness its every branch is driven through. Only its sifts verb is installed."

[lib]
name = "round_controller"

[[bin]]
name = "round-controller"
path = "src/main.rs"

[features]
sim = ["dep:toml", "dep:spira-lc", "dep:spira-sim", "dep:incident"]

[dependencies]
batcher = { path = "../batcher" }
lifecycle = { path = "../lifecycle" }
migration-numbers = { path = "../migration-numbers" }
runtime = { path = "../runtime" }
sift = { path = "../sift" }
spira-config = { path = "../spira-config" }
incident = { path = "../incident", optional = true }
spira-desired-state = { path = "../desired-state" }
spira-lc = { path = "../spira-lc", optional = true }
spira-otel = { path = "../spira-otel" }
spira-sim = { package = "sim", path = "../sim", optional = true }
state-store = { path = "../state-store" }
store-view = { path = "../store-view" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
toml = { version = "0.8", optional = true }

[dev-dependencies]
reconciler-engine = { path = "../reconciler-engine" }
round-controller = { path = ".", features = ["sim"] }
spira-lc = { path = "../spira-lc" }
state-store-sqlite = { path = "../state-store-sqlite" }
testkit = { path = "../testkit" }
forge = { path = "../forge" }
