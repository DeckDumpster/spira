# Coverage is attributed per test across this whole crate: every decision branch is covered by
# a scenario or a unit test, and the bead's own gate reports any branch none of them takes.
[crate]
per_test = true

# The ledger's decisions, named for the aggregate run as well.
[[scope]]
path = "round-controller/src/ledger.rs"
functions = ["record_attempt", "mark_proven", "refuses"]

[[scope]]
path = "round-controller/src/resources.rs"
functions = ["PassIdentity::hash"]

# Named for the slot API: every branch of the grant, the budget and the hand driver's grant is
# reported when no test takes it.
[[scope]]
path = "round-controller/src/slots.rs"
functions = ["grant", "take", "SlotSettings::budget", "budget", "grant_for_hand"]

# The Judge's decisions: typing a pass, typing a lane fault, judging a red and the eject path.
[[scope]]
path = "round-controller/src/judge.rs"
functions = ["judge", "type_pass", "type_lane_fault", "judge_red", "removal_sets", "finish"]
# The Planner's decisions: the cut, its explicit verb, and supersede on a broken base.
[[scope]]
path = "round-controller/src/cut.rs"
functions = ["cut", "plan", "explicit", "select"]

[[scope]]
path = "round-controller/src/supersede.rs"
functions = ["check"]

[[scope]]
path = "round-controller/src/stack.rs"
functions = ["Stack::of", "Stack::place"]

# The runner's decisions: renewal and its loss, the kill path's escalation, the pass and the
# resume from progress inside `run`.
[[scope]]
path = "round-controller/src/run.rs"
functions = ["run", "main_pass", "kill_child", "Keeper::tick", "Guard::launch", "Guard::wait", "pass_result", "setup_phase"]

# The launcher: the systemd-run call and its failure path, the is-active mapping, and the unit name.
[[scope]]
path = "round-controller/src/real/launch.rs"
functions = ["start", "is_active"]

[[scope]]
path = "round-controller/src/death.rs"
functions = ["unit_name", "hand_unit_name"]

# The Lander's decisions: which rounds it takes, the retry rule, the store-held stack, git's
# fast-forward, the verb's refusal classifier and the landing's txn.
[[scope]]
path = "round-controller/src/land.rs"
functions = ["land", "one", "Held::decide", "Held::refused", "Held::hold", "Held::record_landed", "landed_value"]

# The section: what is built from the store, when it is written, and the condition each level
# raises; and every arm of the intent applier.
[[scope]]
path = "round-controller/src/section.rs"
functions = ["build", "green", "repeats", "lane_faults", "publish", "published", "write", "section"]

[[scope]]
path = "round-controller/src/intents.rs"
functions = ["apply", "decide", "concurrency", "hold", "init_concurrency", "answered", "ack_word"]

# The lease verbs: the queue guard every leased round verb meets, lease clear's proof of death,
# and the hand driver's hold and its renewal.
[[scope]]
path = "queue/src/ops/lease.rs"
functions = ["lease_guard"]

[[scope]]
path = "round-controller/src/clear.rs"
functions = ["clear"]

[[scope]]
path = "release/src/round_recert.rs"
functions = ["Hold::take", "Keeper::tick", "drive", "start"]

# The pass: the off switches in their order, the fixed steps, and the schedule step's hand-off of
# a slot and a lease to a launched runner, with the failure path that gives both back.
[[scope]]
path = "round-controller/src/switches.rs"
functions = ["check", "andon"]

[[scope]]
path = "round-controller/src/pass.rs"
functions = ["pass_with"]

[[scope]]
path = "round-controller/src/schedule.rs"
functions = ["schedule", "start"]

# The Sift: which repositories are screened, the pool a screen judges, what a pass records, and
# every verdict the screen reaches written to the store, the bead and the Concierge's inbox.
[[scope]]
path = "round-controller/src/sifts.rs"
functions = ["sifts", "sift_one", "sift_repo", "certified_pool", "read_pool", "barred_ids", "drop_stacked_on_barred", "Live::pass", "Live::tell", "lc_sifted", "lc_gate_red", "fetch_base"]
