description = "a two-member red: the base is green and the run without sp-a is green, so sp-a is proven; the eject verb refuses it, so the round is held on EjectRefused with no ejected line, nothing marked proven, no abandon and no other verb for sp-b"
repos = ["lane"]

[run]
epoch = 1800000000
passes = 1
every_secs = 60

[judge]
repo = "lane"
batch = "lane-r1"
base = "base-1"
image_digest = "sha256-img-1"

[[judge.member]]
id = "sp-a"
tip = "a1"
changed = ["src/a.rs"]

[[judge.member]]
id = "sp-b"
tip = "b1"
changed = ["src/b.rs"]

[judge.result]
exit = 1
red = ["test-lane.sh"]
output = "test-lane.sh: assertion failed at src/a.rs:12"

[[judge.job]]
removal = []
results = ["red"]
secs = 20

[[judge.job]]
removal = ["sp-a", "sp-b"]
results = ["green"]
secs = 20

[[judge.job]]
removal = ["sp-a"]
results = ["green"]
secs = 20

[[judge.job]]
removal = ["sp-b"]
results = ["red"]
secs = 20

[[judge.drive]]
pass = 1

[[verb]]
verb = "eject"
refuse = { code = 1, text = "queue.sh round eject: --suites names test-lane.sh which this round does not know" }

[[expect]]
name = "held-on-eject-refused"
count = "held-eject-refused"
equals = 1

[[expect]]
name = "one-eject-tried"
count = "calls:eject"
equals = 1

[[expect]]
name = "no-ejected-line"
count = "outcomes:ejected"
equals = 0

[[expect]]
name = "the-refusal-is-a-line"
count = "outcomes:refused"
equals = 1

[[expect]]
name = "nothing-marked-proven"
count = "proven"
equals = 0

[[expect]]
name = "not-abandoned"
count = "calls:abandon"
equals = 0

[[expect]]
name = "no-other-verb"
count = "calls"
equals = 1

# The round's red, and under two runner slots the run without sp-b too, which runs beside the
# run without sp-a before that one proves sp-a: a removal set is its own identity.
[[expect]]
name = "the-red-is-recorded"
count = "attempts:red"
equals = 0
inverted = true

[[expect]]
name = "no-red-but-the-round-and-its-removal-sets"
count = "attempts:red"
at_most = 2

[[expect]]
name = "inverted-recorded-not-held"
count = "judged:recorded"
equals = 1
inverted = true
