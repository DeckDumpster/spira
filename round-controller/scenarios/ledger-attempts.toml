description = "the verdict ledger: two VM faults on one identity are attempts 1 and 2 and the next waits out the doubled back-off; a red of A and B proving only A leaves B free at once; an Image fault refuses every candidate of the repo until the digest changes"
repos = ["lane"]

[run]
epoch = 1800000000
passes = 7
every_secs = 60
jitter_secs = 0

# Non-default knobs, so a literal written into the ledger would not pass.
[ledger]
fault_backoff_secs = 70
fault_retries = 2

[[identity]]
name = "xy"
repo = "lane"
members = ["sp-y:2", "sp-x:1"]

[[identity]]
name = "ab"
repo = "lane"
members = ["sp-a:1", "sp-b:2"]

[[identity]]
name = "b"
repo = "lane"
members = ["sp-b:2"]

[[identity]]
name = "ac"
repo = "lane"
members = ["sp-a:1", "sp-c:3"]

[[identity]]
name = "c"
repo = "lane"
members = ["sp-c:3"]

[[identity]]
name = "c-new-image"
repo = "lane"
members = ["sp-c:3"]
image_digest = "sha256:image-1"

# Pass 1 (t+0): the first VM fault, backing off 70 s.
[[ledger_step]]
pass = 1
act = "record"
identity = "xy"
class = "fault"
cause = "vm"
want = "attempt-1"

[[ledger_step]]
pass = 2
act = "refuses"
identity = "xy"
want = "backing-off"

# Pass 3 (t+120): the back-off ran out; the second fault is attempt 2, backing off 140 s.
[[ledger_step]]
pass = 3
act = "refuses"
identity = "xy"
want = "admitted"

[[ledger_step]]
pass = 3
act = "record"
identity = "xy"
class = "fault"
cause = "vm"
batch = "b2"
want = "attempt-2"

[[ledger_step]]
pass = 4
act = "refuses"
identity = "xy"
want = "backing-off"

# t+240 is past a 70 s back-off but inside the doubled one.
[[ledger_step]]
pass = 5
act = "refuses"
identity = "xy"
want = "backing-off"

[[ledger_step]]
pass = 6
act = "refuses"
identity = "xy"
want = "admitted"

# A red of A and B where the Attributor proved only A.
[[ledger_step]]
pass = 6
act = "record"
identity = "ab"
class = "red"
step = "spira-lint"
batch = "b3"
want = "attempt-1"

[[ledger_step]]
pass = 6
act = "prove"
identity = "ab"
members = ["sp-a:1"]
want = "ok"

[[ledger_step]]
pass = 6
act = "refuses"
identity = "ab"
want = "red-identity"

[[ledger_step]]
pass = 6
act = "refuses"
identity = "b"
want = "admitted"

[[ledger_step]]
pass = 6
act = "refuses"
identity = "ac"
want = "red-member"

# An Image fault stops the lane on its (base, digest); a new digest is a new input.
[[ledger_step]]
pass = 7
act = "lane-fault"
identity = "c"
class = "fault"
cause = "image"
want = "new"

[[ledger_step]]
pass = 7
act = "refuses"
identity = "c"
want = "lane-fault"

[[ledger_step]]
pass = 7
act = "refuses"
identity = "b"
want = "lane-fault"

[[ledger_step]]
pass = 7
act = "refuses"
identity = "c-new-image"
want = "admitted"

[[expect]]
name = "xy-has-two-attempts"
count = "attempts:xy"
equals = 2

[[expect]]
name = "xy-summary-counts-two"
count = "summary:xy"
equals = 2

[[expect]]
name = "ab-has-one-attempt"
count = "attempts:ab"
equals = 1

[[expect]]
name = "only-the-proven-member-is-marked"
count = "keys:verdicts/lane/by-member/"
equals = 1

[[expect]]
name = "no-by-member-key-for-b"
count = "keys:verdicts/lane/by-member/sp-b/"
equals = 0

[[expect]]
name = "one-lane-fault"
count = "keys:faults/lane/"
equals = 1

[[expect]]
name = "no-verb-called"
count = "calls"
equals = 0

# The positive control: the keys counter can see the by-member key it counts.
[[expect]]
name = "inverted-no-member-marked"
count = "keys:verdicts/lane/by-member/"
equals = 0
inverted = true
