description = "the harness itself: three passes over two repos with no steps registered visit each repo once a pass, call no verb, start no VM and write nothing"
repos = ["home", "other"]

[run]
epoch = 1800000000
passes = 3
every_secs = 30
jitter_secs = 10

[[store]]
key = "batches/home/b1"
data = { state = "OPEN", members = "sp-a:1" }

[[expect]]
name = "every-repo-visited-each-pass"
count = "outcomes:visited"
equals = 6

[[expect]]
name = "no-verb-called"
count = "calls"
equals = 0

[[expect]]
name = "no-vm-started"
count = "vm-runs"
equals = 0

[[expect]]
name = "nothing-written"
count = "store-writes"
equals = 0

# The positive control: it holds only if the harness counted nothing, so its failure, naming
# itself, shows the counter behind the expectations above can count.
[[expect]]
name = "inverted-no-repo-visited"
count = "outcomes:visited"
equals = 0
inverted = true
