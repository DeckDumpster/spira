description = "a GREEN round whose head the landing ref already holds is recorded LANDED from git with no land call and no push, and the lane's landing_ref moves with it, so the round stacked on it, green a pass later, is landed on the moved ref rather than superseded"
repos = ["lane"]

[run]
epoch = 1800000000
passes = 3
every_secs = 300

[[store]]
key = "lanes/lane"
data = { landing_ref = "base-0", image_digest = "sha256:img-0", harness_version = "harness-0" }

# The ref is already past base-0, at k1's head.
[[git]]
repo = "lane"
landing = "k1-h1"
history = ["base-0"]

[[store]]
key = "batches/lane/k1"
data = { batch_id = "k1", repo = "lane", state = "Green", head = "k1-h1", base = "base-0", pass = 1, version = 3, tested_base = "base-0", members = [{ id = "sp-a", tip = "a1" }] }

[[store]]
key = "batches/lane/k2"
data = { batch_id = "k2", repo = "lane", state = "CiRunning", parent = "k1", head = "k2-h1", base = "k1-h1", pass = 1, version = 3, tested_base = "k1-h1", members = [{ id = "sp-b", tip = "b1" }] }

[[store_step]]
pass = 2
key = "batches/lane/k2"
data = { batch_id = "k2", repo = "lane", state = "Green", parent = "k1", head = "k2-h1", base = "k1-h1", pass = 1, version = 4, tested_base = "k1-h1", members = [{ id = "sp-b", tip = "b1" }] }

[[verb]]
verb = "land"
batch = "k2"
ok = {}

[[expect]]
name = "k1-fast-forwarded-from-git"
count = "outcomes:fast-forward:k1"
equals = 1

[[expect]]
name = "no-land-call-for-k1"
count = "outcomes:landed:k1"
equals = 0

[[expect]]
name = "k2-landed-on-the-moved-ref"
count = "outcomes:landed:k2"
equals = 1

[[expect]]
name = "one-land-call-in-all"
count = "calls:land"
equals = 1

[[expect]]
name = "both-landed"
count = "rounds:LANDED"
equals = 2

[[expect]]
name = "nothing-superseded"
count = "calls:supersede"
equals = 0

[[expect]]
name = "inverted-k1-was-pushed"
count = "calls:land"
equals = 2
inverted = true
