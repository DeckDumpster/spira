description = "a runner whose renewal is refused mid-suites terminates its VM's process group, waits out the VM's teardown, and only then gives its slot back; it writes no attempt, so no identity goes into back-off"
repos = ["lane"]

[run]
epoch = 1800000000
passes = 2
every_secs = 60

# Renewals every 20 s from the runner's start at 10 s: 30, 50, 70, 90; the one at 110 is refused.
[lease]
ttl_secs = 60
pass_wall_max_secs = 30000
redrive_retries = 2
ec2_max_lifetime_secs = 60000

[lease.deadline_secs]
boot = 40
build = 50
suites = 90
subpass = 300
certify = 30

[[store]]
key = "lanes/lane"
data = { landing_ref = "base-0", image_digest = "sha256:img-0", harness_version = "harness-0" }

[[store]]
key = "batches/lane/b1"
data = { batch_id = "b1", repo = "lane", state = "CiRunning", head = "h1", base = "base-0", pass = 1, version = 1, tested_base = "base-0", members = [{ id = "sp-a", tip = "a1" }] }

[[verb]]
verb = "pass-start"
ok = {}

[[vm]]
identity = "b1"
verdict = "green"
duration_secs = 600
phases = ["vm", "build", "suites"]
marks_every_secs = 10
teardown_secs = 30
vm = "vm-103"

[[run_pass]]
repo = "lane"
batch = "b1"
start_secs = 10
revoke_lease_secs = 100

[[expect]]
name = "the-lease-was-lost-to-a-refused-renewal"
count = "run-lost:expired"
equals = 1

[[expect]]
name = "the-vm-was-terminated-not-killed"
count = "vm-signals:term"
equals = 1

[[expect]]
name = "no-kill-was-needed"
count = "vm-signals:kill"
equals = 0

[[expect]]
name = "the-vm-was-torn-down"
count = "vm-torn-down"
equals = 1

[[expect]]
name = "the-slot-was-given-back"
count = "slot-releases"
equals = 1

[[expect]]
name = "never-while-the-vm-was-up"
count = "slot-releases-with-vm-up"
equals = 0

# TERM at the refused renewal (110 s), then the VM's 30 s teardown.
[[expect]]
name = "given-back-once-the-teardown-ended"
count = "last-slot-release-secs"
equals = 140

[[expect]]
name = "no-attempt"
count = "ledger-attempts"
equals = 0

[[expect]]
name = "no-pass-in-hand-recorded"
count = "keys:batches/lane/b1/progress"
equals = 0

[[expect]]
name = "no-lock-left-held"
count = "live-locks:runner-slot/"
equals = 0

[[expect]]
name = "inverted-the-slot-went-back-with-the-vm-up"
count = "slot-releases-with-vm-up"
equals = 1
inverted = true
