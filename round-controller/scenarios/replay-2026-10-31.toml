description = "the 10-31 replay: the captured day's 252 certification passes as planner requests, cut through the ledger just in time for a slot, typed by the Judge and landed by the Lander, with pass every 30 s. Every member certified green lands once, no green round is abandoned, and no pathology wastes more than one pass"

[run]
every_secs = 30

# Long enough that no lease lapses while its holder is alive: the replay's runners and hand driver
# give theirs back themselves, and a lapse here is a fault's re-drive, not a clock's.
[lease]
ttl_secs = 86400
pass_wall_max_secs = 86400
redrive_retries = 3
ec2_max_lifetime_secs = 86400

[lease.deadline_secs]
boot = 600
build = 600
suites = 600
subpass = 600
certify = 600

[ledger]
fault_backoff_secs = 120
fault_retries = 3

[fixture]
slice = "1031"
stale = ["repo-b-20261031T032503Z"]

# The capture keeps no lane records: each lane's base, image, harness and depth are stated here.
[[fixture.lane]]
repo = "repo-a"
landing = "landing-repo-a-1030"
image_digest = "sha256-img-repo-a"
harness_version = "harness-1031"
depth = 2

[[fixture.lane]]
repo = "repo-b"
landing = "landing-repo-b-1030"
image_digest = "sha256-img-repo-b"
harness_version = "harness-1031"
depth = 2

[[fixture.lane]]
repo = "repo-c"
landing = "landing-repo-c-1030"
image_digest = "sha256-img-repo-c"
harness_version = "harness-1031"
depth = 2

# The repeat-red repo's red is its image's (ensurepip missing), which the capture records only as
# "red-attributed": the Judge's rerun and both base runs are stated here. Its member's second tip
# went green, which a standing Image fault would refuse, so that tip is taken to arrive on a fixed
# image, at the moment it was resubmitted.
[[fixture.judged]]
repo = "repo-c"
member = "b-1254@05c3a8aaa5c7"

[fixture.judged.result]
exit = 1
red = ["testenv"]
phase = "image-setup"
output = "ensurepip is not available. On Debian/Ubuntu systems, you need to install the python3-venv package: apt install python3.14-venv"

[[fixture.judged.job]]
removal = []
results = ["red"]
secs = 30

[[fixture.judged.job]]
removal = ["b-1254"]
results = ["red", "red"]
secs = 30

[[fixture.image]]
repo = "repo-c"
at = "2026-10-31T19:34:00Z"
digest = "sha256-img-repo-c-fixed"

# A round-recert on the re-cut-under-a-driver round, from 12:31:30 PT until its certify ended at
# 12:38:45 PT (batcher evidence D8); the capture has no record of a hand driver.
[[fixture.hand_driver]]
batch = "repo-b-20261031T192936Z"
at = "2026-10-31T19:31:30Z"
until = "2026-10-31T19:38:45Z"

# The batcher evidence's pathologies, by the members their rounds held or the round they name.
# D16 (fences refused on the host) has no row: its 34 rounds never started a pass, so the
# capture holds nothing of theirs to replay.

# D1: the repeat-red member re-cut at one tip after every red.
[[pathology]]
name = "pokebot-loop"
repo = "repo-c"
members = ["b-1254"]

# The offline-build red re-cut at one tip.
[[pathology]]
name = "offline-red"
repo = "repo-b"
members = ["b-1239"]

# D5/D6: the parent left in ATTRIBUTING, and every round stacked on it.
[[pathology]]
name = "stacked-parent"
repo = "repo-b"
members = ["b-1234.2", "b-1245", "b-1252"]

# D4: the round the lifecycle abandoned whose record stayed, and anything stacked on it.
[[pathology]]
name = "stale-pointer"
repo = "repo-b"
batches = ["repo-b-20261031T032503Z"]

# D8: the round re-cut under its hand driver.
[[pathology]]
name = "driver-recut"
repo = "repo-b"
members = ["b-1267"]

# D7: the home repo's lint red recorded as two incomplete passes.
[[pathology]]
name = "attributing-redrive"
repo = "repo-a"
members = ["b-1261"]

# What the day recorded, as the manifest tallies it (checked against MANIFEST.md by a test).
[[expect]]
name = "home_repo_green_passes"
count = "fixture-passes:repo-a:green"
equals = 21

[[expect]]
name = "stacked_repo_green_passes"
count = "fixture-passes:repo-b:green"
equals = 38

[[expect]]
name = "repeat_red_repo_green_passes"
count = "fixture-passes:repo-c:green"
equals = 1

[[expect]]
name = "repeat_red_repo_red_passes"
count = "fixture-passes:repo-c:red-attributed"
equals = 97

[[expect]]
name = "the_repeat_red_member_started_99_passes_at_one_tip"
count = "fixture-repeat-starts:b-1254@05c3a8aaa5c7"
equals = 99

[[expect]]
name = "the_offline_member_started_49_passes_at_one_tip"
count = "fixture-repeat-starts:b-1239@b70d36ef6e67"
equals = 49

[[expect]]
name = "29_rounds_stacked_on_the_stuck_parent"
count = "fixture-stacked:repo-b-20261031T031222Z"
equals = 29

[[expect]]
name = "46_beads_certified_green"
count = "fixture-green-members"
equals = 46

# What the controller did with it.
[[expect]]
name = "every_member_certified_green_lands_once"
count = "green-members-landed-once"
equals = 46

[[expect]]
name = "no_member_certified_green_lands_twice_or_never"
count = "green-members-not-landed-once"
equals = 0

[[expect]]
name = "no_green_round_abandoned"
count = "green-rounds-abandoned"
equals = 0

[[expect]]
name = "pokebot_wastes_at_most_one_pass"
count = "wasted:pokebot-loop"
at_most = 1

[[expect]]
name = "offline_red_wastes_at_most_one_pass"
count = "wasted:offline-red"
at_most = 1

[[expect]]
name = "stacked_parent_wastes_at_most_one_pass"
count = "wasted:stacked-parent"
at_most = 1

[[expect]]
name = "stale_pointer_wastes_at_most_one_pass"
count = "wasted:stale-pointer"
at_most = 1

[[expect]]
name = "driver_recut_wastes_at_most_one_pass"
count = "wasted:driver-recut"
at_most = 1

[[expect]]
name = "attributing_redrive_wastes_at_most_one_pass"
count = "wasted:attributing-redrive"
at_most = 1

[[expect]]
name = "pokebot_one_image_fault"
count = "lane-faults:repo-c:image"
equals = 1

[[expect]]
name = "the_fault_names_the_digest"
count = "lane-faults-naming:sha256-img-repo-c"
equals = 1

[[expect]]
name = "pokebot_no_eject"
count = "calls:eject"
equals = 0

[[expect]]
name = "nothing_stacks_on_the_stale_record"
count = "opens:stack-on:repo-b-20261031T032503Z"
equals = 0

[[expect]]
name = "no_request_stranded"
count = "stranded"
equals = 0

# Positive control: the replay sees what the controller landed.
[[expect]]
name = "inverted_nothing_landed"
count = "green-members-landed-once"
equals = 0
inverted = true
