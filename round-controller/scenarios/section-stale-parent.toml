description = "the section names a stuck parent: P is ATTRIBUTING and unleased while its old runner is still up, so its two GREEN children are listed with their blocker and StackedOnUndrivenParent is True with the distance above 0; once P's runner is gone it is re-driven, goes GREEN and lands with both children in one pass, and the distance returns to 0"
repos = ["lane"]

[run]
epoch = 1800000000
passes = 9
every_secs = 300

[lease]
ttl_secs = 20000
pass_wall_max_secs = 20000
redrive_retries = 3
ec2_max_lifetime_secs = 3600

[lease.deadline_secs]
boot = 600
build = 600
suites = 600
subpass = 600
certify = 600

[[store]]
key = "lanes/lane"
data = { landing_ref = "base-0", image_digest = "sha256:img-0", harness_version = "harness-0" }

[[git]]
repo = "lane"
landing = "base-0"

[[store]]
key = "batches/lane/p1"
data = { batch_id = "p1", repo = "lane", state = "Attributing", head = "p1-h1", base = "base-0", pass = 1, version = 4, tested_base = "base-0", members = [{ id = "sp-a", tip = "a1" }], last_lease_token = { main = 7, sub = 0 } }

[[store]]
key = "batches/lane/c1"
data = { batch_id = "c1", repo = "lane", state = "Green", parent = "p1", head = "c1-h1", base = "p1-h1", pass = 1, version = 3, tested_base = "p1-h1", members = [{ id = "sp-b", tip = "b1" }], last_lease_token = { main = 8, sub = 0 } }

[[store]]
key = "batches/lane/c2"
data = { batch_id = "c2", repo = "lane", state = "Green", parent = "c1", head = "c2-h1", base = "c1-h1", pass = 1, version = 3, tested_base = "c1-h1", members = [{ id = "sp-c", tip = "c1" }], last_lease_token = { main = 9, sub = 0 } }

# P's old runner is up for the first five passes, so P is held, unleased; from 25 min in
# systemd no longer knows it, and P is re-driven.
[[unit]]
name = "round-controller-run-p1-7-0"
state = "active"
until = 1800001500

[[launch]]
ok = true

# 33 min in: the re-driven runner's pass is green, and it gives its lease back.
[[lease_release]]
repo = "lane"
batch = "p1"
secs = 2000

[[store_step]]
pass = 8
key = "batches/lane/p1"
data = { batch_id = "p1", repo = "lane", state = "Green", head = "p1-h1", base = "base-0", pass = 2, version = 7, tested_base = "base-0", members = [{ id = "sp-a", tip = "a1" }] }

[[verb]]
verb = "land"
batch = "p1"
ok = {}

[[verb]]
verb = "land"
batch = "c1"
ok = {}

[[verb]]
verb = "land"
batch = "c2"
ok = {}

[[expect]]
name = "the-stuck-parent-is-raised-while-it-is-unleased"
count = "section-raised:StackedOnUndrivenParent"
equals = 5

[[expect]]
name = "both-green-children-listed-with-their-blocker"
count = "section-green-with-blocker"
equals = 2

[[expect]]
name = "the-distance-is-open-until-the-stack-lands"
count = "section-distance:positive"
equals = 7

[[expect]]
name = "the-distance-returns-to-0"
count = "section-last-distance"
equals = 0

[[expect]]
name = "the-parent-is-re-driven-once"
count = "outcomes:redriven:p1"
equals = 1

[[expect]]
name = "every-round-landed"
count = "rounds:LANDED"
equals = 3

[[expect]]
name = "no-section-refused"
count = "section-refusals"
equals = 0

[[expect]]
name = "inverted-never-raised"
count = "section-raised:StackedOnUndrivenParent"
equals = 0
inverted = true
