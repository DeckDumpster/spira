description = "a two-deep stack: an eject in the round at depth 1 moves its head, so the green round at depth 2 is superseded, not abandoned, and its members are re-cut on the new head in the same pass"
repos = ["lane"]

[run]
epoch = 1800000000
passes = 5
every_secs = 30

[[store]]
key = "lanes/lane"
data = { landing_ref = "base-0", image_digest = "sha256:img-0", harness_version = "harness-0" }

[[store]]
key = "batches/lane/k1"
data = { batch_id = "k1", repo = "lane", state = "CiRunning", head = "k1-h1", base = "base-0", pass = 1, version = 1, tested_base = "base-0", members = [{ id = "sp-a", tip = "a1" }, { id = "sp-d", tip = "d1" }] }

[[store]]
key = "batches/lane/k2"
data = { batch_id = "k2", repo = "lane", state = "Green", parent = "k1", head = "k2-h1", base = "k1-h1", pass = 1, version = 2, tested_base = "k1-h1", members = [{ id = "sp-b", tip = "b1" }, { id = "sp-c", tip = "c1" }] }

[[store]]
key = "lifecycle/sp-a"
data = { repo = "lane", state = "CERTIFIED", tip = "a1" }

[[store]]
key = "lifecycle/sp-b"
data = { repo = "lane", state = "CERTIFIED", tip = "b1" }

[[store]]
key = "lifecycle/sp-c"
data = { repo = "lane", state = "CERTIFIED", tip = "c1" }

[[store]]
key = "lifecycle/sp-d"
data = { repo = "lane", state = "CERTIFIED", tip = "d1" }

[[round_lease]]
repo = "lane"
batch = "k1"

[[round_lease]]
repo = "lane"
batch = "k2"

[[slot]]
repo = "lane"

# Pass 5: the round at depth 1 is red and ejects sp-a, which moves its head; sp-a is ejected red
# at its tip.
[[store_step]]
pass = 5
key = "batches/lane/k1"
data = { batch_id = "k1", repo = "lane", state = "Attributing", head = "k1-h2", base = "base-0", pass = 2, version = 3, tested_base = "base-0", members = [{ id = "sp-d", tip = "d1" }] }

[[store_step]]
pass = 5
key = "lifecycle/sp-a"
data = { repo = "lane", state = "CERTIFIED", tip = "a1", ejected_red_tip = "a1" }

[[verb]]
verb = "supersede"
repo = "lane"
ok = { released = "sp-b:b1 sp-c:c1" }

[[verb]]
verb = "open"
repo = "lane"
ok = { batch = "k3", head = "k3-h1" }

[[expect]]
name = "depth-2-superseded-once"
count = "calls:supersede"
equals = 1

[[expect]]
name = "the-supersede-is-the-act"
count = "outcomes:superseded"
equals = 1

[[expect]]
name = "its-members-re-cut-on-the-new-head-in-pass-5"
count = "opens:stack-on:k1"
equals = 1

[[expect]]
name = "the-re-cut-round-stands"
count = "keys:batches/lane/k3"
equals = 1

[[expect]]
name = "no-green-round-abandoned"
count = "calls:abandon"
equals = 0

[[expect]]
name = "nothing-cut-while-the-stack-was-full"
count = "calls"
equals = 2

[[expect]]
name = "the-superseded-round-left-the-live-set"
count = "keys:batches/lane/k2"
equals = 0
