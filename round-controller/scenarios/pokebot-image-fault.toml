description = "pokebot on 10-31: while its Image fault stands on (base, digest) the cut is refused, told once as one key over 120 passes, with no round opened; a new image digest re-admits the lane"
repos = ["pokebot"]

[run]
epoch = 1800000000
passes = 121
every_secs = 30
jitter_secs = 5

[[store]]
key = "lanes/pokebot"
data = { landing_ref = "pb-base", image_digest = "sha256:no-venv", harness_version = "harness-0" }

[[store]]
key = "faults/pokebot/pb-base/sha256:no-venv"
data = { cause = { cause = "image", digest = "sha256:no-venv" }, evidence = "python3.14-venv is not in the image", since = 1800000000000 }

[[store]]
key = "lifecycle/sp-p1"
data = { repo = "pokebot", state = "CERTIFIED", tip = "p1" }

[[store]]
key = "lifecycle/sp-p2"
data = { repo = "pokebot", state = "SUBMITTED", tip = "p2" }

[[slot]]
repo = "pokebot"

[[store_step]]
pass = 121
key = "lanes/pokebot"
data = { landing_ref = "pb-base", image_digest = "sha256:with-venv", harness_version = "harness-0" }

[[verb]]
verb = "open"
repo = "pokebot"
ok = { batch = "pb-r1", head = "pb-h1" }

[[expect]]
name = "the-fault-refused-once"
count = "outcomes:declined"
equals = 1

[[expect]]
name = "re-admitted-by-the-new-digest"
count = "calls:open"
equals = 1

[[expect]]
name = "the-refusal-cleared-once-it-no-longer-stood"
count = "keys:telemetry/round-controller/pokebot/"
equals = 0

# The refusal written once and cleared once, the new digest and the round the fake queue opened:
# a repeat of the refusal writes nothing.
[[expect]]
name = "the-refusal-is-one-write-not-one-a-pass"
count = "store-writes"
equals = 4
