description = "two repos, each with a member ready and a second arriving 30 s in: under default two runner slots run a round of each repo at once and then a round stacked on a live round of the same repo; under reference-minimum the rounds take the one slot in turn; under both every member lands once and nothing is faulted, left leased or lost"
repos = ["a", "b"]

[run]
epoch = 1800000000
passes = 12
every_secs = 30

# Longer than any runner runs, which renews nothing.
[lease]
ttl_secs = 3600
pass_wall_max_secs = 3600
redrive_retries = 2
ec2_max_lifetime_secs = 3600

[lease.deadline_secs]
boot = 600
build = 600
suites = 600
subpass = 600
certify = 600

[slots]
per_profile = true

[[store]]
key = "lanes/a"
data = { landing_ref = "base-a", image_digest = "sha256:img-0", harness_version = "harness-0" }

[[store]]
key = "lanes/b"
data = { landing_ref = "base-b", image_digest = "sha256:img-0", harness_version = "harness-0" }

[[git]]
repo = "a"
landing = "base-a"

[[git]]
repo = "b"
landing = "base-b"

[[store]]
key = "lifecycle/sp-a1"
data = { repo = "a", state = "SUBMITTED", tip = "a1" }

[[store]]
key = "lifecycle/sp-b1"
data = { repo = "b", state = "SUBMITTED", tip = "b1" }

[[store_step]]
pass = 2
key = "lifecycle/sp-a2"
data = { repo = "a", state = "SUBMITTED", tip = "a2" }

[[store_step]]
pass = 2
key = "lifecycle/sp-b2"
data = { repo = "b", state = "SUBMITTED", tip = "b2" }

[[verb]]
verb = "open"
repo = "a"
ok = { batch = "a1", head = "a1-h" }

[[verb]]
verb = "open"
repo = "a"
ok = { batch = "a2", head = "a2-h" }

[[verb]]
verb = "open"
repo = "b"
ok = { batch = "b1", head = "b1-h" }

[[verb]]
verb = "open"
repo = "b"
ok = { batch = "b2", head = "b2-h" }

[[verb]]
verb = "land"
batch = "a1"
ok = {}

[[verb]]
verb = "land"
batch = "a2"
ok = {}

[[verb]]
verb = "land"
batch = "b1"
ok = {}

[[verb]]
verb = "land"
batch = "b2"
ok = {}

# In launch order, each runner's pass is green after this long.
[[launch]]
ok = true
finish_secs = 150

[[launch]]
ok = true
finish_secs = 40

[[launch]]
ok = true
finish_secs = 60

[[launch]]
ok = true
finish_secs = 30

[[expect]]
name = "every-member-lands"
count = "members:LANDED"
equals = 4

[[expect]]
name = "nothing-abandoned"
count = "calls:abandon"
equals = 0

[[expect]]
name = "no-lease-left-held"
count = "live-locks:round/"
equals = 0

[[expect]]
name = "no-slot-left-held"
count = "live-locks:runner-slot/"
equals = 0

[[expect]]
name = "two-runners-at-once"
count = "runners-at-once"
equals = 2
profile = "default"

[[expect]]
name = "both-repos-at-once"
count = "repos-at-once"
equals = 2
profile = "default"

[[expect]]
name = "a-stack-two-deep-at-once"
count = "runners-at-once:a"
equals = 2
profile = "default"

[[expect]]
name = "the-second-round-stacked-on-the-live-first"
count = "opens:stack-on:a1"
equals = 1
profile = "default"

[[expect]]
name = "four-rounds-land"
count = "rounds:LANDED"
equals = 4
profile = "default"

[[expect]]
name = "one-runner-at-a-time"
count = "runners-at-once"
equals = 1
profile = "reference-minimum"

[[expect]]
name = "one-repo-at-a-time"
count = "repos-at-once"
equals = 1
profile = "reference-minimum"

[[expect]]
name = "three-rounds-land"
count = "rounds:LANDED"
equals = 3
profile = "reference-minimum"

[[expect]]
name = "inverted-nothing-ran"
count = "runners-at-once"
equals = 0
inverted = true
