description = "a red reproduced by its plain rerun whose first base run is red and second green: one base run is not a lane fault, so the attempt is Flaky and no lane fault stands"
repos = ["lane"]

[run]
epoch = 1800000000
passes = 1
every_secs = 60

[judge]
repo = "lane"
batch = "lane-r1"
base = "base-1"
image_digest = "sha256-img-1"

[[judge.member]]
id = "sp-a"
tip = "a1"

[judge.result]
exit = 1
red = ["testenv"]

[[judge.job]]
removal = []
results = ["red"]
secs = 20

[[judge.job]]
removal = ["sp-a"]
results = ["red", "green"]
secs = 20

[[judge.drive]]
pass = 1

[[expect]]
name = "one-flaky-attempt"
count = "attempts:flaky"
equals = 1

[[expect]]
name = "one-attempt-in-all"
count = "attempts"
equals = 1

[[expect]]
name = "no-lane-fault"
count = "lane-faults"
equals = 0

[[expect]]
name = "two-base-runs"
count = "launches:base"
equals = 2

[[expect]]
name = "no-eject-called"
count = "calls:eject"
equals = 0

[[expect]]
name = "inverted-a-lane-fault"
count = "lane-faults"
equals = 1
inverted = true
