description = "a runner killed after the plain rerun: the first drive records no attempt and leaves progress; the re-drive takes the rerun from progress, never runs it again, and writes one attempt"
repos = ["lane"]

[run]
epoch = 1800000000
passes = 2
every_secs = 600

[judge]
repo = "lane"
batch = "lane-r1"
base = "base-1"
image_digest = "sha256-img-1"

[[judge.member]]
id = "sp-a"
tip = "a1"

[judge.result]
exit = 1
red = ["testenv"]

[[judge.job]]
removal = []
results = ["red"]
secs = 20

[[judge.job]]
removal = ["sp-a"]
results = ["red", "red"]
secs = 20

[[judge.drive]]
pass = 1
kill_after = 1

[[judge.drive]]
pass = 2

[[expect]]
name = "the-killed-drive-is-unfinished"
count = "judged:unfinished"
equals = 1

[[expect]]
name = "the-redrive-records"
count = "judged:recorded"
equals = 1

[[expect]]
name = "one-attempt"
count = "attempts"
equals = 1

[[expect]]
name = "the-rerun-ran-once"
count = "launches:plain"
equals = 1

[[expect]]
name = "two-base-runs"
count = "launches:base"
equals = 2

[[expect]]
name = "a-base-lane-fault"
count = "lane-faults:base"
equals = 1

[[expect]]
name = "inverted-two-attempts"
count = "attempts"
equals = 2
inverted = true
