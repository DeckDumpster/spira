description = "a stuck parent with green children stacked on it: the parent's lease lapsed in ATTRIBUTING, so it is re-driven as an orphan; every child is held StackedOnUnlanded, never abandoned and never re-driven, until the parent lands about 3.9 h later, and then each child lands once, lowest first, in the same pass"
repos = ["lane"]

[run]
epoch = 1800000000
passes = 25
every_secs = 610

# The re-driven runner's lease outlives the stall; it is given back when its pass is green.
[lease]
ttl_secs = 20000
pass_wall_max_secs = 20000
redrive_retries = 3
ec2_max_lifetime_secs = 3600

[lease.deadline_secs]
boot = 600
build = 600
suites = 600
subpass = 600
certify = 600

[[store]]
key = "lanes/lane"
data = { landing_ref = "base-0", image_digest = "sha256:img-0", harness_version = "harness-0" }

[[git]]
repo = "lane"
landing = "base-0"

[[store]]
key = "batches/lane/p1"
data = { batch_id = "p1", repo = "lane", state = "Attributing", head = "p1-h1", base = "base-0", pass = 1, version = 4, tested_base = "base-0", members = [{ id = "sp-a", tip = "a1" }], last_lease_token = { main = 7, sub = 0 } }

[[store]]
key = "batches/lane/c1"
data = { batch_id = "c1", repo = "lane", state = "Green", parent = "p1", head = "c1-h1", base = "p1-h1", pass = 1, version = 3, tested_base = "p1-h1", members = [{ id = "sp-b", tip = "b1" }], last_lease_token = { main = 8, sub = 0 } }

[[store]]
key = "batches/lane/c2"
data = { batch_id = "c2", repo = "lane", state = "Green", parent = "c1", head = "c2-h1", base = "c1-h1", pass = 1, version = 3, tested_base = "c1-h1", members = [{ id = "sp-c", tip = "c1" }], last_lease_token = { main = 9, sub = 0 } }

[[unit]]
name = "round-controller-run-p1-7-0"
state = "inactive"

[[launch]]
ok = true

# 3.9 h in: the re-driven runner's pass is green, and it gives its lease back.
[[lease_release]]
repo = "lane"
batch = "p1"
secs = 14020

[[store_step]]
pass = 24
key = "batches/lane/p1"
data = { batch_id = "p1", repo = "lane", state = "Green", head = "p1-h1", base = "base-0", pass = 2, version = 7, tested_base = "base-0", members = [{ id = "sp-a", tip = "a1" }] }

[[verb]]
verb = "land"
batch = "p1"
ok = {}

[[verb]]
verb = "land"
batch = "c1"
ok = {}

[[verb]]
verb = "land"
batch = "c2"
ok = {}

[[expect]]
name = "the-parent-is-re-driven-once"
count = "outcomes:redriven:p1"
equals = 1

[[expect]]
name = "no-green-child-is-re-driven"
count = "launches"
equals = 1

[[expect]]
name = "the-parent-lands-once"
count = "outcomes:landed:p1"
equals = 1

[[expect]]
name = "the-first-child-lands-once"
count = "outcomes:landed:c1"
equals = 1

[[expect]]
name = "the-second-child-lands-once"
count = "outcomes:landed:c2"
equals = 1

[[expect]]
name = "every-round-landed"
count = "rounds:LANDED"
equals = 3

[[expect]]
name = "one-land-call-per-round"
count = "calls:land"
equals = 3

[[expect]]
name = "each-child-held-stacked-once-until-the-parent-lands"
count = "blockers:stacked-on-unlanded"
equals = 2

[[expect]]
name = "no-other-hold"
count = "outcomes:held"
equals = 2

[[expect]]
name = "no-green-round-abandoned"
count = "calls:abandon"
equals = 0

[[expect]]
name = "no-green-round-superseded"
count = "calls:supersede"
equals = 0

[[expect]]
name = "inverted-a-child-landed-before-its-parent"
count = "outcomes:landed:c1"
equals = 0
inverted = true
