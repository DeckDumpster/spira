description = "a cut opens a round only on a runner slot its caller holds: a repo with no slot and a repo whose slot lapsed open nothing over 100 passes, and the repo holding one opens exactly one round on its landing ref"
repos = ["held", "lapsed", "none"]

[run]
epoch = 1800000000
passes = 100
every_secs = 30
jitter_secs = 5

[[store]]
key = "lanes/held"
data = { landing_ref = "base-0", image_digest = "sha256:img-0", harness_version = "harness-0" }

[[store]]
key = "lanes/lapsed"
data = { landing_ref = "base-0", image_digest = "sha256:img-0", harness_version = "harness-0" }

[[store]]
key = "lanes/none"
data = { landing_ref = "base-0", image_digest = "sha256:img-0", harness_version = "harness-0" }

[[store]]
key = "lifecycle/sp-h1"
data = { repo = "held", state = "CERTIFIED", tip = "h1" }

[[store]]
key = "lifecycle/sp-h2"
data = { repo = "held", state = "SUBMITTED", tip = "h2" }

[[store]]
key = "lifecycle/sp-l1"
data = { repo = "lapsed", state = "CERTIFIED", tip = "l1" }

[[store]]
key = "lifecycle/sp-n1"
data = { repo = "none", state = "CERTIFIED", tip = "n1" }

[[slot]]
repo = "held"
n = 0

[[slot]]
repo = "lapsed"
n = 1
released = true

[[verb]]
verb = "open"
repo = "held"
ok = { batch = "held-r1", head = "held-h1" }

[[expect]]
name = "one-round-opened"
count = "calls:open"
equals = 1

[[expect]]
name = "opened-on-the-landing-ref"
count = "opens:on-base"
equals = 1

[[expect]]
name = "the-open-is-the-act"
count = "outcomes:opened"
equals = 1

[[expect]]
name = "the-lapsed-slot-refused-once"
count = "outcomes:declined"
equals = 1

[[expect]]
name = "its-refusal-stands-as-one-key"
count = "keys:telemetry/round-controller/lapsed/"
equals = 1

[[expect]]
name = "no-other-verb-called"
count = "calls"
equals = 1
