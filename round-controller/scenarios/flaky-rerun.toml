description = "a red whose plain rerun on the full tree is green: one attempt of class Flaky on the round's identity, no second verdict for the rerun, no base run, no eject"
repos = ["lane"]

[run]
epoch = 1800000000
passes = 1
every_secs = 60

[judge]
repo = "lane"
batch = "lane-r1"
base = "base-1"
image_digest = "sha256-img-1"

[[judge.member]]
id = "sp-a"
tip = "a1"

[[judge.member]]
id = "sp-b"
tip = "b1"

[judge.result]
exit = 1
red = ["test-lane.sh"]

[[judge.job]]
removal = []
results = ["green"]
secs = 20

[[judge.drive]]
pass = 1

[[expect]]
name = "one-flaky-attempt"
count = "attempts:flaky"
equals = 1

[[expect]]
name = "one-attempt-in-all"
count = "attempts"
equals = 1

[[expect]]
name = "no-identity-written-twice"
count = "identity-repeats"
equals = 0

[[expect]]
name = "only-the-rerun-ran"
count = "launches"
equals = 1

[[expect]]
name = "no-eject-called"
count = "calls:eject"
equals = 0

[[expect]]
name = "recorded"
count = "judged:recorded"
equals = 1

[[expect]]
name = "inverted-a-red-attempt"
count = "attempts:red"
equals = 1
inverted = true
