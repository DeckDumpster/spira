[package]
name = "tsd"
version = "1.0.0"
edition = "2021"
description = "tsd — append-only time-series writer for run/tsd/: the durable, engine-free contract every observation producer writes to (law-producers-stamp-their-own-clock)."

[lib]
name = "tsd"
path = "src/lib.rs"

[[bin]]
name = "tsd-write"
path = "src/main.rs"

[dependencies]
serde_json = "1"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
