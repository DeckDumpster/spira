[package]
name = "watchtower"
version = "1.0.0"
edition = "2021"
autotests = false
description = "watchtower — hands Ops the pipeline's vital signs (the sweep) and the four cheap detectors the sentinel runs every pass (throttle, czar-outcome, pr-stall, disabled-timer). Replaces spira/watchtower.sh and spira/watchtower-czar-outcome.py."

[[test]]
name = "no_fork_edges"
path = "tests/no_fork_edges.rs"
required-features = ["integration"]

[[test]]
name = "stand_down"
path = "tests/stand_down.rs"
required-features = ["integration"]

[[test]]
name = "conditions_on_store"
path = "tests/conditions_on_store.rs"
required-features = ["integration"]

[package.metadata.spira]
test-bins = ["spira-lc", "spira-config", "testenv"]

[features]
integration = ["install/integration", "system-paths/integration", "spira-claim/integration", "forge/integration", "reconciler-engine/integration", "spira-desired-state/integration", "runtime/integration", "spira-config/integration", "spira-store/integration", "spira-ctrl/integration", "strand/integration", "testkit/integration", "cockpit-ops/integration", "spira-test-id/integration", "testenv/integration", "incident/integration"]
[dependencies]
system-paths = { path = "../system-paths" }
install = { path = "../install" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
libc = "0.2"
spira-config = { path = "../spira-config" }
spira-store = { path = "../spira-store" }
spira-ctrl = { path = "../spira-ctrl" }
strand = { path = "../strand" }
runtime = { path = "../runtime" }
spira-desired-state = { path = "../desired-state" }
reconciler-engine = { path = "../reconciler-engine" }
forge = { path = "../forge" }
cockpit-ops = { path = "../cockpit/ops" }
testenv = { path = "../testenv" }
incident = { path = "../incident" }

[lib]
name = "watchtower"
path = "src/lib.rs"

[[bin]]
name = "watchtower"
path = "src/main.rs"

[dev-dependencies]
spira-test-id = { path = "../spira-test-id" }
spira-claim = { path = "../spira-claim" }
testkit = { path = "../testkit" }
