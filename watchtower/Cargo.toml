[package]
name = "watchtower"
version = "1.0.0"
edition = "2021"
description = "watchtower — hands Ops the pipeline's vital signs (the sweep) and the four cheap detectors the sentinel runs every pass (throttle, czar-outcome, pr-stall, disabled-timer). Replaces spira/watchtower.sh and spira/watchtower-czar-outcome.py."

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[[bin]]
name = "watchtower"
path = "src/main.rs"

[dev-dependencies]
testkit = { path = "../testkit" }

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
