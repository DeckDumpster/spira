[package]
name = "watchtower"
version = "1.0.0"
edition = "2021"
autotests = false
description = "watchtower — hands Ops the pipeline's vital signs (the sweep) and the four cheap detectors the sentinel runs every pass (throttle, czar-outcome, pr-stall, disabled-timer). Replaces spira/watchtower.sh and spira/watchtower-czar-outcome.py."

[[test]]
name = "no_fork_edges"
path = "tests/no_fork_edges.rs"
required-features = ["integration"]

[features]
integration = ["runtime/integration", "spira-config/integration", "spira-ctrl/integration", "strand/integration", "testkit/integration"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
libc = "0.2"
spira-config = { path = "../spira-config" }
spira-ctrl = { path = "../spira-ctrl" }
strand = { path = "../strand" }
runtime = { path = "../runtime" }

[lib]
name = "watchtower"
path = "src/lib.rs"

[[bin]]
name = "watchtower"
path = "src/main.rs"

[dev-dependencies]
testkit = { path = "../testkit" }

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
