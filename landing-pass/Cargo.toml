[package]
name = "landing-pass"
version = "2.0.0"
edition = "2021"
autotests = false
description = "landing-pass — the one landing pass for every land mode: pr (its own timer, no local gate), push, hold, queue and queue.local (CHECK 6's worker). Replaces spira/landing.sh."

[lib]
name = "landing_pass"
path = "src/lib.rs"

[[bin]]
name = "landing-pass"
path = "src/main.rs"

[[test]]
name = "no_fork_edges"
path = "tests/no_fork_edges.rs"
required-features = ["integration"]

[features]
integration = ["hel/integration", "mail/integration", "spira-config/integration", "spira-store/integration", "spira-otel/integration", "testkit/integration", "tsd/integration"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
libc = "0.2"
regex = "1"
spira-config = { path = "../spira-config" }
spira-store = { path = "../spira-store" }
spira-otel = { path = "../spira-otel" }
hel = { path = "../hel" }
tsd = { path = "../tsd" }
mail = { path = "../mail" }

[dev-dependencies]
testkit = { path = "../testkit" }
