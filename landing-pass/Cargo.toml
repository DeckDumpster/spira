[package]
name = "landing-pass"
version = "2.0.0"
edition = "2021"
autotests = false
description = "landing-pass — the one landing pass for every land mode: pr (its own timer, no local gate), push, hold, queue and queue.local (CHECK 6's worker). Replaces spira/landing.sh."

[lib]
name = "landing_pass"
path = "src/lib.rs"

[[bin]]
name = "landing-pass"
path = "src/main.rs"

[[test]]
name = "no_fork_edges"
path = "tests/no_fork_edges.rs"
required-features = ["integration"]

[[test]]
name = "landing_tree"
path = "tests/landing_tree.rs"
required-features = ["integration"]

[features]
integration = ["bead/integration", "lifecycle/integration", "hel/integration", "incident/integration", "mail/integration", "spira-config/integration", "spira-store/integration", "spira-otel/integration", "testkit/integration", "tsd/integration", "system-paths/integration", "spira-test-id/integration"]
[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
libc = "0.2"
regex = "1"
lifecycle = { path = "../lifecycle" }
spira-config = { path = "../spira-config" }
spira-store = { path = "../spira-store" }
spira-otel = { path = "../spira-otel" }
hel = { path = "../hel" }
tsd = { path = "../tsd" }
mail = { path = "../mail" }
incident = { path = "../incident" }
system-paths = { path = "../system-paths" }

[dev-dependencies]
spira-test-id = { path = "../spira-test-id" }
testkit = { path = "../testkit" }
bead = { path = "../bead" }
