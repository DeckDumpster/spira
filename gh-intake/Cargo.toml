[package]
name = "gh-intake"
version = "1.0.0"
edition = "2021"
autotests = false
description = "gh-intake — ingest public GitHub issues as beads, with author triage. Replaces spira/gh-intake.sh."

[lib]
name = "gh_intake"
path = "src/lib.rs"

[[bin]]
name = "gh-intake"
path = "src/main.rs"
test = false

[[test]]
name = "no_fork_edges"
path = "tests/no_fork_edges.rs"
required-features = ["integration"]

[features]
integration = []

[dependencies]
lifecycle = { path = "../lifecycle" }
mail = { path = "../mail" }
serde_json = "1"
sha2 = "0.10"
spira-config = { path = "../spira-config" }
spira-otel = { path = "../spira-otel" }
ureq = { version = "2", default-features = false, features = ["tls"] }

[dev-dependencies]
testkit = { path = "../testkit" }
