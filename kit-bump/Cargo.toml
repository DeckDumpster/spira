[package]
name = "kit-bump"
version = "0.1.0"
edition = "2021"
autotests = false
description = "kit-bump — what intake.kit_bump reads of the kit's releases and consuming sites, and how it files and amends their bump beads."

[lib]
name = "kit_bump"
path = "src/lib.rs"

[[test]]
name = "no_fork_edges"
path = "tests/no_fork_edges.rs"
required-features = ["integration"]

[features]
integration = ["bead/integration", "spira-config/integration", "spira-store/integration", "testkit/integration", "spira-test-id/integration"]
[dependencies]
bead = { path = "../bead" }
spira-config = { path = "../spira-config" }
spira-store = { path = "../spira-store" }
serde_json = "1"
ureq = { version = "2", default-features = false, features = ["tls"] }


[dev-dependencies]
spira-test-id = { path = "../spira-test-id" }
testkit = { path = "../testkit" }
