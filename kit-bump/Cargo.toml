[package]
name = "kit-bump"
version = "0.1.0"
edition = "2021"
description = "kit-bump — files one bump bead per consuming site whose pinned kit commit is behind the kit's landing tip, and amends the open one when the kit lands again."

[lib]
name = "kit_bump"
path = "src/lib.rs"

[[bin]]
name = "kit-bump"
path = "src/main.rs"
test = false

[dependencies]
spira-config = { path = "../spira-config" }
install = { path = "../install" }
spira-otel = { path = "../spira-otel" }
serde_json = "1"


[dev-dependencies]
testkit = { path = "../testkit" }

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
