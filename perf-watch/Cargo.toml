[package]
name = "perf-watch"
version = "1.0.0"
edition = "2021"
autotests = false
description = "perf-watch — times the hot read paths end to end, outside the round, and alarms past a limit with the top callers."

[lib]
name = "perf_watch"
path = "src/lib.rs"

[[bin]]
name = "perf-watch"
path = "src/main.rs"
test = false

[[test]]
name = "no_fork_edges"
path = "tests/no_fork_edges.rs"
required-features = ["integration"]

[[test]]
name = "inbox_page"
path = "tests/inbox_page.rs"
required-features = ["integration"]

[features]
integration = ["inbox-rules/integration", "spira-config/integration", "spira-otel/integration", "testkit/integration", "spira-test-id/integration"]
[dependencies]
inbox-rules = { path = "../inbox-rules" }
serde_json = "1"
spira-config = { path = "../spira-config" }
spira-otel = { path = "../spira-otel" }

[dev-dependencies]
spira-test-id = { path = "../spira-test-id" }
testkit = { path = "../testkit" }
