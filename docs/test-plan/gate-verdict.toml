api_version = "test-plan/v1"
area = "gate-verdict"

[[use_case]]
id = "UC-gate-verdict-01"
tier = "T1"
statement = "Every exit goes through `verdict()`, which prints exactly one anchored `gate: VERDICT=<PASS|FAIL|BASE_FAIL|NO_VERDICT> reason=<slug> branch= repo= suite=` line and exits 0/1/76/75 to match."

[[use_case]]
id = "UC-gate-verdict-02"
tier = "T1"
statement = "A FAIL that carries no message is downgraded to NO_VERDICT with `reason=no-evidence:<orig>` (sp-io5j backstop)."

[[use_case]]
id = "UC-gate-verdict-03"
tier = "T1"
statement = "An unreadable repo-map gives NO_VERDICT `no-repo-map-file` (this used to be a silent PASS). A repo absent from the map gives NO_VERDICT `no-repo-map`."

[[use_case]]
id = "UC-gate-verdict-04"
tier = "T2"
statement = "An unresolvable branch or base gives NO_VERDICT (`no-diff` / `no-base`), exit 75. The message names `base...branch`, the repo and git's `fatal:` line."

[[use_case]]
id = "UC-gate-verdict-05"
tier = "T2"
statement = "Universal layer: a changed `*.sh` that fails `bash -n` gives FAIL `syntax`. So does beads data anywhere in the branch tree (`beads-data`). A branch that vendors a foreign harness copy gives FAIL `foreign-harness`. If `exclude.sh` or `skew.sh` is missing, or skew exits 3, the result is NO_VERDICT (`missing-exclude`, `missing-skew`, `skew-init-fault`)."

[[use_case]]
id = "UC-gate-verdict-06"
tier = "T2"
statement = "A repo whose map row has an empty gate column passes with `reason=syntax-only`, and the VERDICT line is still printed."

[[use_case]]
id = "UC-gate-verdict-07"
tier = "T2"
statement = "If a gate command names `bash <path>` and that path is absent from the base, the result is NO_VERDICT `cmd-missing-file` naming the path, never BASE_FAIL. Once the path exists, the command runs. (sp-lkzl)"

[[use_case]]
id = "UC-gate-verdict-08"
tier = "T1"
statement = "covers:-based selection. A suite is selected when its covers: names a changed file, or when it has no covers:, or when it is a meta suite covering `spira/test-*.sh`. A suite covering only unchanged files is not selected. A suite added by the branch is present on the branch tree and absent on the base. `SPIRA_GATE_FILES` overrides the computed diff."

[[use_case]]
id = "UC-gate-verdict-09"
tier = "T1"
statement = "Suites in `SPIRA_GATE_EJECTED_SUITES` (CSV) are always added. A suite that is both covered and ejected appears once. An ejected suite that no longer exists is skipped. (sp-px6ng)"

[[use_case]]
id = "UC-gate-verdict-10"
tier = "T2"
statement = "The gate command receives the env contract: `SPIRA_GATE_BRANCH`, `_BASE`, `_SELECT_HEAD` (= the branch on *both* trials), `_FILES`, `_HOST_CORES` (= `host_cores()`, not `nproc`), `_EJECTED_SUITES`, `_SUITES`."

[[use_case]]
id = "UC-gate-verdict-11"
tier = "T1"
statement = "`host_cores` returns `getconf _NPROCESSORS_ONLN` even when `nproc` is cgroup-limited. `governor.sh` writes `SP_CORES` from it."

[[use_case]]
id = "UC-gate-verdict-12"
tier = "T1"
statement = "Base-trial attribution. Branch red and base green gives FAIL `branch-red`. The same suite red on both gives BASE_FAIL `base-red`, naming the suite and carrying the base output. Base reds that are all timeouts give NO_VERDICT `base-timeout`. Genuine reds plus timeouts give BASE_FAIL. Suites red only on the branch give FAIL even when the base is red elsewhere. An unnamed red on both gives `suite=-`. A base trial that exits 75/124 or cannot check out gives NO_VERDICT `base-untestable`."

[[use_case]]
id = "UC-gate-verdict-13"
tier = "T2"
statement = "A branch trial killed at `SPIRA_GATE_TIMEOUT` gives NO_VERDICT `timeout`, naming the budget and the command, and is not cached. A branch trial exiting 75 gives NO_VERDICT `harness-fault`. (sp-p4rl)"

[[use_case]]
id = "UC-gate-verdict-14"
tier = "T2"
statement = "A red verdict carries the command's full early diagnostics, not a `tail -20` window. A passing gate does not print them."

[[use_case]]
id = "UC-gate-verdict-15"
tier = "T1"
statement = "Verdict cache. The key is repo + tree + changed files + command + harness bytes (gate.sh, exclude.sh, skew.sh) + `SPIRA_GATE_SUITES`. Only PASS is cached. Reuse is metered `rc=0 cached`. A landing on the base does not invalidate an un-rebased branch. A restored command finds its old entry. A verdict older than `SPIRA_VERDICT_TTL` is refused, as is an entry without `at=` or a non-numeric TTL. (sp-0v8)"

[[use_case]]
id = "UC-gate-verdict-16"
tier = "T3"
statement = "Gates on different branches run concurrently in separate trees and never see each other's content. Gates on the same branch serialise, and the wait is metered `waited=Ns`. (sp-64v0)"

[[use_case]]
id = "UC-gate-verdict-17"
tier = "T2"
statement = "A gate that cannot get its tree lock within `SPIRA_GATE_LOCK_WAIT` gives NO_VERDICT `lock-timeout` (\"not a fault\") and never removes the holder's tree. Missing `flock` or an unopenable lockfile gives NO_VERDICT (`no-flock`, `no-lockfile`). (sp-d8h0r)"

[[use_case]]
id = "UC-gate-verdict-18"
tier = "T2"
statement = "Tree lifecycle. PASS keeps the detached worktree for reuse. Non-PASS removes it, but only when this process held the lock. A worktree that cannot be created gives NO_VERDICT `tree-unidentified`."

[[use_case]]
id = "UC-gate-verdict-19"
tier = "T2"
statement = "`gate-locks.sh` reports FREE, HELD (with PID) or STALE. A lock whose holder PID is dead but whose PGID has a live member (inherited fd) is HELD. A lock that does not exist is not listed."

[[use_case]]
id = "UC-gate-verdict-20"
tier = "T2"
statement = "`gate-sweep.sh` removes stale `.gate.<repo>[.<key>]` worktrees and orphaned `/tmp/spira-batch-*` homes. It keeps any tree whose lock is held (and says so), young trees, and homes with a live container. (sp-ic8n, sp-q7d72)"

[[use_case]]
id = "UC-gate-verdict-21"
tier = "T3"
statement = "Under contention (N aeon gates plus a landing pass with a small lock wait), every gate reaches a verdict. None is starved to 75, no tree is crossed, landing verdicts come from the cache, and the whole soak finishes inside its deadline."

[[use_case]]
id = "UC-gate-verdict-22"
tier = "T2"
statement = "Yield recording. Every non-PASS verdict is recorded with branch, bead, suite and tree. Gating the same tree twice records one red. A red tree changed to PASS becomes inferred DEFECT. BASE_FAIL arrives as GATE_FAULT. A failing recorder never changes the verdict or the exit code. (sp-1xb0)"

[[use_case]]
id = "UC-gate-verdict-23"
tier = "T1"
statement = "Yield reporting. The configured window (`SPIRA_YIELD_WINDOW`) excludes older reds. A stated `classify` overrides an inferred one and keeps its reason. Classify refuses an unknown branch or an invalid verdict. Cost is split solo vs contended and excludes cached passes. An absent record or log renders `?`, never 0. A recorder that shows reds in the meter log but has an empty record is reported `silent` and withholds its counts."

[[use_case]]
id = "UC-gate-verdict-24"
tier = "T0"
statement = "Yield reaches Ops and the cockpit: `watchtower --show` carries the yield columns, and every `SP_YIELD_*` key is written by the collector, read by the pane and defaults to `?`."

[[use_case]]
id = "UC-gate-verdict-25"
tier = "T2"
statement = "Metering. Every verdict reached after the lock writes one `gate.log` row (rc, waited, ran). Preflight refusals write none. The EXIT trap is disarmed so a verdict is never metered twice, and a `set -e` death or signal is still metered once."
