api_version = "test-plan/v1"
area = "landing-merge-queue"

[[use_case]]
id = "UC-landing-merge-queue-01"
tier = "T3"
statement = "A closed queue-mode branch whose gate passes is `CERTIFIED` at its tip. Main is unchanged and the bead stays closed."

[[use_case]]
id = "UC-landing-merge-queue-02"
tier = "T1"
statement = "A certified tip is not gated again. A moved tip invalidates the record and is certified again. A tip that has not moved since its `RED` mark is skipped (CHECK6)."

[[use_case]]
id = "UC-landing-merge-queue-03"
tier = "T3"
statement = "A gate FAIL or a failed rebase at certification reopens the bead and marks it `RED`. Main is unchanged. The reopen note (the tail of the gate output) names the offending file:line."

[[use_case]]
id = "UC-landing-merge-queue-04"
tier = "T1"
statement = "Certification order is (priority ASC, closed_at ASC). In the phase-2 tiers, never-gated branches come before moved-tip `RED` branches."

[[use_case]]
id = "UC-landing-merge-queue-05"
tier = "T1"
statement = "When the pass budget cannot fit a gate, the pass certifies nothing. It logs one budget cut naming the first deferred branch and the deferred count. Successive passes cover disjoint sets."

[[use_case]]
id = "UC-landing-merge-queue-06"
tier = "T3"
statement = "Gates run in parallel up to `SPIRA_CERTIFY_PAR`, and each branch is certified in completion order."

[[use_case]]
id = "UC-landing-merge-queue-07"
tier = "T1"
statement = "When CI is idle and nothing is certified, a branch is certified as sole batch member without a gate. When CI is busy, or `?`, the gate runs."

[[use_case]]
id = "UC-landing-merge-queue-08"
tier = "T1"
statement = "With `SPIRA_GATE_SUITES=off`, certification is fences-only and uses a distinct gate cache key. Push mode never gets the switch."

[[use_case]]
id = "UC-landing-merge-queue-09"
tier = "T1"
statement = "The gate lock wait defaults to 2 × `SPIRA_GATE_TIMEOUT`. An operator value is honoured. When the pass budget is shorter, the wait is capped and logged as rc=75 contention."

[[use_case]]
id = "UC-landing-merge-queue-10"
tier = "T2"
statement = "When the base is red (`BASE_FAIL`), branches are held, not reopened. The pass files exactly one incident per red base (with suite, repo, \"no attempt charged\", and gate output) and logs any recurrence. Held branches land once the base is green."

[[use_case]]
id = "UC-landing-merge-queue-11"
tier = "T1"
statement = "A `basefail:<repo>:<suite>` bead is gated first, is exempt from the budget, and is certified while the base is red. Without one, nothing is certified."

[[use_case]]
id = "UC-landing-merge-queue-12"
tier = "T1"
statement = "The watchtower admission throttle behaves as follows: at depth ≥ engage with drain, it writes the stamp and files an incident with a stable ref. On a stall, it files a fault instead. It lifts with hysteresis. The `off` override clears it, and a halted world skips it. Depth counts only live, unlanded `CERTIFIED` records."

[[use_case]]
id = "UC-landing-merge-queue-13"
tier = "T3"
statement = "An uncontested branch lands by ancestry and advances the operator checkout. The pass records `bead.landed`."

[[use_case]]
id = "UC-landing-merge-queue-14"
tier = "T3"
statement = "A push rejected because the base moved is retried and lands the branch's own commits. The next pass does not land it again. A rejection that is not a race is not called a race, and neither case reopens the bead."

[[use_case]]
id = "UC-landing-merge-queue-15"
tier = "T3"
statement = "A pass reopens a bead only for a failure it can attribute: a failed gate (`bead.reopened`) or a real conflict naming the file. A parallel-duplicate note names the bead that already landed."

[[use_case]]
id = "UC-landing-merge-queue-16"
tier = "T2"
statement = "`rebase_branch` classifies `no-branch`, `no-base`, `conflict` and `rebase-refused` (keeping git's reason), and names the conflicting files. It succeeds without an ambient git identity by using `SPIRA_GIT_NAME/EMAIL`. Every arm in landing.sh reads `REBASE_FAILURE`."

[[use_case]]
id = "UC-landing-merge-queue-17"
tier = "T3"
statement = "A branch reaped or slain mid-pass, or between a race and its retry, is never reported as a conflict. The pass says whether the work is on the base."

[[use_case]]
id = "UC-landing-merge-queue-18"
tier = "T3"
statement = "After a landing moves the base, withheld survivors are rebased at once. A survivor that truly conflicts is reopened, naming the landing. A branch held by a live aeon is never rewritten or landed."

[[use_case]]
id = "UC-landing-merge-queue-19"
tier = "T2"
statement = "Repeated rebase failures escalate at `SPIRA_REBASE_ESCALATE_AT` instead of reopening, exactly once. A merge-conflict event is written once per (tip, base)."

[[use_case]]
id = "UC-landing-merge-queue-20"
tier = "T2"
statement = "PR mode opens one PR per branch and posts once. It refreshes on base movement without opening a second PR. It leaves a MERGED PR alone. It never rewrites a branch when gh cannot say the PR state. Past the refresh cap it escalates once."

[[use_case]]
id = "UC-landing-merge-queue-21"
tier = "T3"
statement = "The pass skips a superseded closed bead's branch instead of reopening it. The other branches still land."

[[use_case]]
id = "UC-landing-merge-queue-22"
tier = "T2"
statement = "The bead scan issues one bulk `bd show`. A branch with no bead is never landed. A bead without a `repo:` label lands in the swept repo. A bead reopened during its gate is not landed and not reopened again."

[[use_case]]
id = "UC-landing-merge-queue-23"
tier = "T1"
statement = "The pass prunes verdict-cache entries older than `SPIRA_VERDICT_TTL` and reports a reused verdict."

[[use_case]]
id = "UC-landing-merge-queue-24"
tier = "T2"
statement = "`landing.sh halt` stops a running pass: it kills the pass, writes an interrupt record and removes the run state. It deletes orphan `spira/queue/*` branches and keeps the one named by the open record. Dry-run and idle forms exit honestly."

[[use_case]]
id = "UC-landing-merge-queue-25"
tier = "T2"
statement = "After a land, the post-land step rebuilds a cargo binary when it is absent and its unit is enabled. It never rebuilds without cargo."

[[use_case]]
id = "UC-landing-merge-queue-26"
tier = "T0"
statement = "Every land mode declared in the header is handled in `land_repo`. `land_mark`, `land_state` and `land_mark_at` have one implementation (lib.sh). The landing worktree is never rebased. Every fetch uses `--no-write-fetch-head`."

[[use_case]]
id = "UC-landing-merge-queue-27"
tier = "T1"
statement = "`submit` accepts only `spira/<id>` and `spira-suite-state/*` branches. It runs the gate against the named repo (or the home repo) and certifies the branch with a queue record. A refusal writes no state. A gate fail writes no landstate. `suites.sh` quarantine/disable/activate each submit a transition branch."

[[use_case]]
id = "UC-landing-merge-queue-28"
tier = "T1"
statement = "`flush` runs the builder now with wait=0 and refuses push-mode and unknown repos. `step` runs the verdict before the batch. Landing's queue pass calls `queue.sh step`."

[[use_case]]
id = "UC-landing-merge-queue-29"
tier = "T1"
statement = "`eject` writes `RED` at the tip, reopens the bead (clearing the assignee, with a comment), closes the PR, removes the record and returns the survivors to `CERTIFIED` at their tips. `abandon` does the same, except that it leaves `EJECTED`/`RED` members untouched, archives the record as `closed-pr<N>-<ts>Z` and passes `--reason` to the forge. Each refuses a non-member or a missing batch."

[[use_case]]
id = "UC-landing-merge-queue-30"
tier = "T2"
statement = "Every queue operation (eject, abandon, batch, verdict) refuses and changes nothing while another holds the per-repo lock. Stderr written after taking the lock reaches the caller. `--dry-run` prints the plan and changes nothing."

[[use_case]]
id = "UC-landing-merge-queue-31"
tier = "T1"
statement = "`queue_sort_rows` keeps every row when the priority JSON is over 128 KiB, orders by priority with suite-state transitions first, and fails open on bad JSON."

[[use_case]]
id = "UC-landing-merge-queue-32"
tier = "T1"
statement = "`queue.sh protect` sets branch protection on the repo's base branch and writes a receipt. Doctor warns on a queue repo that has no receipt and is silent for push mode."

[[use_case]]
id = "UC-landing-merge-queue-33"
tier = "T1"
statement = "`queue.sh stats` reports the local red rate, the batch and member counts, cost, and caught/escaped counts from the meter lines."

[[use_case]]
id = "UC-landing-merge-queue-34"
tier = "T2"
statement = "The count/wait/idle/express predicate table was batch.sh's own trigger; the batcher crate's `should_cut` replaces it with an adaptive pool size and an idle-since-last-arrival check, plus main-red and express stacking onto an open PR. Covered by `batcher/src/core/tests.rs` (replay) and `spira/test-batcher-cut.sh` (wiring), not this file."

[use_case.uncovered]
reason = "retired (sp-vsob2): The count/wait/idle/express predicate table was batch.sh's own trigger; the batcher crate's `should_cut` replaces it with an adaptive pool s"
date = "2026-09-27"
bead = "sp-vsob2"

[[use_case]]
id = "UC-landing-merge-queue-35"
tier = "T2"
statement = "An open batch record or a held flock prevents a second batch; batch.sh's own DIRTY-PR check (UC-36) still runs against it every pass. The unrecorded-open-`spira/queue/*`-PR mail this UC used to include was part of batch.sh's own PR-open tail and was retired with it (sp-vsob2) — nothing currently detects that race."

[[use_case]]
id = "UC-landing-merge-queue-36"
tier = "T2"
statement = "An open batch PR reported DIRTY is abandoned: the PR is closed, the record removed, BATCHED members return to `CERTIFIED`, `RED` stays `RED`, and the operator is mailed. A CLEAN PR is left alone."

[[use_case]]
id = "UC-landing-merge-queue-37"
tier = "T1"
statement = "Before a batch, and even while one is open, landstate is reconciled: tip in base → `LANDED`; branch gone → `LANDED` if its tip is in base or it appears in reap.log, else `LOST`, never a member, with mail; a branch advanced after certification → a stale-certification log with both SHAs, and `LANDED` only when the live tip equals base; a closed bead with `RED`/`EJECTED` and a live branch → closed-red-live mail. Landstate records without a trailing newline are read."

[[use_case]]
id = "UC-landing-merge-queue-38"
tier = "T2"
statement = "The citation-aware conflict handling (declared/named citation, an automatic rebase attempt before reopening) was part of batch.sh's own member-merge loop. The batcher's own conflict handling (section F) is simpler by design: a member whose tip conflicts with base is reopened for rebase directly, with no citation check and no automatic rebase attempt of its own — see `batcher/src/core.rs`'s `stale_retry_due` and `spira/test-batcher-cut.sh` case C. `bead_cited_commit_on_base` itself is not retired — aeon.sh still uses it — and its own unit cases stay in `test-batch-cited-commit.sh`."

[use_case.uncovered]
reason = "retired (sp-vsob2): The citation-aware conflict handling (declared/named citation, an automatic rebase attempt before reopening) was part of batch.sh's own memb"
date = "2026-09-27"
bead = "sp-vsob2"

[[use_case]]
id = "UC-landing-merge-queue-39"
tier = "T1"
statement = "Member ordering (suite-state transitions first) was `queue_sort_rows`, called from batch.sh's own build step. The batcher orders by its own `order_key` (`batcher/src/core.rs`) instead."

[use_case.uncovered]
reason = "retired (sp-vsob2): Member ordering (suite-state transitions first) was `queue_sort_rows`, called from batch.sh's own build step. The batcher orders by its own "
