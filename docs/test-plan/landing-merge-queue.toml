[[use_case]]
id = "UC-landing-merge-queue-40"
tier = "T2"
statement = "`SPIRA_QUEUE_LOCAL_GATE` and the fast-suites-only local gate it toggled are gone: the batcher's own round already runs the full corpus locally before opening a PR (a superset of what this gate covered), and a red with no reproducing member is not blindly opened — it is classified (flip on rerun vs. double-red) and, on a double-red, filed for the summoned batcher persona's judgement (sp-47kq1) rather than ejected by reproduction. See `batcher/src/core.rs`'s `classify`/`judgement_for` and `spira/test-batcher-cut.sh` case B."

[use_case.uncovered]
reason = "retired (sp-vsob2): `SPIRA_QUEUE_LOCAL_GATE` and the fast-suites-only local gate it toggled are gone: the batcher's own round already runs the full corpus local"
