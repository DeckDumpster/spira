bead = "sp-vsob2"

[[use_case]]
id = "UC-landing-merge-queue-41"
tier = "T1"
statement = "The PR body lists `id — title`, or `(title unavailable)`. The title says `beads for <repo>`. `format_batch` (a declared formatter adds a format commit on the batch branch only, and a formatter failure never blocks the PR) is no longer applied to the batcher's own automatic batches — it survives only as a primitive `queue.sh open-batch` (the hand tool) still calls."

[[use_case]]
id = "UC-landing-merge-queue-42"
tier = "T1"
statement = "A queue with no BATCHED/LANDED movement for longer than `SPIRA_QUEUE_STUCK_AGE` mails once and sets a flag. The flag clears when movement resumes, and the alert fires again on a new stall. Depth alone never alerts. A queue with no history is skipped, with a log line."

[[use_case]]
id = "UC-landing-merge-queue-43"
tier = "T1"
statement = "With no open batch, the forge is not called. A pending run within CI max is left alone. A run past CI max (per-repo override honoured) with no recent activity is cancelled, not rerun. A run is aged by max(run start, step activity)."

[use_case.uncovered]
reason = "suite test-verdict-action.sh retired with verdict.sh (queue/DESIGN-verdict.md, sp-flj4a); behaviour now verified by queue unit tests tests::verdict::classifiers_match_the_table, tests::verdict::no_open_batch_never_calls_the_forge, tests::verdict::pending_waits_while_the_run_is_young_or_progressing_and_cancels_a_stuck_one and real::tests::context_seam_carries_the_verdict_thresholds_with_the_per_repo_override"
date = "2026-09-30"
bead = "sp-flj4a"

[[use_case]]
id = "UC-landing-merge-queue-44"
tier = "T1"
statement = "A harness fault or provision fault reruns the workflow and bumps retries, with no eject or bisect. When retries run out, the PR is closed, members return to `CERTIFIED`, and the operator is mailed once."

[use_case.uncovered]
reason = "suite test-verdict-action.sh retired with verdict.sh (queue/DESIGN-verdict.md, sp-flj4a); behaviour now verified by queue unit tests tests::verdict::harness_fault_reruns_within_the_budget_then_closes_and_returns_members and tests::verdict::classifiers_match_the_table"
date = "2026-09-30"
bead = "sp-flj4a"

[[use_case]]
id = "UC-landing-merge-queue-45"
tier = "T3"
statement = "A green batch on an unchanged base fast-forwards. Members become `LANDED` and flaky annotations are recorded. The batch record and the batch branch (local and remote) are deleted."

[[use_case]]
id = "UC-landing-merge-queue-46"
tier = "T2"
statement = "When a green batch's base has moved, the PR is closed and members return to `CERTIFIED`, or become `LANDED` when their tips are in the new base. When the CI head SHA differs from the sealed head, nothing is pushed and the operator is mailed."

[[use_case]]
id = "UC-landing-merge-queue-47"
tier = "T2"
statement = "For a red batch, the red suites are replayed per member, with an all-suites fallback and diff attribution limited to the member's own change. Only the guilty member is ejected, with the failing assertion in its note. Survivors are merged again onto the same PR. A together-only or unannotated red halves the batch. An unreproduced red requeues, and a second unreproduced red at the same tip ejects."

[[use_case]]
id = "UC-landing-merge-queue-48"
tier = "T2"
statement = "Attribution is not fooled by flaky or odd input. A suite that fails and then passes on retry does not eject, and one that is always red does. A gate-classified red is not quarantined as flaky. A could-not-judge member (exit 2) does not exonerate a guilty one and is named in the mail. The ejected set is deterministic."

[[use_case]]
id = "UC-landing-merge-queue-49"
tier = "T3"
statement = "Replays run in parallel up to MAXPAR. A TERM signal logs `interrupted after`."

[use_case.uncovered]
reason = "behaviour retired, not ported: verdict-owned per-member CI replay attribution and its TERM log went with verdict.sh (queue/DESIGN-verdict.md D1, D6; sp-flj4a) — a queue.forge red goes to batcher judgement-ci; suite test-verdict-replay.sh deleted"
date = "2026-09-30"
bead = "sp-flj4a"

[[use_case]]
id = "UC-landing-merge-queue-50"
tier = "T0"
statement = "The verdict timer runs `spira-verdict.sh`, which calls `queue.sh step` for each repo. The service has `TimeoutStartSec` ≥ 3600 and no CPUQuota."

[[use_case]]
id = "UC-landing-merge-queue-51"
tier = "T1"
statement = "CI park is classified from the land mode: in pr mode it is `watch` until `SPIRA_CI_PARK_MAX` and then `expired`; push, hold and unmapped repos are `no-ci`; an unparseable timestamp gives `watch` with rc 2; 0 disables the deadline; junk falls back to 5400."

[[use_case]]
id = "UC-landing-merge-queue-52"
tier = "T1"
statement = "`gate-check` discovers `--branch` once per distinct unbound-gate branch and never calls a bare discover or discovers for push repos. It then runs `gate check`. It reports a gate with no await_id as stuck. It parses ESCALATE lines for any `SPIRA_ID_PREFIX`. Its stderr is silent on a clean pass."

[[use_case]]
id = "UC-landing-merge-queue-53"
tier = "T2"
statement = "bd's own gh:run gates behave as the harness expects: a gated bead leaves `ready`, and resolution is scoped to `metadata.repo`."

[[use_case]]
id = "UC-landing-merge-queue-54"
tier = "T1"
statement = "`forge.sh` maps gh JSON to the line protocol for every verb Spira consumes: check-status (`pending`/`green`/`red`/`harness_fault`/`provision_fault`, `red-suite:`, `head-sha:`), runs-active (`?` never 0), run-metadata (max activity), workflow-rerun (never `--failed`, cancels in-progress), and also pr-mergeability, pr-list-queue, batch-ci-status, queued-since, run-id and pr-number."

[[use_case]]
id = "UC-landing-merge-queue-55"
tier = "T1"
statement = "The broker refuses verbs outside its policy table, and refuses czar-only verbs from any other fayth, without calling gh. Shadow mode records CZAR-WOULD. Act mode executes and audits. The read verbs shape gh argv exactly."

[[use_case]]
id = "UC-landing-merge-queue-56"
tier = "T1"
statement = "`pve.sh` refuses to make an HTTP call when credentials or the CA are missing. It always passes `--cacert` and never `--insecure`, and routes each verb to its API path."

[[use_case]]
id = "UC-landing-merge-queue-57"
tier = "T2"
statement = "When a bead with a GitHub ref lands, its issue is commented (short SHA + link) and closed once, with a marker. An unlanded bead's issue is never closed. Backfill decides landed-ness by ancestry of `spira: land <id>`. The unlanded scan asks once, logs refusals, and marks issues already closed on the forge."
