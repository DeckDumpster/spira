statement = "delivers: typed evidence. `beads` needs at least one child. `note` and `report` need a path, an existing file, and an mtime after `started_at`. `check:<cmd>` needs a command that exits 0. `action` is accepted as is. An unknown type, or a missing path or command, fails. A failed delivers claim falls through to the commit check (commit OR evidence), and the reopen note names both reasons. The retired `no-payload` label exempts nothing."

