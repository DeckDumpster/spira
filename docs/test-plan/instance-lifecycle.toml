[use_case.uncovered]
reason = "the behaviour itself is retired, not merely untested: release install-tarball drops the live-aeon guard by design (release/DESIGN.md \"install-tarball: differences from activate\") — under runtime-is-a-release an aeon's worktree is never under spira-releases/, so there is nothing left for an install to disrupt. The daemon-reload-and-restart half is covered (every active spira-*.service restarts, not only non-aeon ones, a named difference in the same section)"
date = "2026-09-30"
bead = "sp-jsnbm"

