reason = "test-install-conflicts.sh retired: it sourced root install.sh directly for its five _conflict_* functions, which is gone (sp-31dm0). The five predicates are install::guards::conflict_foreign/conflict_aeon/conflict_lock/conflict_instance_arg/conflict_instance_run/conflict_dolt now, proved by cargo test -p install: guards::tests::conflict_foreign_is_clear_when_no_unit_is_installed_or_it_matches, conflict_aeon_matches_the_full_argv_entry_only, conflict_lock_is_clear_unless_the_gate_tree_lock_is_held, conflict_instance_arg_is_clear_unless_it_disagrees_with_the_existing_config, conflict_instance_run_is_clear_unless_another_instance_shares_the_run_dir, conflict_dolt_is_clear_unless_a_different_data_dir_is_being_served — not by a spira/test-*.sh suite this matrix can see"
