[package]
name = "reconciler"
version = "1.0.0"
edition = "2021"
autotests = false
description = "Structural-invariant control loop: desired state vs observed state, gaps and deterministic remedies."

[[test]]
name = "no_fork_edges"
path = "tests/no_fork_edges.rs"
required-features = ["integration"]

[features]
integration = ["mail/integration", "reconciler-engine/integration", "runtime/integration", "spira-config/integration", "spira-store/integration", "spira-ctrl/integration", "spira-desired-state/integration", "spira-otel/integration", "testkit/integration", "tsd/integration"]

[dependencies]
spira-otel = { path = "../spira-otel" }
spira-config = { path = "../spira-config" }
spira-store = { path = "../spira-store" }
libc = "0.2"
spira-ctrl = { path = "../spira-ctrl" }
reconciler-engine = { path = "../reconciler-engine" }
tsd = { path = "../tsd" }
spira-desired-state = { path = "../desired-state" }
runtime = { path = "../runtime" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"


[dev-dependencies]
testkit = { path = "../testkit" }
mail = { path = "../mail" }

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
