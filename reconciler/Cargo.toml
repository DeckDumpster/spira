[package]
name = "reconciler"
version = "1.0.0"
edition = "2021"
description = "Structural-invariant control loop: desired state vs observed state, gaps and deterministic remedies."

[dependencies]
spira-otel = { path = "../spira-otel" }
spira-config = { path = "../spira-config" }
libc = "0.2"
spira-ctrl = { path = "../spira-ctrl" }
reconciler-engine = { path = "../reconciler-engine" }
tsd = { path = "../tsd" }
spira-desired-state = { path = "../desired-state" }
runtime = { path = "../runtime" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"


[dev-dependencies]
testkit = { path = "../testkit" }
mail = { path = "../mail" }

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
