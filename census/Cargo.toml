[package]
name = "census"
version = "1.0.0"
edition = "2021"
description = "census — Mimir census: failure classes ranked, with open-remedy suppression. Replaces spira/census.sh."

[lib]
name = "census"
path = "src/lib.rs"

[[bin]]
name = "census"
path = "src/main.rs"
test = false

[features]
integration = []

[dependencies]
spira-config = { path = "../spira-config" }
dwarf = { path = "../dwarf" }
serde_json = "1"

[profile.release]
opt-level = "z"
