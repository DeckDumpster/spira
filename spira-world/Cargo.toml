[package]
name = "spira-world"
version = "1.0.0"
edition = "2021"
autotests = false
description = "spira-world — stop/start/drain/resume the loop, the dwarf fleet ceiling, and slaying one dwarf cleanly. Replaces spira/world.sh, spira/dwarves.sh, spira/slay.sh."

[lib]
name = "spira_world"
path = "src/lib.rs"

[[bin]]
name = "world"
path = "src/bin/world.rs"

[[bin]]
name = "dwarves"
path = "src/bin/dwarves.rs"
test = false

[[bin]]
name = "slay"
path = "src/bin/slay.rs"

[[test]]
name = "no_fork_edges"
path = "tests/no_fork_edges.rs"
required-features = ["integration"]

[[test]]
name = "world_planes"
path = "tests/world_planes.rs"
required-features = ["integration"]

[features]
integration = ["hel/integration", "mail/integration", "runtime/integration", "spira-config/integration", "spira-store/integration", "spira-ctrl/integration", "spira-otel/integration", "testkit/integration", "tsd/integration", "system-paths/integration", "spira-test-id/integration"]
[dependencies]
system-paths = { path = "../system-paths" }
spira-otel = { path = "../spira-otel" }
spira-ctrl = { path = "../spira-ctrl" }
spira-config = { path = "../spira-config" }
spira-store = { path = "../spira-store" }
libc = "0.2"
mail = { path = "../mail" }
tsd = { path = "../tsd" }
hel = { path = "../hel" }
serde_json = "1"
runtime = { path = "../runtime" }
serde = { version = "1", features = ["derive"] }

[dev-dependencies]
spira-test-id = { path = "../spira-test-id" }
testkit = { path = "../testkit" }
