[package]
name = "spira-world"
version = "1.0.0"
edition = "2021"
description = "spira-world — stop/start/drain/resume the loop, the dwarf fleet ceiling, and slaying one dwarf cleanly. Replaces spira/world.sh, spira/dwarves.sh, spira/slay.sh."

[lib]
name = "spira_world"
path = "src/lib.rs"

[[bin]]
name = "world"
path = "src/bin/world.rs"
test = false

[[bin]]
name = "dwarves"
path = "src/bin/dwarves.rs"
test = false

[[bin]]
name = "slay"
path = "src/bin/slay.rs"
test = false

[dependencies]
spira-otel = { path = "../spira-otel" }
spira-ctrl = { path = "../spira-ctrl" }
spira-config = { path = "../spira-config" }
hel = { path = "../hel" }
serde_json = "1"

[dev-dependencies]
testkit = { path = "../testkit" }
