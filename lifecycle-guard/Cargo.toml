[package]
name = "lifecycle-guard"
version = "1.0.0"
edition = "2021"
description = "lifecycle-guard — static analyser: refuses any path that reaches the lifecycle store by anything but the machine."

[features]
integration = ["spira-config/integration", "spira-store/integration", "spira-otel/integration", "testkit/integration", "spira-test-id/integration"]
[dependencies]
spira-otel = { path = "../spira-otel" }
spira-config = { path = "../spira-config" }
spira-store = { path = "../spira-store" }
tree-sitter = "=0.22.6"
tree-sitter-bash = "=0.21.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
walkdir = "2"
regex = "1"

[dev-dependencies]
spira-test-id = { path = "../spira-test-id" }
testkit = { path = "../testkit" }

[[bin]]
name = "lifecycle-guard"
path = "src/main.rs"
