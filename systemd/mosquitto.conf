# Rendered by install into the run directory; edits there are overwritten.
# One Unix-socket listener (port 0) and no TCP: access is the socket's file mode.
listener 0 @SPIRA_BROKER_SOCKET@
allow_anonymous true
persistence false
sys_interval 0
# 0 lets a client connect with keep-alive 0: a dead client is seen by its socket closing.
max_keepalive 0
# Errors and warnings only, so an idle broker writes nothing to the journal.
log_dest stderr
log_type error
log_type warning
connection_messages false
