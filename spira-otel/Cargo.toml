[package]
name = "spira-otel"
version = "1.0.0"
edition = "2021"
description = "spira-otel — one OTLP/JSON span per call, appended as a line to a daily-rotated file in the OpenTelemetry Collector file-exporter format."

[dependencies]
# opentelemetry-proto "trace" pulls opentelemetry_sdk, which locks rand 0.9 (with getrandom 0.3, rand_chacha 0.9, rand_core 0.9) beside the 0.8 line.
opentelemetry-proto = { version = "0.30", default-features = false, features = ["trace", "metrics", "logs", "gen-tonic-messages", "with-serde"] }
prost = { version = "0.13", default-features = false, features = ["std"] }
serde = { version = "1", features = ["derive"] }
libc = "0.2"
serde_json = "1"

[dev-dependencies]
testkit = { path = "../testkit" }
